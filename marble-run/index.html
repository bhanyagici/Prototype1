<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Marble Run</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#3a2a1d;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:"Arial Rounded MT Bold","Nunito","Baloo 2","Trebuchet MS",system-ui,sans-serif}
  #app{position:absolute;left:0;top:0;width:900px;height:1950px;transform-origin:0 0;overflow:hidden;background:#e6c999}
  #gl{position:absolute;left:0;top:0;width:900px;height:1950px;display:block}
  .ui{position:absolute;z-index:5}
  .spring{transition:transform .38s cubic-bezier(.34,1.9,.5,1),filter .2s}
  .spring:active,.spring.pressed{transform:scale(.86);transition:transform .08s ease-out}
  /* ---- top bar: chunky glossy candy controls with a honey rim ---- */
  #levelPill{left:30px;top:36px;height:80px;padding:0 42px;border-radius:44px;display:flex;align-items:center;max-width:330px;
    color:#fff;font-size:44px;font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:linear-gradient(#7d8fd6,#4a5aa8 55%,#36428a);border:7px solid #ffcf3a;
    box-shadow:0 8px 0 #c48410,0 14px 22px rgba(0,0,0,.3),inset 0 -7px 0 rgba(20,24,80,.35),inset 0 4px 0 rgba(255,255,255,.4);
    text-shadow:0 4px 0 #25306e,0 0 3px #25306e;animation:drop .5s cubic-bezier(.34,1.6,.5,1) both}
  #levelPill::before,.rbtn::before{content:'';position:absolute;left:12%;right:12%;top:6%;height:40%;border-radius:999px;
    background:linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.08));pointer-events:none}
  #levelPill::before{left:6%;right:6%;height:42%}
  .rbtn{width:90px;height:90px;border-radius:50%;top:32px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,#f0bd83,#c98a4e 58%,#a86c35);border:7px solid #ffcf3a;color:#fff;
    box-shadow:0 8px 0 #c48410,0 14px 22px rgba(0,0,0,.3),inset 0 -7px 0 rgba(90,45,10,.38),inset 0 4px 0 rgba(255,255,255,.4);cursor:pointer;
    animation:drop .5s cubic-bezier(.34,1.6,.5,1) both}
  .rbtn svg{position:relative;width:50px;height:50px;filter:drop-shadow(0 4px 0 rgba(110,55,15,.85))}
  #btnRestart,#btnSettings{display:none} #btnPause{right:32px;animation-delay:.15s} #btnSpeed{right:132px;animation-delay:.1s}
  #btnSpeed{font-size:38px;font-weight:900;text-shadow:0 4px 0 #7a4512,0 0 2px #7a4512;letter-spacing:-1px}
  #btnSpeed.long{font-size:27px;letter-spacing:-1.5px}
  #btnSpeed.on{background:radial-gradient(circle at 50% 30%,#ffe98e,#ffb21f 58%,#ea8400);text-shadow:0 4px 0 #a35a00;border-color:#fff4c2}
  #timer{right:242px;top:44px;width:150px;height:74px;box-sizing:border-box;border-radius:37px;display:flex;align-items:center;justify-content:center;gap:8px;
    color:#fff;font-size:36px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.5px;background:rgba(60,36,16,.62);border:5px solid rgba(255,207,58,.9);
    box-shadow:0 6px 0 rgba(150,100,10,.8),0 10px 16px rgba(0,0,0,.25);text-shadow:0 3px 0 rgba(0,0,0,.35);pointer-events:none;animation:drop .5s cubic-bezier(.34,1.6,.5,1) .12s both}
  #timer svg{width:30px;height:30px;flex:none} #timer.paused{border-color:#fff;background:rgba(60,36,16,.82)} #timer.paused b{opacity:.55}
  @keyframes drop{from{transform:translateY(-140px)}to{transform:none}}
  /* ---- progress: marbles in boxes ---- */
  #progress{left:30px;top:134px;height:56px;padding:0 20px 0 12px;border-radius:30px;display:flex;align-items:center;gap:12px;pointer-events:none;
    background:rgba(255,247,234,.92);box-shadow:0 5px 0 rgba(120,80,30,.35);color:#5a3b1a;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
  #progress i{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#ff7aa8 13%,#e0245e 70%);flex:none}
  #progress .bar{width:150px;height:18px;border-radius:10px;background:#e3d2b6;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.2)}
  #progress .bar b{display:block;height:100%;width:0;background:linear-gradient(#6fd86f,#35a83c);border-radius:10px;transition:width .25s}
  /* ---- toast ---- */
  #toast{left:50%;top:60%;transform:translate(-50%,-50%) scale(.85);padding:22px 40px;border-radius:30px;background:rgba(90,30,20,.9);color:#fff;
    font-size:40px;font-weight:900;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.34,1.7,.5,1);z-index:15}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  /* ---- booster bar: three round placeholders on the toy chest's lid (no effect yet) ---- */
  #boosters{box-sizing:border-box;left:0;right:0;bottom:0;height:120px;display:flex;align-items:center;justify-content:center;gap:64px;z-index:6;pointer-events:none}
  .boost{position:relative;width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;
    background:radial-gradient(circle at 50% 30%,#f0bd83,#c98a4e 58%,#a86c35);border:7px solid #ffcf3a;
    box-shadow:0 8px 0 #c48410,0 12px 18px rgba(0,0,0,.3),inset 0 -7px 0 rgba(90,45,10,.38),inset 0 4px 0 rgba(255,255,255,.4);filter:saturate(.8)}
  .boost::before{content:'';position:absolute;left:16%;right:16%;top:7%;height:36%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.05));pointer-events:none}
  .boost svg{position:relative;width:56px;height:56px;filter:drop-shadow(0 4px 0 rgba(110,55,15,.85))}
  .boost i{position:absolute;right:-10px;top:-10px;width:44px;height:44px;border-radius:50%;background:#fff3df;border:5px solid #ffcf3a;color:#8a5a28;
    font:900 26px/34px inherit;font-style:normal;text-align:center;box-shadow:0 4px 0 #c48410}
  .boost.wob{animation:wob .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes wob{0%{transform:rotate(0)}25%{transform:rotate(-9deg) scale(.94)}55%{transform:rotate(7deg)}100%{transform:none}}
  /* ---- panels ---- */
  .panel{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(40,25,15,.45)}
  .panel.show{display:flex;animation:fade .35s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{width:640px;padding:54px 40px 60px;border-radius:44px;text-align:center;color:#fff;box-sizing:border-box;
    background:linear-gradient(#e7a65f,#bf7834);border:8px solid #ffc531;
    box-shadow:0 10px 0 #c98a12,0 24px 50px rgba(0,0,0,.4);animation:pop .55s cubic-bezier(.3,1.7,.45,1)}
  .card.fail{background:linear-gradient(#ff8a65,#e0483a)}
  @keyframes pop{from{transform:scale(.35) rotate(-4deg)}to{transform:scale(1)}}
  .card h1{margin:0 0 14px;font-size:66px;font-weight:900;text-shadow:0 5px 0 rgba(0,0,0,.25)}
  .card p{margin:0 0 40px;font-size:36px;opacity:.95}
  .card button{font:inherit;font-size:50px;font-weight:900;color:#fff;padding:20px 80px;border-radius:40px;
    background:linear-gradient(#7be35b,#3fae2a);border:6px solid #fff;box-shadow:0 8px 0 #23801a;cursor:pointer}
  .card button + button{margin-top:22px}
  .card .stats{margin:26px 0 0;font-size:28px;opacity:.85}
  #pausePanel{z-index:40} #pausePanel .card{width:560px;padding:44px 40px 50px}
  #pausePanel button{display:block;width:100%;box-sizing:border-box;padding:18px 20px;font-size:44px}
  #pausePanel button + button{margin-top:20px}
  #pmRestart,#pmSettings{background:linear-gradient(#f0bd83,#c98a4e)!important;box-shadow:0 8px 0 #8a5a28!important}
  #pmMenu{background:linear-gradient(#8f9fe0,#5a6ac0)!important;box-shadow:0 8px 0 #36428a!important}
  /* ---- settings ---- */
  #setPanel{z-index:45} #setPanel .card{width:660px;padding:40px 36px 44px;text-align:left}
  #setPanel h1{text-align:center}
  .setrow{margin:18px 0 0} .setrow label{display:block;font-size:28px;font-weight:900;margin:0 0 8px;opacity:.9}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{font:inherit;font-size:28px;font-weight:900;padding:12px 18px;border-radius:22px;border:4px solid rgba(255,255,255,.75);color:#5a3b1a;
    background:#fff3df;box-shadow:0 5px 0 rgba(120,70,20,.5);cursor:pointer}
  .chip.on{background:linear-gradient(#7d8fd6,#4a5aa8);color:#fff;border-color:#fff;box-shadow:0 5px 0 #25306e}
  #zoom{width:100%;height:40px;accent-color:#4a5aa8}
  #setPanel .close{display:block;margin:34px auto 0;padding:18px 70px;font-size:44px}
  /* ---- tutorial hand, tip, hint ---- */
  #hand{width:130px;height:160px;pointer-events:none;display:none;z-index:18;transform:translate(-30%,-8%);filter:drop-shadow(0 6px 4px rgba(0,0,0,.35));animation:tap 1s ease-in-out infinite}
  @keyframes tap{0%,100%{margin-top:0}50%{margin-top:22px}}
  #tip{left:50%;transform:translateX(-50%);top:57%;padding:16px 30px;border-radius:26px;background:rgba(255,247,234,.95);color:#5a3b1a;font-size:34px;font-weight:900;
    display:none;white-space:nowrap;box-shadow:0 6px 0 rgba(120,80,30,.35);z-index:18;pointer-events:none}
  #hint{left:50%;top:150px;transform:translateX(-50%);padding:14px 26px;border-radius:24px;background:rgba(74,90,168,.92);color:#fff;font-size:30px;font-weight:900;
    display:none;white-space:nowrap;z-index:18;pointer-events:none}
  #introPanel .card{width:680px} #introArt{display:flex;gap:18px;justify-content:center;align-items:center;margin:10px 0 26px;font-size:60px}
  #introArt .m{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
  #introArt .b{width:110px;height:76px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
  /* ---- stats ---- */
  #statsPanel{z-index:30} #statsPanel .card{width:780px;max-height:80%;overflow:auto}
  #statsBody table{width:100%;border-collapse:collapse;font-size:26px} #statsBody td,#statsBody th{padding:6px 8px;border-bottom:2px solid rgba(255,255,255,.3)}
  #statsPanel .row{display:flex;gap:16px;justify-content:center;margin-top:26px} #statsPanel .row button{font-size:32px;padding:14px 30px}
  /* ---- debug ---- */
  #dbg{left:24px;top:200px;max-width:820px;display:none;padding:14px 18px;border-radius:16px;background:rgba(30,16,10,.78);
    color:#fff3df;font:600 22px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;pointer-events:none}
  #botTag{left:34px;top:200px;display:none;padding:8px 18px;border-radius:20px;background:#ff4f7b;color:#fff;font-size:28px;font-weight:900;box-shadow:0 4px 0 #b02750}
  /* ---- level pack (window.MR_SHARE.nav): previous / next, "Level x / n", stats ---- */
  #app:not(.nav) .rbtn.nav{display:none}
  #app.nav .rbtn{box-sizing:border-box;width:84px;height:84px;top:36px;z-index:21}
  #app.nav #levelPill{z-index:21} #introPanel{z-index:30}
  #app.nav .rbtn svg{width:44px;height:44px}
  #app.nav #btnSpeed{right:110px;font-size:34px} #app.nav #btnStats{right:200px}
  #app.nav #btnPause{right:20px} #app.nav #timer{right:292px;top:42px;width:96px;height:72px;font-size:30px;padding:0 4px} #app.nav #timer svg{display:none}
  #app.nav #btnPrev{left:20px} #app.nav #btnNextLv{left:430px}
  #app.nav #levelPill{box-sizing:border-box;left:112px;width:310px;max-width:310px;height:84px;padding:0 14px;justify-content:center;font-size:40px}
  #app.nav #btnHome{display:none} #app.home #btnHome{display:flex;left:20px} #app.home.nav #btnPrev{left:112px} #app.home.nav #levelPill{left:204px;width:220px;font-size:34px} #app.home.nav #btnNextLv{left:432px}
  #btnHome{display:none}
  /* ---- showcase (window.MR_SHARE.showcase): a start menu of level cards by category, one settings panel ---- */
  #menuPanel{z-index:40;display:none;flex-direction:column;align-items:stretch;justify-content:flex-start;
    background:linear-gradient(#ffe7bd,#fbf1de 30%,#f3e2c4);overflow:hidden}
  #menuPanel.show{display:flex}
  #menuHead{position:relative;flex:none;padding:46px 40px 26px;text-align:center}
  #menuHead h1{margin:0;font-size:84px;font-weight:900;color:#fff;letter-spacing:1px;
    text-shadow:0 6px 0 #c4621a,0 10px 18px rgba(0,0,0,.25),-3px -3px 0 #c4621a,3px -3px 0 #c4621a,-3px 3px 0 #c4621a,3px 3px 0 #c4621a}
  #menuHead p{margin:10px 0 0;font-size:30px;font-weight:800;color:#7a4a1c}
  #menuSet{position:absolute;right:30px;top:44px;width:84px;height:84px}
  #menuEdit{position:absolute;left:30px;top:44px;width:84px;height:84px}
  #menuList{flex:1;overflow-y:auto;padding:0 30px 60px;touch-action:pan-y}
  .mcat{margin:26px 0 8px;font-size:46px;font-weight:900;color:#5a3418}
  .mgrp{margin:18px 4px 10px;font-size:30px;font-weight:900;color:#9a6a3a;text-transform:uppercase;letter-spacing:1px}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .mcard{position:relative;border-radius:30px;background:#fff;border:5px solid #ffcf3a;box-shadow:0 7px 0 #d39a1c,0 12px 20px rgba(80,50,20,.18);
    overflow:hidden;cursor:pointer;text-align:left}
  .mcard.last{border-color:#ff8a2a;box-shadow:0 7px 0 #c4621a,0 12px 20px rgba(80,50,20,.25)}
  .mcard img{display:block;width:100%;aspect-ratio:5/6;object-fit:cover;background:#ead2a6}
  .mcard b{display:block;padding:12px 14px 4px;font-size:29px;font-weight:900;color:#4a2c14;line-height:1.1}
  .mcard .tags{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px 14px}
  .tag{padding:4px 10px;border-radius:12px;font-size:19px;font-weight:900;color:#fff;background:#a58e72;white-space:nowrap}
  .tag.d1{background:#3fb24f} .tag.d2{background:#e8a91c} .tag.d3{background:#ef7b2d} .tag.d4{background:#d9433a}
  .tag.ln{background:#4a5aa8} .tag.bk{background:#8b5cd6} .tag.ty{background:#e94f9a}
  /* the funnel: numbered tiles played in order (a check on the won ones, the next one to play highlighted) */
  .mcard .mnum{display:flex;align-items:center;justify-content:center;aspect-ratio:5/4;font-size:96px;font-weight:900;color:#fff;
    background:linear-gradient(#ffb36b,#ff8a2a 60%,#e06a12);text-shadow:0 6px 0 #a3480a}
  .mcard.won .mnum{background:linear-gradient(#8fe07a,#3fae2a 60%,#2b8a1c);text-shadow:0 6px 0 #1d6612}
  .mcard.won .mnum::after{content:'✓';position:absolute;right:16px;top:10px;font-size:44px}
  .mcard.nextup{border-color:#4a5aa8;box-shadow:0 7px 0 #25306e,0 0 0 6px rgba(74,90,168,.35),0 12px 20px rgba(80,50,20,.25)}
  .mtools{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 14px} .mtools button,.mcathead button{font:inherit;font-size:17px;font-weight:900;color:#fff;border:3px solid #fff;
    border-radius:14px;padding:6px 7px;background:linear-gradient(#8f9fe0,#4a5aa8);box-shadow:0 4px 0 #25306e;cursor:pointer}
  .mtools button.del{background:linear-gradient(#ff8a65,#e0483a);box-shadow:0 4px 0 #a8321f}
  .mcathead{display:flex;align-items:center;justify-content:space-between;gap:16px} .mcathead button{font-size:24px;padding:8px 16px}
  /* the editor inside the showcase: over the whole window (not the scaled game), and its level picker */
  #edHost{position:fixed;inset:0;z-index:1000;display:none;background:#16203a} #edHost.show{display:block}
  #edHost iframe{width:100%;height:100%;border:0;display:block}
  #edPick{position:fixed;inset:0;z-index:1001;display:none;align-items:center;justify-content:center;background:rgba(30,18,10,.55);font-family:system-ui,sans-serif}
  #edPick.show{display:flex}
  #edPick .box{width:min(560px,94vw);max-height:86vh;display:flex;flex-direction:column;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.4);overflow:hidden}
  #edPick header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#5a3418;color:#fff;font-weight:800;font-size:18px}
  #edPick header button{font:inherit;font-size:16px;border:0;border-radius:10px;padding:6px 12px;background:#ffcf3a;color:#5a3418;cursor:pointer}
  #edPick .list{overflow-y:auto;padding:8px 14px 16px}
  #edPick h4{margin:14px 0 6px;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:#9a6a3a}
  #edPick .lv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:16px;padding:8px 10px;margin:2px 0;border:0;border-radius:10px;background:#fbf1de;cursor:pointer}
  #edPick .lv:hover{background:#ffe2b0} #edPick .lv code{font-size:13px;color:#9a6a3a}
  #statsBody tr.cur td{background:rgba(255,207,58,.28)} #statsBody tr.tot td{border-top:4px solid #ffcf3a;background:rgba(0,0,0,.12)} #statsBody .none{opacity:.45}
  #levelStep{left:30px;top:200px;padding:4px 16px;border-radius:16px;background:rgba(40,25,15,.55);color:#fff;font-size:26px;font-weight:800;display:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" width="900" height="1950"></canvas>
  <div class="ui" id="levelPill">Marble Run</div>
  <div class="ui" id="levelStep"></div>
  <div class="ui rbtn spring" id="btnHome" title="Back to the menu"><svg viewBox="0 0 48 48"><path d="M7 23L24 8l17 15" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 21v18h24V21" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg></div>
  <div class="ui rbtn spring nav" id="btnPrev" title="Previous level"><svg viewBox="0 0 48 48"><path d="M29 9L14 24l15 15" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="ui rbtn spring nav" id="btnNextLv" title="Next level"><svg viewBox="0 0 48 48"><path d="M19 9l15 15-15 15" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="ui rbtn spring nav" id="btnStats" title="Stats"><svg viewBox="0 0 48 48"><rect x="7" y="25" width="9" height="16" rx="2.5" fill="#fff"/><rect x="19.5" y="13" width="9" height="28" rx="2.5" fill="#fff"/><rect x="32" y="19" width="9" height="22" rx="2.5" fill="#fff"/></svg></div>
  <div class="ui rbtn spring" id="btnRestart" title="Restart"><svg viewBox="0 0 48 48"><path d="M24 9a15 15 0 1 1-13.6 8.7" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M6 8l4.4 10.4L21 14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="ui rbtn spring" id="btnSpeed" title="Game speed">1x</div>
  <div class="ui" id="timer" title="Level time"><svg viewBox="0 0 48 48"><circle cx="24" cy="26" r="17" fill="none" stroke="#fff" stroke-width="5"/><path d="M24 15v11l7 5" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><rect x="19" y="3" width="10" height="6" rx="2" fill="#fff"/></svg><b>0:00</b></div>
  <div class="ui rbtn spring" id="btnPause" title="Pause (P)"><svg viewBox="0 0 48 48"><rect x="12" y="9" width="9" height="30" rx="3" fill="#fff"/><rect x="27" y="9" width="9" height="30" rx="3" fill="#fff"/></svg></div>
  <div class="ui rbtn spring" id="btnSettings" title="Settings"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="8" fill="none" stroke="#fff" stroke-width="5"/></svg></div>
  <div class="ui" id="progress"><i></i><span class="bar"><b id="barFill"></b></span><span id="count">0/0</span></div>
  <div class="ui" id="toast"></div>
  <div class="ui" id="boosters" aria-label="Boosters (coming soon)">
    <div class="boost spring" title="Booster (coming soon)"><svg viewBox="0 0 48 48"><path d="M14 34l20-20M30 10l8 8M10 30l8 8" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg><i>3</i></div>
    <div class="boost spring" title="Booster (coming soon)"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="12" fill="none" stroke="#fff" stroke-width="6"/><path d="M24 6v8M24 34v8M6 24h8M34 24h8" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg><i>3</i></div>
    <div class="boost spring" title="Booster (coming soon)"><svg viewBox="0 0 48 48"><rect x="10" y="16" width="28" height="22" rx="5" fill="none" stroke="#fff" stroke-width="6"/><path d="M16 16v-4a8 8 0 0 1 16 0v4" fill="none" stroke="#fff" stroke-width="6"/></svg><i>3</i></div>
  </div>

  if (game){ updateScene(rt, gdt); updateHud(); updateTimer(); endPanels(rt); if (params.has('debug')) debugPanel(); }
}
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  pump(dt);
  renderer.render(scene, camera);
}
function debugPanel(){ const d = $('dbg'); d.style.display = 'block';
  d.textContent = `t ${game.t.toFixed(2)}  landed ${game.landed}/${game.total}  slots ${game.slots.map(s => s < 0 ? '-' : game.boxes[s].color[0] + game.boxes[s].got + '/' + game.boxes[s].size).join(' ')}\n` +
    `flow ${game.flow.length}  arrivals ${game.arrivals.length}  timers ${game.timers.length}  result ${game.result || '-'}`; }
function logLevel(){
  const ck = C.checkLevel(N);
  console.log(`[level] "${N.name}" (${levelSource}) — ${ck.totalMarbles} marbles, ${ck.boxes} boxes, ${N.trays.length} trays, ${N.laneCount} lanes`);
  console.log('[level] marbles vs holes per colour: ' + ck.perColor.filter(p => p.marbles || p.holes).map(p => `${p.color} ${p.marbles}/${p.holes}`).join('  ') + `  ->  ${ck.balanced ? 'ALL MATCH' : 'MISMATCH'}`);
  if (ck.warnings.length) console.warn('[level] warnings: ' + ck.warnings.map(w => w.msg).join('; '));
  if (params.has('nosim') || (SHARE && SHARE.nosim) || EMBED || params.has('test')) return;
  const serial = levelSerial;
  if (SYNC) SYNC.testInBackground(N, 200).then(r => { if (serial !== levelSerial) return;
    console.log(`[sim] greedy bot: ${r.greedy.result.toUpperCase()} — ${r.greedy.sends} sends, ${r.greedy.landed} marbles, ${r.greedy.t.toFixed(1)} s of game time`);
    console.log(`[sim] random bot: ${r.wins}/${r.runs} wins (${(r.rate*100).toFixed(1)}%) — difficulty ${r.label}`); }).catch(e => console.warn('[sim] failed', e));
}

/* ------------------------------ the showcase ------------------------------
   window.MR_SHARE.showcase: {categories:[{name, ordered?, groups:[{name, levels:[ids]}]}], cards:{id:{diff, blockers, toys,
   num, role}}, thumbs:{id:data url}} over the pack of every level.  It opens on a start menu of level cards by category;
   in play the home button goes back to it and previous / next stay inside the level's category.  The menu's pencil
   opens the level editor (carried inside as base64) over the whole window: it edits a copy of any level, and Save keeps
   that copy in My Levels under the next free suffix of its id (f30 -> f30_1, f30_2, ...) - the showcase's own levels
   never change.  My Levels is the menu's last category: play, edit again, export as JSON, delete, or export them all. */
const SC = SHARE && SHARE.showcase && pack ? SHARE.showcase : null;
const SC_LAST = 'showcase-last', DIFF_N = {'Easy':1, 'Medium':2, 'Hard':3, 'Very Hard':4};
const escH = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[c]);
let menuOpen = false;
function catRange(i){
  if (!SC) return [0, pack ? pack.length - 1 : 0];
  const id = pack[i] && pack[i].id, cat = SC.categories.find(c => c.groups.some(g => g.levels.includes(id)));
  if (!cat) return [0, pack.length - 1];
  const idx = cat.groups.flatMap(g => g.levels).map(x => pack.findIndex(l => l.id === x)).filter(k => k >= 0);
  return [Math.min(...idx), Math.max(...idx)];
}
function buildMenu(){
  syncMyLevels();
  const st = store.get(statsKey(), {}), last = store.get(SC_LAST, null), list = $('menuList'); list.innerHTML = '';
  for (const cat of SC.categories){
    const h = document.createElement('div'); h.className = 'mcat'; h.textContent = cat.name; list.append(h);
    if (cat.mine){ h.className = 'mcat mcathead'; h.innerHTML = `<span>${escH(cat.name)}</span><button id="myExportAll">Export all</button>`;
      h.querySelector('button').onclick = e => { e.stopPropagation(); audio(); exportMine(null); }; }
    // the funnel: played in order - the first level not won yet is the one to play next
    const nextUp = cat.ordered ? cat.groups[0].levels.find(id => !(st[id] && st[id].wins)) : null;
    for (const grp of cat.groups){
      if (grp.name){ const g = document.createElement('div'); g.className = 'mgrp'; g.textContent = grp.name; list.append(g); }
      const grid = document.createElement('div'); grid.className = 'mgrid'; list.append(grid);
      for (const id of grp.levels){
        const i = pack.findIndex(l => l.id === id); if (i < 0) continue;
        const lv = pack[i], c = (SC.cards && SC.cards[id]) || {}, card = document.createElement('div'), won = !!(st[id] && st[id].wins);
        card.className = 'mcard spring' + (id === last ? ' last' : '') + (c.num && won ? ' won' : '') + (id === nextUp ? ' nextup' : ''); card.dataset.id = id;
        const tags = [];
        if (c.role) tags.push(`<span class="tag">${escH(c.role)}</span>`);
        if (c.diff) tags.push(`<span class="tag d${DIFF_N[c.diff] || 2}">${escH(c.diff)}</span>`);
        tags.push(`<span class="tag ln">${(lv.lanes || []).length} lanes</span>`);
        (c.blockers || []).forEach(b => tags.push(`<span class="tag bk">${escH(b)}</span>`));
        (c.toys || []).forEach(b => tags.push(`<span class="tag ty">${escH(b)}</span>`));
        const pic = c.num ? `<div class="mnum">${c.num}</div>` : `<img alt="" src="${(SC.thumbs && SC.thumbs[id]) || c.pic || ''}">`;
        card.innerHTML = `${pic}<b>${escH(lv.name || id)}</b><div class="tags">${tags.join('')}</div>` +
          (cat.mine ? `<div class="mtools"><button data-a="edit">Edit</button><button data-a="export">Export</button><button data-a="del" class="del">Delete</button></div>` : '');
        card.addEventListener('click', e => { const a = e.target.closest('[data-a]'); audio();
          if (a){ e.stopPropagation(); if (a.dataset.a === 'edit') openEditor(lv, true); else if (a.dataset.a === 'export') exportMine(id); else deleteMine(id); return; }
          store.set(SC_LAST, id); closeMenu(); goPack(i); });
        grid.append(card);
      }
    }
  }
}
function openMenu(){
  if (paused) closePause(); for (const id of ['winPanel', 'failPanel', 'donePanel', 'statsPanel', 'setPanel', 'introPanel']) $(id).classList.remove('show');
  buildMenu(); $('menuPanel').classList.add('show'); menuOpen = true;
  const cur = $('menuList').querySelector('.mcard.last'); if (cur) cur.scrollIntoView({block:'center'});
}
function closeMenu(){ $('menuPanel').classList.remove('show'); menuOpen = false; }
const MY_KEY = 'my-levels';
const myLevels = () => (store.get(MY_KEY, {levels:[]}).levels || []).filter(l => l && l.id && l.slide && l.lanes);
function syncMyLevels(){                            // My Levels: in the pack and as the menu's last category
  if (!SC) return;
  const mine = myLevels(), ids = mine.map(l => l.id);
  mine.forEach(lv => { lv.mine = true; const k = pack.findIndex(l => l.id === lv.id); if (k >= 0) pack[k] = lv; else pack.push(lv); });
  for (let k = pack.length - 1; k >= 0; k--) if (pack[k].mine && !ids.includes(pack[k].id)) pack.splice(k, 1);
  mine.forEach(lv => { SC.cards = SC.cards || {}; SC.cards[lv.id] = Object.assign({}, SC.cards[lv.id], {pic:miniMap(lv)}); });
  SC.categories = SC.categories.filter(c => !c.mine);
  if (mine.length) SC.categories.push({name:'My Levels', mine:true, groups:[{name:null, levels:ids}]});
}
const miniCache = new Map();
function miniMap(lv){                               // a small picture of a level: its slide and trays from above
  const key = JSON.stringify([lv.slide, lv.trays.map(r => [r.at, r.side, r.shape, r.tilt, r.rows, r.columns.length])]); if (miniCache.has(key)) return miniCache.get(key);
  let url = '';
  try { const Lm = C.buildLayout(C.normalizeLevel(JSON.parse(JSON.stringify(lv)))), SLm = Lm.SLIDE, cv = document.createElement('canvas'); cv.width = 250; cv.height = 300;
    const pts = []; for (let i = 0; i < SLm.n; i += 4) pts.push([SLm.P[i*3], SLm.P[i*3+2]]);
    Lm.TRAYS.forEach(r => r.outline.forEach(q => pts.push(q)));
    const x0 = Math.min(...pts.map(q => q[0])) - 1, x1 = Math.max(...pts.map(q => q[0])) + 1, z0 = Math.min(...pts.map(q => q[1])) - 1, z1 = Math.max(...pts.map(q => q[1])) + 1;
    const k = Math.min(250/(x1 - x0), 300/(z1 - z0)), ox = (250 - (x1 - x0)*k)/2, oz = (300 - (z1 - z0)*k)/2;
    const x = cv.getContext('2d'), sx = v => ox + (v - x0)*k, sz = v => oz + (v - z0)*k; x.fillStyle = '#e6c999'; x.fillRect(0, 0, 250, 300);
    x.lineCap = x.lineJoin = 'round'; x.strokeStyle = '#ff8a2a'; x.lineWidth = 2*C.RO*k; x.beginPath();
    for (let i = 0; i < SLm.n; i += 2){ const X = sx(SLm.P[i*3]), Z = sz(SLm.P[i*3+2]); i ? x.lineTo(X, Z) : x.moveTo(X, Z); } x.stroke();
    Lm.TRAYS.forEach(r => { x.beginPath(); r.outline.forEach((q, j) => j ? x.lineTo(sx(q[0]), sz(q[1])) : x.moveTo(sx(q[0]), sz(q[1]))); x.closePath(); x.fillStyle = '#c99a5a'; x.fill(); x.strokeStyle = '#7a5428'; x.lineWidth = 2; x.stroke();
      lv.trays[r.src].columns.forEach((col, ci) => col.forEach((cell, ri) => { const m = C.parseCell(cell); if (!m) return; const q = r.slots[ci][ri];
        x.beginPath(); x.arc(sx(q.x), sz(q.z), Math.max(1.5, C.R_M*k*0.9), 0, 7); x.fillStyle = m.hidden ? '#9aa1ad' : C.HEX[m.color]; x.fill(); })); });
    url = cv.toDataURL('image/png'); } catch (e) {}
  miniCache.set(key, url); return url;
}
function saveMine(level){                           // a copy under the next free suffix of its id: never over another level
  const base = String(level.id || 'level').replace(/_\d+$/, ''), taken = new Set(pack.map(l => l.id).concat(myLevels().map(l => l.id)));
  let n = 1; while (taken.has(base + '_' + n)) n++;
  const lv = JSON.parse(JSON.stringify(level)); delete lv.mine; lv.id = base + '_' + n;
  const all = myLevels().map(l => { const o = Object.assign({}, l); delete o.mine; return o; }); all.push(lv); store.set(MY_KEY, {levels:all});
  return lv.id;
}
function deleteMine(id){ store.set(MY_KEY, {levels:myLevels().filter(l => l.id !== id).map(l => { const o = Object.assign({}, l); delete o.mine; return o; })}); buildMenu(); }
function exportMine(id){                            // one level as <id>.json, or all of them as my-levels.json
  const clean = l => { const o = JSON.parse(JSON.stringify(l)); delete o.mine; return o; }, mine = myLevels();
  const data = id ? clean(mine.find(l => l.id === id)) : {type:'marble-run-levels', version:1, levels:mine.map(clean)};
  const a = document.createElement('a'), url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
  a.href = url; a.download = (id || 'my-levels') + '.json'; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
let edPending = null, edReady = false;
function openEditor(level, mine){
  let host = $('edHost');
  if (!host){ const src = document.getElementById('mr-editor'); if (!src) return false;
    host = document.createElement('div'); host.id = 'edHost'; document.body.append(host);
    const bin = atob(src.textContent.trim()), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const html = new TextDecoder().decode(bytes).replace('<head>', '<head><script>window.MR_EDITOR_HOST = "showcase";<\/script>');
    const f = document.createElement('iframe'); f.id = 'edFrame'; f.title = 'Level editor'; host.append(f); f.srcdoc = html; }
  host.classList.add('show'); closeMenu(); edFit();
  if (game && !game.result && !paused) openPause();                 // (the game waits behind the editor)
  edPending = {level:JSON.parse(JSON.stringify(level)), mine:!!mine}; delete edPending.level.mine;
  if (edReady) edSend();
  return true;
}
// the editor is laid out for a desktop window: in a narrower one (a phone) it is laid out 1280 px wide and scaled down
// to the window's width, so every part of it stays on the screen
const ED_W = 1280;
function edFit(){ const f = $('edFrame'); if (!f) return; const k = Math.min(1, innerWidth/ED_W);
  Object.assign(f.style, k < 1 ? {width:ED_W + 'px', height:innerHeight/k + 'px', transform:`scale(${k})`, transformOrigin:'0 0'} : {width:'', height:'', transform:'', transformOrigin:''}); }
addEventListener('resize', edFit);
function edSend(){ if (!edPending) return; $('edFrame').contentWindow.postMessage({source:'mr-showcase', type:'open', level:edPending.level, mine:edPending.mine}, '*'); edPending = null; }
function closeEditor(){ const h = $('edHost'); if (h) h.classList.remove('show'); $('edPick').classList.remove('show'); openMenu(); }
function openPicker(){                              // every level of the showcase (and My Levels): pick one to edit
  syncMyLevels(); const box = $('edPick').querySelector('.list'); box.innerHTML = '';
  for (const cat of SC.categories){ const h4 = document.createElement('h4'); h4.textContent = cat.name; box.append(h4);
    for (const id of cat.groups.flatMap(g => g.levels)){ const lv = pack.find(l => l.id === id); if (!lv) continue;
      const b = document.createElement('button'); b.className = 'lv'; b.innerHTML = `<span>${escH(lv.name || id)}</span><code>${escH(id)}</code>`;
      b.onclick = () => { $('edPick').classList.remove('show'); openEditor(lv, !!cat.mine); }; box.append(b); } }
  $('edPick').classList.add('show');
}
if (SC){
  window.MR_SC = {openMenu};
  app.classList.add('home', 'sc');
  const pk = document.createElement('div'); pk.id = 'edPick'; pk.innerHTML = '<div class="box"><header><span>Edit a level</span><button>Close</button></header><div class="list"></div></div>';
  pk.querySelector('header button').onclick = () => pk.classList.remove('show'); document.body.append(pk);
  $('menuEdit').addEventListener('click', () => { audio(); openPicker(); });
  $('menuSet').addEventListener('click', () => { audio(); openSettings(); });
  $('btnHome').addEventListener('click', () => { audio(); openMenu(); });
  addEventListener('message', e => { const m = e.data || {}; if (m.source !== 'mr-editor') return; const f = $('edFrame');
    if (m.type === 'ready'){ edReady = true; edSend(); }
    else if (m.type === 'save' && m.level){ const id = saveMine(m.level); syncMyLevels(); f.contentWindow.postMessage({source:'mr-showcase', type:'saved', id}, '*'); }
    else if (m.type === 'pick') openPicker();
    else if (m.type === 'close') closeEditor(); });
}

/* ------------------------------ start ------------------------------ */
function setBot(on){ botOn = !!on; botT = 0; $('botTag').style.display = botOn ? 'block' : 'none'; }
if (botOn) $('botTag').style.display = 'block';
if (SHARE && Array.isArray(SHARE.levels) && SHARE.levels.length){ pack = SHARE.levels; if (SHARE.nav !== false && pack.length > 1){ app.classList.add('nav'); if (!SC) $('levelStep').style.display = 'block'; }
  goPack(clamp((+params.get('n') || 1) - 1, 0, pack.length - 1));
  if (SC && !params.has('n')) openMenu(); }                  // the showcase opens on its menu
else {
  const id = params.get('level') || (SHARE && SHARE.level), lv = id && C.PRESETS[id];
  loadLevel(lv || C.LEVEL_DATA, lv ? 'preset' : 'builtin');
}
/* the editor's preview: it sends {type:'run'|'watch', level} (watch: the greedy bot plays it), 'restart', and its
   camera switch and zoom; the game answers 'hello' when it is ready and 'game-status' after each level it loads */
function onMessage(d){
  if (!d || typeof d !== 'object') return;
  try {
    if ((d.type === 'run' || d.type === 'watch' || d.type === 'level') && d.level) loadLevel(d.level, 'editor', {bot:d.type === 'watch'});
    else if (d.type === 'restart') resetGame();
    else if (d.type === 'camera') setView(d.view);
    else if (d.type === 'zoom') setZoom(d.zoom);
  } catch (err) { console.warn(err); }
}
if (EMBED && !SHARE){ addEventListener('message', e => { if (e.source === parent) onMessage(e.data); });
  parent.postMessage({type:'hello'}, '*'); }
requestAnimationFrame(frame);

/* test hooks */
window.__mr = {
  C, THREE, get game(){ return game; }, get L(){ return L; }, get N(){ return N; }, get camera(){ return camera; }, prefs, V, sorter, get toys(){ return toys; },
  loadLevel, resetGame, tap, laneAt, screenOf, setTheme, setSupports, setView, setZoom, setSpeed, openPause, closePause, openSettings,
  get paused(){ return paused; }, get timeScale(){ return timeScale; }, get levelSource(){ return levelSource; }, get serial(){ return levelSerial; },
  get embed(){ return EMBED; }, get botOn(){ return botOn; }, setBot, get pack(){ return pack; }, get packIdx(){ return packIdx; }, goPack,
  get showcase(){ return SC; }, openMenu, closeMenu, get menuOpen(){ return menuOpen; }, catRange, openEditor, saveMine, myLevels, syncMyLevels, packStep,
  stats(){ return store.get(statsKey(), {}); },
  advance(sec){ const n = Math.round(sec/C.SIM_DT); for (let i = 0; i < n && !(game.result === 'fail' && acc > 3); i++) pump(C.SIM_DT/timeScale); },
  render(){ renderer.render(scene, camera); }, renderer, scene,
  marbleWorld(id){ const p = marblePos(game.marbles[id], V.marbles[id], game.t + acc, new THREE.Vector3()); return p ? [p.x, p.y, p.z] : null; },
  boxWorld(id){ const p = V.boxes[id].g.position; return [p.x, p.y, p.z]; }, boxVisible(id){ return V.boxes[id].g.visible; },
  laneScreen(l){ const q = game.lanes[l]; const id = q[0]; if (id == null) return null; const p = V.boxes[id].g.position; return screenOf(p.x, p.y + 0.1, p.z); },
};
