<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match Express — Level Editor</title>
<style>
  :root{--bg:#1d2333;--panel:#262d40;--panel2:#2f3850;--line:#3c4663;--text:#e8ecf6;--mute:#9aa4bd;--accent:#4aa8ff;--ok:#3fbf62;--bad:#ff5a5f;--warn:#ffb020}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  button,select,input{font:inherit;color:inherit}
  button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;
    transition:transform .3s cubic-bezier(.34,1.9,.5,1),background .15s}
  button:hover{background:#38425f} button:active{transform:scale(.93);transition:transform .06s}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary{background:linear-gradient(#5ec1ff,#1f7ae6);border-color:#1f7ae6;color:#fff;font-weight:700}
  button.danger:hover{background:#5a2a33}
  input[type=text],select,textarea{background:#1a2030;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  #app{display:grid;grid-template-columns:320px 1fr auto;grid-template-rows:52px 1fr;height:100%}
  header{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 12px;background:#161b28;border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0 10px 0 0;white-space:nowrap} header h1 b{color:#ffc531}
  header .sp{flex:1}
  #levelName{width:200px}
  #runBtn{padding:7px 18px;font-size:15px}
  #status{color:var(--mute);font-size:12px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
  /* left tools */
  #left{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
  #tabs{display:flex;gap:4px;padding:8px}
  #tabs button{flex:1;padding:6px 4px}
  #tools{flex:1;overflow:auto;padding:0 10px 10px}
  .sec{margin:8px 0;padding:10px;background:var(--panel2);border-radius:10px;animation:appear .25s ease-out}
  @keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sec h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:5px 0}
  .hint{color:var(--mute);font-size:12px}
  .pal{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
  .chip{position:relative;height:30px;border-radius:7px;border:2px solid transparent;cursor:pointer}
  .chip.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  .chip .use{position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:3px;background:rgba(0,0,0,.45);border:1px solid #fff}
  .chip .use.on{background:#fff}
  .stepper{display:flex;align-items:center;gap:4px} .stepper b{min-width:22px;text-align:center}
  /* checks (always visible) */
  #checks{border-top:1px solid var(--line);padding:8px 10px 10px;max-height:46%;overflow:auto;background:#222a3c}
  #checks h3{margin:2px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
  .cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
  .cc{display:flex;align-items:center;gap:4px;padding:3px 5px;border-radius:6px;font-size:12px;background:#1a2030;border:1px solid transparent}
  .cc.ok{border-color:rgba(63,191,98,.6)} .cc.bad{border-color:var(--bad);background:#3a1f26}
  .cc i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .warn{color:#ffb4b4;font-size:12px;margin:2px 0;cursor:pointer} .warn:hover{text-decoration:underline}
  .okline{color:#9be7ad;font-size:12px}
  #testOut{font-size:12px;margin-top:6px;white-space:pre-wrap}
  .badge{display:inline-block;padding:1px 8px;border-radius:10px;font-weight:700;font-size:12px}
  /* centre view */
  #center{position:relative;min-width:0;background:#7f9c5a}
  #view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  #viewHelp{position:absolute;left:10px;bottom:8px;color:#fff;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none;opacity:.85}
  #modeTag{position:absolute;left:10px;top:8px;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:12px;font-size:12px}
  /* right preview */
  #right{display:flex;flex-direction:column;align-items:center;padding:10px 14px;background:#151a26;border-left:1px solid var(--line);min-height:0}
  #right .row{justify-content:center}
  #phone{position:relative;border-radius:46px;background:#0c0f17;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 0 0 2px #2c3448}
  #phoneInner{width:390px;height:844px;border-radius:34px;overflow:hidden;position:relative;background:#000}
  #preview{width:390px;height:844px;border:0;display:block}
  #phone .notch{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:110px;height:22px;border-radius:12px;background:#0c0f17;z-index:2}
  /* queue editor */
  .lane{background:#1a2030;border:1px dashed var(--line);border-radius:10px;padding:6px;min-height:46px;margin:6px 0}
  .lane h4{margin:0 0 4px;font-size:12px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between}
  .bus{display:flex;align-items:center;gap:6px;padding:4px 6px;margin:3px 0;border-radius:8px;background:var(--panel2);border:2px solid transparent;
    cursor:grab;user-select:none;touch-action:none;transition:transform .2s}
  .bus.sel{border-color:#ffc531}
  .bus .sw{width:26px;height:18px;border-radius:5px;flex:none}
  .bus .cap{font-weight:700;min-width:22px}
  .bus .lk{font-size:11px;padding:0 6px;border-radius:8px;background:#ff8f1f;color:#111;font-weight:700}
  .bus .x{margin-left:auto;padding:0 6px}
  .bus .hid{padding:0 6px}
  .bus .hid.on{background:#8a93a6;color:#111}
  .ghost{position:fixed;pointer-events:none;z-index:50;opacity:.9;transform:rotate(-3deg) scale(1.04);box-shadow:0 8px 20px rgba(0,0,0,.5)}
  .dropmark{height:3px;background:var(--accent);border-radius:2px;margin:2px 0}
  /* file */
  .slot{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;background:#1a2030;margin:4px 0}
  .slot.cur{outline:2px solid var(--accent)}
  .slot span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  textarea{width:100%;height:90px;font:12px ui-monospace,Menlo,monospace;resize:vertical}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:#0f1422;border:1px solid var(--line);
    padding:8px 16px;border-radius:12px;z-index:60;transition:transform .35s cubic-bezier(.34,1.7,.5,1),opacity .2s}
  .toast.show{transform:translateX(-50%);opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Match Express <b>Level Editor</b></h1>
    <input type="text" id="levelName" title="Level name">
    <button id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
    <div class="sp"></div>
    <span id="status">preview: waiting…</span>
    <button id="autoBtn" title="Restart the preview 500 ms after every edit">Auto-run: off</button>
    <button id="watchBtn" title="Play the greedy bot's solution in the preview">Watch greedy</button>
    <button id="tabBtn" title="Open the game in its own tab (stays in sync)">Open in new tab</button>
    <button id="runBtn" class="primary" title="Save and start the level fresh in the preview and in every open game tab">▶ RUN</button>
  </header>

  <div id="left">
    <div id="tabs">
      <button data-tab="road" class="on">Road</button><button data-tab="ramps">Ramps</button><button data-tab="queue">Queue</button><button data-tab="file">File</button>
    </div>
    <div id="tools"></div>
    <div id="checks"></div>
  </div>

  <div id="center">
    <canvas id="view"></canvas>
    <div id="modeTag"></div>
    <div id="viewHelp"></div>
  </div>

  <div id="right">
    <div id="phone"><div class="notch"></div><div id="phoneInner"><iframe id="preview" src="index.html?embed=1" title="Game preview"></iframe></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="shared/core.js"></script>
<script src="shared/sync.js"></script>
<script>
'use strict';
const C = window.MECore, S = window.MESync;
const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
const KEY_DRAFT = 'match-express:editor-draft';
const RAD = C.ROAD_HALF;

/* ============================== STATE ============================== */
let lvl, L, check, undoStack = [], redoStack = [], curSlot = null;
let tab = 'road', sel = {point:-1, ramp:-1}, brush = {mode:'move', color:'red', use:new Set(C.COLORS)}, busSel = new Set();
let autoRun = false, autoTimer = null, msgSeq = 0, previewInfo = null, highlight = null;
function draftLoad(){ try { const s = localStorage.getItem(KEY_DRAFT); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function draftSave(){ try { localStorage.setItem(KEY_DRAFT, JSON.stringify(lvl)); } catch (e) {} }
function setLevel(raw, keepHistory){
  lvl = clone(C.normalizeLevel(raw)); L = C.buildLayout(lvl); check = C.checkLevel(lvl);
  if (!keepHistory){ undoStack = []; redoStack = []; }
  sel.point = Math.min(sel.point, lvl.road.points.length - 1); if (sel.ramp >= lvl.ramps.length) sel.ramp = -1;
  $('levelName').value = lvl.name || '';
  draftSave(); renderAll();
}
/* every edit: snapshot for undo, mutate a fresh copy, rebuild layout + checks, schedule auto-run */
function edit(fn, opts){
  opts = opts || {};
  if (!opts.noUndo){ undoStack.push(JSON.stringify(lvl)); if (undoStack.length > 300) undoStack.shift(); redoStack = []; }
  const next = clone(lvl); fn(next);
  lvl = clone(C.normalizeLevel(next)); L = C.buildLayout(lvl); check = C.checkLevel(lvl);
  draftSave(); renderAll(opts.light);
  if (autoRun) scheduleAuto();
}
function undo(){ if (!undoStack.length) return; redoStack.push(JSON.stringify(lvl)); setLevel(JSON.parse(undoStack.pop()), true); if (autoRun) scheduleAuto(); toast('Undo'); }
function redo(){ if (!redoStack.length) return; undoStack.push(JSON.stringify(lvl)); setLevel(JSON.parse(redoStack.pop()), true); if (autoRun) scheduleAuto(); toast('Redo'); }
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1400); }

/* ======================= PREVIEW / RUN / SYNC ======================= */
const chan = S.channel();
const preview = $('preview');
/* game tabs this editor opened (window.opener) also get every message by postMessage, which
   works where BroadcastChannel can't (e.g. a blob: tab from the single-file editor) */
const tabs = new Set(), answered = new Set();
/* target: undefined = preview + every game tab; 'preview' = only the iframe; {to, win?} = one game tab */
function send(type, target){
  const msg = {type, id:'ed' + Date.now() + '-' + (++msgSeq), level:lvl};
  S.saveCurrent(lvl);                                  // the game falls back to this when opened later
  if (!target || target === 'preview'){ try { preview.contentWindow.postMessage(msg, '*'); } catch (e) {} }
  if (target === 'preview') return msg.id;
  if (target && target.to) msg.to = target.to;
  if (chan) chan.postMessage(msg);
  for (const w of tabs){ if (w.closed){ tabs.delete(w); continue; } if (!target || target.win === w) try { w.postMessage(msg, '*'); } catch (e) {} }
  return msg.id;
}
/* a game tab boots and says hello (on the channel and to its opener): answer each hello once */
function answerHello(d, win){
  if (win) tabs.add(win);
  if (answered.has(d.hello)) return; answered.add(d.hello);
  send('run', {to:d.hello, win});
}
function run(){ clearTimeout(autoTimer); autoTimer = null; send('run'); $('status').textContent = 'preview: running "' + (lvl.name || 'level') + '"…'; }
function scheduleAuto(){ clearTimeout(autoTimer); autoTimer = setTimeout(run, 500); }
addEventListener('message', e => {
  const d = e.data; if (!d || typeof d !== 'object') return;
  if (d.type === 'hello' && e.source === preview.contentWindow) send('run', 'preview');   // the preview booted: give it our level
  else if (d.type === 'hello' && d.hello && e.source) answerHello(d, e.source);          // a game tab we opened
  if (d.type === 'game-status'){ previewInfo = d; $('status').textContent = `preview: "${d.name}" · ${d.men} stickmen · ${d.buses} buses (${d.source})`; }
});
if (chan) chan.onmessage = e => { if (e.data && e.data.type === 'hello' && e.data.hello) answerHello(e.data); };   // a new game tab asks for the level
$('runBtn').onclick = run;
$('watchBtn').onclick = () => { send('watch'); $('status').textContent = 'preview: greedy bot playing…'; };
$('tabBtn').onclick = () => { S.saveCurrent(lvl); window.open('index.html', '_blank'); };
$('autoBtn').onclick = () => { autoRun = !autoRun; $('autoBtn').classList.toggle('on', autoRun); $('autoBtn').textContent = 'Auto-run: ' + (autoRun ? 'on' : 'off'); if (autoRun) scheduleAuto(); };
$('undoBtn').onclick = undo; $('redoBtn').onclick = redo;
$('levelName').onchange = e => edit(n => { n.name = e.target.value.trim() || 'Untitled level'; });
addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'y'){ e.preventDefault(); redo(); }
  else if (k === 'delete' || k === 'backspace'){ if (tab === 'road' && sel.point > 0) deletePoint(sel.point); else if (tab === 'ramps' && sel.ramp >= 0) deleteRamp(sel.ramp); }
});

/* ============================ VIEW (canvas) ============================ */
const cv = $('view'), ctx = cv.getContext('2d');
const VIEW = {s:20, ox:0, oy:0, fitted:false};
function fitView(){
  const w = cv.clientWidth, h = cv.clientHeight, X0 = -8.5, X1 = 8.5, Z0 = -28.5, Z1 = 11;
  VIEW.s = Math.min(w/(X1 - X0), h/(Z1 - Z0)); VIEW.ox = w/2 - (X0 + X1)/2*VIEW.s; VIEW.oy = h/2 - (Z0 + Z1)/2*VIEW.s; VIEW.fitted = true;
}
function resize(){ const r = devicePixelRatio || 1; cv.width = cv.clientWidth*r; cv.height = cv.clientHeight*r; if (!VIEW.fitted) fitView(); draw(); }
new ResizeObserver(resize).observe(cv);
const W2S = (x, z) => [VIEW.ox + x*VIEW.s, VIEW.oy + z*VIEW.s];
const S2W = (sx, sy) => [(sx - VIEW.ox)/VIEW.s, (sy - VIEW.oy)/VIEW.s];
/* the part of the ground the game camera shows (ray cast from the screen edges onto y = 0) */
function screenFootprint(){
  const P = C.CAM.pos, f = n3([C.CAM.look[0]-P[0], C.CAM.look[1]-P[1], C.CAM.look[2]-P[2]]), r = n3([-f[2], 0, f[0]]);
  const u = [r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]], t = Math.tan(C.CAM.fov*Math.PI/360), asp = C.CAM.w/C.CAM.h;
  const ray = (sx, sy) => { const xs = sx/C.CAM.w*2 - 1, ys = 1 - sy/C.CAM.h*2;
    const d = [f[0] + r[0]*xs*t*asp + u[0]*ys*t, f[1] + r[1]*xs*t*asp + u[1]*ys*t, f[2] + r[2]*xs*t*asp + u[2]*ys*t], k = -P[1]/d[1];
    return [P[0] + d[0]*k, P[2] + d[2]*k]; };
  const pts = []; for (let i=0;i<=10;i++) pts.push(ray(i*90, 150)); for (let i=0;i<=10;i++) pts.push(ray(900, 150 + i*180)); for (let i=10;i>=0;i--) pts.push(ray(i*90, 1950)); for (let i=10;i>=0;i--) pts.push(ray(0, 150 + i*180));
  return pts;
}
function n3(v){ const l = Math.hypot(...v) || 1; return v.map(c => c/l); }
const FOOT = screenFootprint();
function rampOutline(r){
  const pts = [], o = {}, hw = r.halfW, sides = [[], []];
  for (let s = 0; s <= r.length + 1e-6; s += 0.15){ C.pathAt(r.spline, Math.min(s, r.length), o, 0); sides[0].push([o.x - o.dz*hw, o.z + o.dx*hw]); sides[1].push([o.x + o.dz*hw, o.z - o.dx*hw]); }
  return sides[0].concat(sides[1].reverse());
}
function draw(){
  if (!L) return;
  const dpr = devicePixelRatio || 1; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = cv.clientWidth, h = cv.clientHeight, s = VIEW.s;
  ctx.fillStyle = '#8eab64'; ctx.fillRect(0, 0, w, h);
  // game screen area
  ctx.beginPath(); FOOT.forEach((p, i) => { const [x, y] = W2S(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fill(); ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
  // yard
  const T = L.TUNNEL;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const poly = (pts, width, color) => { ctx.beginPath(); pts.forEach((p, i) => { const [x, y] = W2S(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.lineWidth = width*s; ctx.strokeStyle = color; ctx.stroke(); };
  const ring = [[0, C.Z_ENTRY], [C.X_SIDE, C.Z_ENTRY], [C.X_SIDE, C.Z_COLL], [-C.X_SIDE, C.Z_COLL], [-C.X_SIDE, C.Z_ENTRY], [0, C.Z_ENTRY]];
  poly(ring, 1.22, '#5c6169'); poly([[T.side*C.X_SIDE, C.Z_COLL], [T.x, C.Z_COLL], [T.x - T.nx*1.2, T.z - T.nz*1.2]], 1.22, '#5c6169'); poly([[0, C.Z_ENTRY], [0, C.Z_ROAD0]], 1.22, '#5c6169');
  ctx.fillStyle = '#5c6169'; { const [x0, y0] = W2S(C.LANE_X[0] - 0.86, C.Z_COLL), [x1, y1] = W2S(C.LANE_X[2] + 0.86, 12); ctx.fillRect(x0, y0, x1 - x0, y1 - y0); }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
  C.BAY_X.forEach(bx => { const [x0, y0] = W2S(bx - 0.58, C.Z_BAY_TOP), [x1, y1] = W2S(bx + 0.58, C.Z_BAY_BOT); ctx.strokeRect(x0, y0, x1 - x0, y1 - y0); });
  // return tunnel (auto: the collector end nearer the exit tunnel, mouth to the bays)
  tunnelIcon(T.x, T.z, Math.atan2(T.nx, T.nz), 'return');
  // pillars
  ctx.fillStyle = '#f4f5f7'; L.pillars.forEach(p => { const [x, y] = W2S(p.x, p.z); ctx.beginPath(); ctx.arc(x, y, Math.max(2, 0.17*s), 0, 7); ctx.fill(); });
  // road: lower parts first, the overpass of a spiral on top
  const R = L.ROAD, seg = [];
  for (let i=0;i<R.n;i++){ if (R.cum[i] > R.portalS + 0.05) break; seg.push([R.P[i*3], R.P[i*3+2], R.P[i*3+1], R.cum[i]]); }
  const bad = new Set(check.warnings.filter(w => w.kind.startsWith('road')).map(w => w));
  const drawRoad = (pts) => { poly(pts, RAD*2 + 0.08, '#d9dce1'); poly(pts, RAD*2 - 0.14, '#4b5059'); };
  const order = []; let cur = []; let lastHigh = null;
  seg.forEach(p => { const high = R.spirals.some(sp => p[3] > (sp.s0 + sp.s1)/2 + 1.2 && p[3] < sp.s1 + 1.5); if (lastHigh !== null && high !== lastHigh){ order.push([lastHigh, cur]); cur = [cur[cur.length-1]]; } cur.push(p); lastHigh = high; });
  if (cur.length) order.push([lastHigh, cur]);
  order.filter(o => !o[0]).forEach(o => drawRoad(o[1]));
  order.filter(o => o[0]).forEach(o => { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 8; drawRoad(o[1]); ctx.restore(); });
  ctx.setLineDash([0.3*s, 0.3*s]); poly(seg, 0.06, '#f3c63f'); ctx.setLineDash([]);
  tunnelIcon(L.exit.x, L.exit.z, Math.atan2(-L.exit.dx, -L.exit.dz), 'exit');
  // ramps
  L.RAMPS.forEach(r => {
    const selR = r.src === sel.ramp, warnR = check.warnings.some(w => w.ramp === r.src);
    ctx.beginPath(); rampOutline(r).forEach((p, i) => { const [x, y] = W2S(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
    ctx.fillStyle = '#cdd1d6'; ctx.fill(); ctx.lineWidth = selR ? 3 : 1.5; ctx.strokeStyle = warnR ? '#ff3b3b' : selR ? '#ffc531' : '#ffffff'; ctx.stroke();
    const cells = lvl.ramps[r.src].columns;
    for (let c=0;c<r.cols;c++) for (let k=0;k<r.rows;k++){
      const sl = r.slots[c][k], [x, y] = W2S(sl.x, sl.z), cell = C.parseCell(cells[c][k]), rad = Math.max(2.5, 0.13*s);
      ctx.beginPath(); ctx.arc(x, y, rad, 0, 7);
      if (cell){ ctx.fillStyle = C.HEX[cell.color]; ctx.fill(); if (cell.hidden){ ctx.lineWidth = 2; ctx.strokeStyle = '#3d4250'; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.max(8, rad*1.5)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', x, y + 0.5); } }
      else { ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(60,70,90,.5)'; ctx.stroke(); }
    }
    // boarding point (drag along the road) and shape handles
    const [bx, by] = W2S(r.x, r.z);

/* ========================== VIEW INTERACTION ========================== */
function nearestRoadS(x, z){
  const R = L.ROAD; let best = 1e9, bs = 0;
  for (let i=0;i<R.n;i++){ if (R.cum[i] > R.portalS) break; const d = Math.hypot(R.P[i*3] - x, R.P[i*3+2] - z); if (d < best){ best = d; bs = R.cum[i]; } }
  return {s:bs, d:best};
}
function hitPoint(x, z, rad){ let best = -1, bd = rad; lvl.road.points.forEach((p, i) => { const d = Math.hypot(p.x - x, p.z - z); if (d < bd){ bd = d; best = i; } }); return best; }
function hitRamp(x, z){
  for (const r of L.RAMPS){ const o = {}; for (let s = 0; s <= r.length; s += 0.2){ C.pathAt(r.spline, s, o, 0); if (Math.hypot(o.x - x, o.z - z) < r.halfW) return r.src; } }
  return -1;
}
function hitCell(r, x, z){ let best = null, bd = 0.2; for (let c=0;c<r.cols;c++) for (let k=0;k<r.rows;k++){ const sl = r.slots[c][k], d = Math.hypot(sl.x - x, sl.z - z); if (d < bd){ bd = d; best = [c, k]; } } return best; }
const rampOf = src => L.RAMPS.find(r => r.src === src);
/* road edits keep every ramp attached where it was: remember boarding points, re-snap afterwards */
function materializeRamps(n){
  n.ramps.forEach((rd, i) => { const r = rampOf(i); if (!r) return;
    rd._bx = r.x; rd._bz = r.z; if (!rd.shape) rd.shape = r.ctrl.slice(1).map(p => [round(p[0]), round(p[1])]); rd.at = r.s; delete rd.cp; });
}
function resnapRamps(n){
  const Lp = C.buildLayout(n);
  n.ramps.forEach(rd => { if (rd._bx == null) return; let best = 1e9, bs = rd.at;
    for (let i=0;i<Lp.ROAD.n;i++){ if (Lp.ROAD.cum[i] > Lp.ROAD.portalS) break; const d = Math.hypot(Lp.ROAD.P[i*3] - rd._bx, Lp.ROAD.P[i*3+2] - rd._bz); if (d < best){ best = d; bs = Lp.ROAD.cum[i]; } }
    rd.at = round(bs, 3); delete rd._bx; delete rd._bz; });
}
const round = (v, d = 2) => +v.toFixed(d);
function roadEdit(fn, live){
  const wrap = n => { materializeRamps(n); delete n.road.tail; fn(n); n.road.points.forEach(p => { if (p.spiral) delete p.spiral.dir; }); resnapRamps(n); };
  live ? editLive(wrap) : edit(wrap);
}
function deletePoint(i){

  roadEdit(n => { n.road.points.splice(i, 1); }); sel.point = -1; renderAll();
}
function deleteRamp(i){ edit(n => { n.ramps.splice(i, 1); }); sel.ramp = -1; renderAll(); }
let drag = null, press = null;

cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const [wx, wz] = S2W(mx, my), k = Math.exp(-e.deltaY*0.0015); VIEW.s = Math.min(160, Math.max(8, VIEW.s*k)); VIEW.ox = mx - wx*VIEW.s; VIEW.oy = my - wz*VIEW.s; draw(); }, {passive:false});
cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, [x, z] = S2W(mx, my), hr = 12/VIEW.s;
  press = {mx, my, x, z, t:performance.now(), moved:false, button:e.button, id:e.pointerId};

      if (hi >= 0){ drag = {kind:'shape', src:rs.src, k:hi, started:false}; return; }
      if (brush.mode !== 'move'){ const cell = hitCell(rs, x, z); if (cell){ drag = {kind:'paint', src:rs.src, started:false, done:new Set(), hiddenOn:null}; paintAt(x, z, true); return; } }
    }
    const hit = hitRamp(x, z); if (hit >= 0){ sel.ramp = hit; renderTools(); draw(); if (brush.mode !== 'move'){ drag = {kind:'paint', src:hit, started:false, done:new Set(), hiddenOn:null}; paintAt(x, z, true); } return; }
    // boarding markers of other ramps

cv.addEventListener('pointermove', e => {

  if (drag.kind === 'board'){ const src = drag.src, ns = nearestRoadS(x, z).s;
    const fn = n => { const rd = n.ramps[src], old = rampOf(src);
      if (!rd.shape) rd.shape = old.ctrl.slice(1).map(p => [round(p[0]), round(p[1])]);

      const nl = C.buildLayout(clone(n)), nr = nl.RAMPS.find(q => q.src === src), dx = nr.ctrl[0][0] - old.ctrl[0][0], dz = nr.ctrl[0][1] - old.ctrl[0][1];

    first ? edit(fn) : editLive(fn); return; }
  if (drag.kind === 'shape'){ const src = drag.src, k = drag.k;
    const fn = n => { const rd = n.ramps[src]; if (!rd.shape) rd.shape = rampOf(src).ctrl.slice(1).map(p => [round(p[0]), round(p[1])]);
      if (rd.at == null){ rd.at = rampOf(src).s; delete rd.cp; } rd.shape[k] = [round(x), round(z)]; };

cv.addEventListener('pointerup', e => {
  if (!press) return; clearTimeout(press.longTimer);
  const wasClick = !press.moved, {x, z} = press;
  if (wasClick && tab === 'road' && (!drag || drag.kind === 'pan')){
    const near = nearestRoadS(x, z);
    if (near.d < RAD + 0.15 && hitPoint(x, z, 12/VIEW.s) < 0){             // click on the road: insert a control point
      const sArr = L.ROAD.pointS; let i = 0; while (i < sArr.length - 1 && sArr[i+1] < near.s) i++;

  if (drag && drag.kind === 'paint' && drag.started) { /* paint strokes commit as they go */ }
  drag = null; press = null;
});
/* live drag frames replace the last undo snapshot instead of stacking one per pixel */
function editLive(fn){ edit(fn, {noUndo:true, light:true}); }
function handleRightClick(x, z){
  if (tab === 'road'){ const i = hitPoint(x, z, 14/VIEW.s); if (i > 0) deletePoint(i); }
  else if (tab === 'ramps'){ const rs = sel.ramp >= 0 ? rampOf(sel.ramp) : null; if (rs){ const cell = hitCell(rs, x, z); if (cell) edit(n => { n.ramps[rs.src].columns[cell[0]][cell[1]] = null; }); } }

  const cur = C.parseCell(lvl.ramps[r.src].columns[cell[0]][cell[1]]);

  if (brush.mode === 'paint') val = C.cellStr({color:brush.color, hidden:cur ? cur.hidden : false});
  else if (brush.mode === 'erase') val = null;

}

function rampAction(a){

  for (let i=0;i<ss.length-1;i++) if (ss[i+1] - ss[i] > best){ best = ss[i+1] - ss[i]; at = (ss[i] + ss[i+1])/2; }
  const near = L.RAMPS.reduce((a, r) => !a || Math.abs(r.s - at) < Math.abs(a.s - at) ? r : a, null);
  edit(n => { n.ramps.push({at:round(at, 3), side: near ? -near.side : 1, rows:6, columns:[0,1,2,3].map(() => new Array(6).fill(null))}); });

        <span class="cap">${b.cap}</span><span>${b.color}</span>${b.link != null ? `<span class="lk">link ${b.link}</span>` : ''}
        <button class="hid ${b.hidden ? 'on' : ''}" title="Hidden bus (grey ? until it reaches the front)">?</button><button class="x" title="Delete">×</button></div>`);
      chip.querySelector('.hid').onclick = e => { e.stopPropagation(); edit(n => { const o = n.lanes[l][i]; if (o.hidden) delete o.hidden; else o.hidden = true; }); };
      chip.querySelector('.x').onclick = e => { e.stopPropagation(); busSel.clear(); edit(n => { n.lanes[l].splice(i, 1); }); };
      chip.addEventListener('pointerdown', e => { if (e.target.tagName === 'BUTTON') return; startBusDrag(e, l, i, chip); });
      lane.append(chip);
    });
    el.append(lane);
  }
}
function linkSelected(){
  if (busSel.size < 2){ toast('Select two or more buses to link'); return; }
  const used = new Set(lvl.lanes.flat().map(b => b.link).filter(x => x != null));
  let id = 'A'; for (let k=0; used.has(id); k++) id = String.fromCharCode(66 + k);
  edit(n => { busSel.forEach(k => { const [l, i] = k.split(':').map(Number); if (n.lanes[l][i]) n.lanes[l][i].link = id; }); });
  busSel.clear(); renderAll(); toast('Linked as ' + id);
}
function startBusDrag(e, l, i, chip){
  const sx = e.clientX, sy = e.clientY; let ghost = null, mark = null, target = null;
  const move = ev => {
    if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
    if (!ghost){ ghost = chip.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = chip.offsetWidth + 'px'; document.body.append(ghost); chip.style.opacity = '.35'; mark = document.createElement('div'); mark.className = 'dropmark'; }
    ghost.style.left = ev.clientX - 30 + 'px'; ghost.style.top = ev.clientY - 14 + 'px';
    const lanes = [...document.querySelectorAll('.lane')], laneEl = lanes.find(le => { const r = le.getBoundingClientRect(); return ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom; });
    if (!laneEl){ mark.remove(); target = null; return; }
    const chips = [...laneEl.querySelectorAll('.bus')]; let idx = chips.length;
    for (let k=0;k<chips.length;k++){ const r = chips[k].getBoundingClientRect(); if (ev.clientY < r.top + r.height/2){ idx = k; break; } }
    target = [+laneEl.dataset.lane, idx]; idx < chips.length ? laneEl.insertBefore(mark, chips[idx]) : laneEl.append(mark);
  };
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up);
    if (!ghost){ const key = l + ':' + i; busSel.has(key) ? busSel.delete(key) : busSel.add(key); renderTools(); return; }
    ghost.remove(); mark && mark.remove(); chip.style.opacity = '';
    if (target){ const [tl, ti] = target; busSel.clear();
      edit(n => { const [b] = n.lanes[l].splice(i, 1); let at = ti; if (tl === l && ti > i) at--; n.lanes[tl].splice(at, 0, b); }); }
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}
/* ------------------------------ file ------------------------------ */
function renderFileTools(el){
  const slots = S.loadSlots(), ids = Object.keys(slots).sort((a, b) => (slots[b].updated || 0) - (slots[a].updated || 0));
  const s1 = h(`<div class="sec"><h3>Level slots</h3><div id="slotList"></div>
    <div class="row"><button id="saveSlot" class="primary">Save${curSlot && slots[curSlot] ? '' : ' as new'}</button><button id="saveNew">Save as new slot</button></div></div>`);
  ids.forEach(id => { const sl = slots[id];
    const row = h(`<div class="slot ${id === curSlot ? 'cur' : ''}"><span title="${esc(sl.name)}">${esc(sl.name)}</span>
      <button data-a="load">Load</button><button data-a="ren">Rename</button><button data-a="dup">Dup</button><button data-a="del" class="danger">×</button></div>`);
    row.querySelectorAll('button').forEach(b => b.onclick = () => slotAction(b.dataset.a, id));
    s1.querySelector('#slotList').append(row); });
  if (!ids.length) s1.querySelector('#slotList').append(h(`<div class="hint">No saved levels yet.</div>`));
  s1.querySelector('#saveSlot').onclick = () => saveSlot(curSlot && slots[curSlot] ? curSlot : null);
  s1.querySelector('#saveNew').onclick = () => saveSlot(null);
  el.append(s1);
  const s2 = h(`<div class="sec"><h3>Export / import</h3>
    <div class="row"><button id="exportBtn">Export JSON</button><button id="builtinBtn">Load built-in level</button><button id="newBtn">New empty level</button></div>
    <textarea id="importTxt" placeholder="Paste level JSON here…"></textarea>
    <div class="row"><button id="importBtn">Import pasted JSON</button><label><input type="file" id="importFile" accept=".json,application/json"> </label></div></div>`);
  s2.querySelector('#exportBtn').onclick = exportLevel;
  s2.querySelector('#builtinBtn').onclick = () => { pushUndo(); setLevel(C.LEVEL_DATA, true); curSlot = null; toast('Built-in level loaded'); };
  s2.querySelector('#newBtn').onclick = () => { pushUndo(); setLevel({format:2, name:'New level', road:clone(C.LEVEL_DATA.road), ramps:[], lanes:[[],[],[]]}, true); curSlot = null; };
  s2.querySelector('#importBtn').onclick = () => importText(s2.querySelector('#importTxt').value);
  s2.querySelector('#importFile').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(importText); };
  el.append(s2);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pushUndo(){ undoStack.push(JSON.stringify(lvl)); redoStack = []; }
function saveSlot(id){
  const slots = S.loadSlots(); id = id || ('lvl-' + Date.now().toString(36));
  slots[id] = {name: lvl.name || 'Untitled level', level: lvl, updated: Date.now()}; S.saveSlots(slots); curSlot = id;
  renderTools(); toast('Saved "' + slots[id].name + '"');
}
function slotAction(a, id){
  const slots = S.loadSlots(), sl = slots[id]; if (!sl) return;
  if (a === 'load'){ pushUndo(); setLevel(sl.level, true); curSlot = id; toast('Loaded "' + sl.name + '"'); }
  if (a === 'ren'){ const nm = prompt('Rename level', sl.name); if (!nm) return; sl.name = nm; sl.level.name = nm; slots[id] = sl; S.saveSlots(slots); if (id === curSlot) edit(n => { n.name = nm; }); renderTools(); }
  if (a === 'dup'){ const nid = 'lvl-' + Date.now().toString(36); slots[nid] = {name: sl.name + ' copy', level: Object.assign(clone(sl.level), {name: sl.name + ' copy'}), updated: Date.now()}; S.saveSlots(slots); renderTools(); }
  if (a === 'del'){ if (!confirm('Delete "' + sl.name + '"?')) return; delete slots[id]; S.saveSlots(slots); if (curSlot === id) curSlot = null; renderTools(); }
}
function levelJSON(){ return JSON.stringify(lvl, null, 2); }
function exportLevel(){
  const txt = levelJSON();
  (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copied to the clipboard and downloaded'), () => toast('Downloaded (clipboard not available)'));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
  a.download = (lvl.name || 'level').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importText(txt){
  let o; try { o = JSON.parse(txt); C.buildLayout(o); } catch (e) { toast('Import failed: ' + e.message); return false; }
  pushUndo(); setLevel(o, true); curSlot = null; toast('Imported "' + (lvl.name || 'level') + '"'); if (autoRun) scheduleAuto(); return true;
}

/* ============================== CHECKS ============================== */
let testRun = 0;
function renderChecks(){
  const el = $('checks'), ck = check;
  const sizes = Object.entries(ck.sizes).map(([k, v]) => `${v}×${k}`).join(' · ');
  el.innerHTML = `<h3>Checks</h3><div class="cgrid">${ck.perColor.map(p => `<div class="cc ${p.ok ? 'ok' : 'bad'}" title="${p.color}: ${p.men} stickmen vs ${p.seats} seats"><i style="background:${C.HEX[p.color]}"></i>${p.men}/${p.seats}</div>`).join('')}</div>
    <div class="row" style="font-size:12px">Stickmen <b>${ck.totalMen}</b> · seats <b>${ck.totalSeats}</b> · buses <b>${ck.buses}</b> (${sizes})${ck.hiddenMen ? ` · ${ck.hiddenMen} hidden stickmen` : ''}</div>
    <div id="warnList"></div>
    <div class="row"><button id="testBtn" class="primary">Test</button><button id="watchBtn2">Watch greedy</button></div><div id="testOut"></div>`;
  const wl = el.querySelector('#warnList');
  if (!ck.warnings.length && ck.balanced) wl.append(h(`<div class="okline">✓ colours balanced, no layout warnings</div>`));
  if (!ck.balanced) wl.append(h(`<div class="warn">Stickmen and seats differ for some colours (red cells above)</div>`));
  ck.warnings.forEach(w => { const d = h(`<div class="warn">⚠ ${esc(w.msg)}</div>`); d.onclick = () => { highlight = w; if (w.ramp != null){ sel.ramp = w.ramp; } draw(); setTimeout(() => { highlight = null; draw(); }, 1600); }; wl.append(d); });
  el.querySelector('#testBtn').onclick = runTest;
  el.querySelector('#watchBtn2').onclick = () => $('watchBtn').click();
  if (lastTest) showTest(lastTest);
}
let lastTest = null;
const LABEL_COL = {Easy:'#3fbf62', Medium:'#4aa8ff', Hard:'#ffb020', 'Very Hard':'#ff5a5f'};
function showTest(r){
  const out = $('testOut'); if (!out) return;
  if (r.pending){ out.textContent = 'Testing in the background… (greedy bot + 200 random-bot runs)'; return; }
  if (r.error){ out.textContent = 'Test failed: ' + r.error; return; }
  out.innerHTML = `Greedy bot: <b style="color:${r.greedy.result === 'win' ? '#9be7ad' : '#ffb4b4'}">${r.greedy.result.toUpperCase()}</b> · ${r.greedy.sends} sends · ${r.greedy.t.toFixed(1)} s game time
Random bot: <b>${r.wins}/${r.runs}</b> wins (${(r.rate*100).toFixed(1)}%)
Difficulty: <span class="badge" style="background:${LABEL_COL[r.label]};color:#111">${r.label}</span>${r.stale ? '\n<span class="hint">(level changed since this test)</span>' : ''}`;
}
function runTest(){
  const id = ++testRun, snapshot = JSON.stringify(lvl);
  lastTest = {pending:true}; showTest(lastTest);
  S.testInBackground(lvl, 200).then(r => { if (id !== testRun) return; lastTest = Object.assign(r, {snap:snapshot}); showTest(lastTest); })
    .catch(e => { if (id !== testRun) return; lastTest = {error:e.message}; showTest(lastTest); });
}

/* ============================== START ============================== */
(function start(){
  const initial = draftLoad() || S.loadCurrent() || C.LEVEL_DATA;
  try { setLevel(initial); } catch (e) { setLevel(C.LEVEL_DATA); }
  resize();
})();
/* make the phone frame fit the column height */
function fitPhone(){ const avail = $('right').clientHeight - 24, k = Math.min(1, avail/(844 + 28)); $('phone').style.transform = `scale(${k})`; $('phone').style.transformOrigin = 'top center';
  $('right').style.width = (390 + 28)*k + 30 + 'px'; }
addEventListener('resize', fitPhone); fitPhone();

window.__ed = {get level(){ return lvl; }, get layout(){ return L; }, get check(){ return check; }, get undoDepth(){ return undoStack.length; }, get redoDepth(){ return redoStack.length; },
  get lastTest(){ return lastTest; }, get autoRun(){ return autoRun; }, setLevel:(o) => { pushUndo(); setLevel(o, true); }, edit, undo, redo, run, send, levelJSON, importText,
  exportLevel, saveSlot, slotAction, fillRandom, linkSelected, busSel, sel, brush, W2S, S2W, roadEdit, setTab:(t) => document.querySelector(`#tabs button[data-tab="${t}"]`).click()};
</script>
