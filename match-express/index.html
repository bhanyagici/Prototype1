<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Match Express</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b3a22;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:"Arial Rounded MT Bold","Nunito","Baloo 2","Trebuchet MS",system-ui,sans-serif}
  #app{position:absolute;left:0;top:0;width:900px;height:1950px;transform-origin:0 0;overflow:hidden;background:#9fb878}
  #gl{position:absolute;left:0;top:0;width:900px;height:1950px;display:block}
  .ui{position:absolute;z-index:5}
  /* springy press + eased appearance for every control */
  .spring{transition:transform .38s cubic-bezier(.34,1.9,.5,1),filter .2s}
  .spring:active,.spring.pressed{transform:scale(.86);transition:transform .08s ease-out}
  /* ---- top bar ---- */
  /* chunky glossy candy controls: thick gold rim, deep bottom edge, a gloss highlight on top */
  #levelPill{left:30px;top:36px;height:80px;padding:0 42px;border-radius:44px;display:flex;align-items:center;max-width:430px;
    color:#fff;font-size:46px;font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:linear-gradient(#63c0ff,#2584ee 55%,#1462c8);border:7px solid #ffcf3a;
    box-shadow:0 8px 0 #c48410,0 14px 22px rgba(0,0,0,.3),inset 0 -7px 0 rgba(8,52,128,.35),inset 0 4px 0 rgba(255,255,255,.4);
    text-shadow:0 4px 0 #0c4a9c,0 0 3px #0c4a9c;animation:drop .5s cubic-bezier(.34,1.6,.5,1) both}
  #levelPill::before,.rbtn::before,#counter::before{content:'';position:absolute;left:12%;right:12%;top:6%;height:40%;border-radius:999px;
    background:linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.08));pointer-events:none}
  #levelPill::before{left:6%;right:6%;height:42%}
  .rbtn{width:90px;height:90px;border-radius:50%;top:32px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,#7acbff,#2584ee 58%,#135fc4);border:7px solid #ffcf3a;color:#fff;
    box-shadow:0 8px 0 #c48410,0 14px 22px rgba(0,0,0,.3),inset 0 -7px 0 rgba(8,52,128,.38),inset 0 4px 0 rgba(255,255,255,.4);cursor:pointer;
    animation:drop .5s cubic-bezier(.34,1.6,.5,1) both}
  .rbtn svg{position:relative;width:50px;height:50px;filter:drop-shadow(0 4px 0 rgba(10,60,140,.85))}
  #btnRestart{right:232px;animation-delay:.05s} #btnSpeed{right:132px;animation-delay:.1s} #btnSettings{right:32px;animation-delay:.15s}
  #btnSpeed{font-size:38px;font-weight:900;text-shadow:0 4px 0 #0c4a9c,0 0 2px #0c4a9c}
  #btnSpeed.on{background:radial-gradient(circle at 50% 30%,#ffe98e,#ffb21f 58%,#ea8400);text-shadow:0 4px 0 #a35a00;border-color:#fff4c2;
    box-shadow:0 8px 0 #b5650a,0 14px 22px rgba(0,0,0,.3),inset 0 -7px 0 rgba(150,70,0,.35),inset 0 4px 0 rgba(255,255,255,.45)}
  @keyframes drop{from{transform:translateY(-140px)}to{transform:none}}
  /* ---- settings popover ---- */
  #settings{right:28px;top:140px;width:330px;padding:22px;border-radius:28px;background:#24345e;border:5px solid #ffc531;
    box-shadow:0 8px 0 #c98a12,0 16px 30px rgba(0,0,0,.35);color:#fff;transform-origin:85% -10%;
    transform:scale(.3);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.34,1.7,.5,1),opacity .2s}
  #settings.open{transform:none;opacity:1;pointer-events:auto}

    font-weight:900;color:#fff;background:linear-gradient(#5ec1ff,#1f7ae6);box-shadow:0 5px 0 #0f4c9e;cursor:pointer}
  #settings button.off{background:linear-gradient(#9aa3b3,#69728a);box-shadow:0 5px 0 #454c5e}

    border:7px solid #ffcf3a;box-shadow:0 8px 0 #c48410,0 14px 22px rgba(0,0,0,.32),inset 0 -6px 0 rgba(0,0,0,.25),inset 0 0 0 3px #17224a;

    transform:translate(-50%,-50%);pointer-events:none;transition:border-color .3s}

  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}

  .panel{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(16,24,38,.45)}

    font-size:28px;font-weight:900;box-shadow:0 4px 0 #b02750}

    const s = clamp(v.spd/C.BUS_SPEED, 0, 1.3);
    h.o.frequency.setTargetAtTime((42 + s*34)*h.det, now, 0.08);

/* ambient forest: soft wind (filtered noise with a slow swell) and the odd bird */

/* ============================== GAME BINDING ============================= */

            bobF:1.6 + hash(i, 17)*1.4, lookT:hash(i, 3)*6, look:0, lookTo:0, runFrom:null, runT:-9, landT:-9, fly:null, tint:0}; });

/* level priority: a level sent by the editor > the last saved level (localStorage) > built-in LEVEL_DATA */
function initialLevel(){

    if (saved){ try { C.buildLayout(saved); return [saved, 'saved']; } catch (e) { console.warn('[level] saved level ignored:', e.message); } } }
  return [C.LEVEL_DATA, 'builtin'];
}
function loadLevel(level, source, opts){
  opts = opts || {};

  LEVEL = C.normalizeLevel(level); L = C.buildLayout(LEVEL); levelSource = source; levelSerial++;
  applyCamera(L.Y.CAM); buildWorld(L); resetGame(); placeCounter();
  setBot(!!opts.bot);

  $('levelSrc').textContent = {editor:'Level from the editor', saved:'Last saved editor level', builtin:'Built-in level'}[source] || source;
  logLevel(LEVEL, source);

}
function logLevel(N, source){
  const ck = C.checkLevel(N);

  console.log('[level] seats vs stickmen per colour: ' + ck.perColor.map(p => `${p.color} ${p.seats}/${p.men}`).join('  ') +

    console.log('[sim] greedy moves: ' + r.greedy.moves.join(' '));

/* editor messages: postMessage into the preview iframe, BroadcastChannel for other tabs */
let lastMsg = null, helloId = null;
function onMessage(d){
  if (!d || typeof d !== 'object') return;
  if (d.to && d.to !== helloId) return;                // a reply meant for another game tab
  if (d.id){ if (d.id === lastMsg) return; lastMsg = d.id; }
  if ((d.type === 'run' || d.type === 'watch') && d.level) loadLevel(d.level, 'editor', {bot: d.type === 'watch'});
  else if (d.type === 'restart') resetGame();
}
addEventListener('message', e => onMessage(e.data));
const chan = S.channel();

/* ------------------------------ events ------------------------------ */
function handleEvents(){
  for (const e of game.events){
    const v = e.bus !== undefined ? views[e.bus] : null;
    switch (e.type){
      case 'send': sfx.motor(); break;
      case 'refuse': v.shakeT = e.t; sfx.thud(); break;
      case 'lurch': v.lurchT = e.t; v.bobV += 0.6; sfx.thud(); break;
      case 'reveal': v.reveal(); v.revealT = e.t; sparkle(new THREE.Vector3(v.p.x, 0.2, v.p.z), C.HEX[v.b.color]); sfx.sparkle(); break;
      case 'revealMan': { paintMan(e.man); const m = game.men[e.man], p = slotPos(m, MV[e.man].disp); sparkle(new THREE.Vector3(p.x, p.y + 0.1, p.z), C.HEX[m.color], 8, 0.28); break; }
      case 'merge': {
        const next = game.trips.find(b => b.trip.kind === 'toRoad' && Math.hypot(b.x, b.z - C.Z_ROAD0) < 4.2);
        if (next) views[next.id].flashT = e.t + 0.15; break; }
      case 'board': { const m = MV[e.man], sp = slotPos(game.men[e.man], m.disp); m.runFrom = new THREE.Vector3(sp.x, sp.y, sp.z); m.runT = e.t;
        const r = game.ramps[e.ramp];
        r.cols[e.col].forEach((id, i) => { const mv = MV[id]; mv.from = mv.disp; mv.to = i; mv.t0 = e.t + 0.05 + i*0.045; });
        break; }
      case 'land': { MV[e.man].landT = e.t; v.bobV -= 0.42; sfx.pop(e.chain); break; }
      case 'boardStart': v.boardRamp = e.ramp; break;
      case 'jump': startExit(v, e); sfx.horn(); break;
      case 'win': winAt = e.t + EXIT.chute + 0.42 + C.WIN_PANEL_DELAY; winSoundAt = e.t + EXIT.chute + 0.45; break;
      case 'tunnelIn': sfx.echo(); WD.lamps.top.pulseT = e.t; break;
      case 'tunnelOut': WD.lamps.ret.pulseT = e.t; break;
      case 'rampEmpty': { const b = WD.badges[e.ramp]; b.visible = true; b.userData.t0 = e.t; b.userData.sparkled = false; break; }
      case 'crash': startCrash(e); break;
    }
  }
  game.events.length = 0;
}

/* --------------------------- crash + dominoes --------------------------- */
function startCrash(e){
  const T = L.TUNNEL, occupants = [];
  const order = T.side > 0 ? [4,3,2,1,0] : [0,1,2,3,4];          // nearest to the tunnel first
  for (const k of order){ const id = game.bays[k] >= 0 ? game.bays[k] : game.bayRes[k]; if (id >= 0) occupants.push(views[id]); }
  const knocked = game.trips.filter(b => b.id !== e.bus && b.x*T.side > L.Y.BAY_X[4] + 0.2 && b.z > -0.8 && b.z < C.Z_COLL + 0.8).map(b => views[b.id]);
  crash = {t0:e.t, v:views[e.bus], chain:occupants, knocked, hit:false, side:T.side};
  failAt = e.t + 3.2;
}
function updateCrash(t){
  const c = crash, v = c.v, u = t - c.t0, sd = c.side;
  const T = L.TUNNEL, first = c.chain[0], tx = (first ? first.b.x : sd*L.Y.BAY_X[4]) + sd*(C.BUS_W + 0.05), tz = first ? first.b.z : 2.4;
  const h0 = Math.atan2(T.nx, T.nz), hN = -Math.PI, xs = sd*(L.Y.X_SIDE + 0.25);
  v.root.visible = true; v.slope.rotation.x = 0; v.mat.color.setScalar(1);
  if (u < 0.42){ const k = u/0.42, e = easeOut(k); v.root.position.set(lerp(T.x, xs, e), 0, lerp(T.z, tz + 0.15, e)); v.root.rotation.y = h0 + angDiff(hN, h0)*e; v.body.rotation.z = sd*0.12*Math.sin(k*Math.PI); }
  else if (u < 0.66){ const k = (u - 0.42)/0.24; v.root.position.set(lerp(xs, tx, k*k), 0, lerp(tz + 0.15, tz, k)); v.root.rotation.y = hN + 0.06*Math.sin(k*Math.PI); v.body.rotation.z = -sd*0.2*k; }
  else { const k = Math.min(1, (u - 0.66)/0.35); v.root.position.set(tx + sd*0.22*Math.sin(k*Math.PI)*(1 - k), 0, tz); v.root.rotation.y = hN; v.body.rotation.z = -sd*0.2*(1 - k); }
  if (u >= 0.66 && !c.hit){ c.hit = true; sfx.crash(); puff(new THREE.Vector3(tx - sd*0.5, 0.4, tz)); ejectMen(v, 0.5, sd); }
  c.chain.forEach((w, i) => {
    const t0 = 1.0 + i*0.24, k = clamp((u - t0)/0.34, 0, 1);                    // dominoes start after the slow-motion beat
    if (k > 0 && !w.tipped){ w.tipped = true; ejectMen(w, 1, sd); sfx.thud(); }
    const ang = (i === c.chain.length - 1 ? 1.52 : 1.16)*k*k, W2 = C.BUS_W/2;   // roll over the far bottom edge onto the neighbour
    w.body.rotation.set(0, 0, -sd*ang); w.body.position.set(sd*(W2 - W2*Math.cos(ang)), W2*Math.sin(ang), 0);
  });
  c.knocked.forEach(w => { const k = clamp((u - 0.62)/0.3, 0, 1);
    w.root.position.set(w.b.x + sd*0.9*easeOut(k), 0, w.b.z + 0.2*k); w.body.rotation.set(0, 0, sd*0.45*k*(1 - 0.4*k)); });
  shake = u > 0.66 && u < 1.25 ? 0.07*(1 - (u - 0.66)/0.59) : 0;
}
function ejectMen(v, power, sd){
  game.men.forEach((m, i) => { if (m.bus === v.b.id && (m.state === 'seated' || m.state === 'run') && !MV[i].fly){
    const p = manWorld(i);
    MV[i].fly = {p, v:new THREE.Vector3(-sd*(0.4 + frand()*2.2)*power, 2 + frand()*2.2*power, (frand() - 0.5)*2.4*power),
                 r:new THREE.Vector3(), w:new THREE.Vector3((frand()-0.5)*14, (frand()-0.5)*8, (frand()-0.5)*14), rest:false};
  } });
}

/* ------------------------------ positions ------------------------------ */
function slotPos(m, rowF){
  const r = L.RAMPS[m.ramp], cs = r.slots[m.col], i0 = clamp(Math.floor(rowF), 0, cs.length - 1), i1 = Math.min(cs.length - 1, i0 + 1), f = clamp(rowF - i0, 0, 1);
  return {x:lerp(cs[i0].x, cs[i1].x, f), y:r.y, z:lerp(cs[i0].z, cs[i1].z, f), fx:cs[i0].fx, fz:cs[i0].fz};
}
const seatMat = new THREE.Matrix4(), SEAT_Y = 0.28;               // seated: hips on the cushion, head and shoulders above the rim
function seatMatrix(i, out){
  const m = game.men[i], v = views[m.bus], s = C.seatLocal(m.seat, v.b.len);
  out.makeTranslation(s.x, SEAT_Y, s.z).premultiply(v.body.matrixWorld); return out;
}
function manWorld(i){
  const m = game.men[i], mv = MV[i];
  if (mv.fly) return mv.fly.p.clone();
  if (m.state === 'ramp'){ const p = slotPos(m, mv.disp); return new THREE.Vector3(p.x, p.y, p.z); }
  if (m.bus >= 0){ seatMatrix(i, seatMat); return new THREE.Vector3().setFromMatrixPosition(seatMat); }
  return new THREE.Vector3();
}

/* ------------------------------ buses ------------------------------ */
function busTarget(b){                              // core position + velocity the render springs chase
  if (b.state === 'lane') return [b.x, 0, b.z, 0, -b.v];
  if (b.state === 'bay') return [b.x, 0, b.z, 0, 0];
  return [b.x, b.y, b.z, b.dx*b.v, b.dz*b.v];
}
function updateBus(v, t, vdt){
  const b = v.b;
  if (crash && (crash.v === v || crash.chain.includes(v) || crash.knocked.includes(v))) return;
  if (b.state === 'tunnel'){ v.root.visible = false; v.init = false; return; }
  if (b.state === 'jump'){ updateJump(v, t, vdt); return; }
  if (b.state === 'crash') return;
  let vis = true;
  if (b.state === 'road' && b.rs > L.ROAD.portalS + b.len*0.5 + 0.9) vis = false;
  if (b.state === 'return' && b.trip && b.trip.s < L.TUNNEL.depth - b.len/2 - 0.6) vis = false;
  if (!vis){ v.root.visible = false; v.init = false; return; }
  // ease into / out of the tunnel darkness
  let dark = 0;
  if (b.state === 'road') dark = smooth(L.ROAD.end - 0.55, L.ROAD.end - 0.02, b.rs);
  if (b.state === 'return' && b.trip) dark = 1 - smooth(0.0, 0.4, b.trip.s);
  v.dark = dark; v.mat.color.setScalar(1 - dark);
  const [tx, ty, tz, tvx, tvz] = busTarget(b), hT = Math.atan2(b.dx, b.dz);
  // position: critically damped spring with velocity feed-forward -> eased starts and stops, nothing snaps
  if (!v.init || Math.hypot(tx - v.p.x, tz - v.p.z) > 1.6){
    v.p.set(tx, ty, tz); v.pv.set(tvx, 0, tvz); v.h = hT; v.init = true; v.spd = Math.hypot(tvx, tvz); v.hPrev = hT;
  } else if (vdt > 0){
    const w = 24, steps = Math.max(1, Math.ceil(vdt/(1/120))), h = vdt/steps;
    for (let i=0;i<steps;i++){
      v.pv.x += (w*w*(tx - v.p.x) + 2*w*(tvx - v.pv.x))*h; v.pv.z += (w*w*(tz - v.p.z) + 2*w*(tvz - v.pv.z))*h;
      v.p.x += v.pv.x*h; v.p.z += v.pv.z*h;
    }
    v.p.y += (ty - v.p.y)*(1 - Math.exp(-vdt*18));
    v.h += angDiff(hT, v.h)*(1 - Math.exp(-vdt*16));
  }
  v.root.visible = true;
  v.root.position.copy(v.p); v.root.rotation.y = v.h;
  v.slope.rotation.x += (-Math.atan(b.slope) - v.slope.rotation.x)*(vdt > 0 ? 1 - Math.exp(-vdt*10) : 1);
  if (vdt > 0){
    const fwd = v.pv.x*Math.sin(v.h) + v.pv.z*Math.cos(v.h), spd = Math.max(0, fwd);
    const aInst = (spd - v.spd)/vdt; v.aLong += (aInst - v.aLong)*(1 - Math.exp(-vdt*14));
    const yawRate = angDiff(hT, v.hPrev === undefined ? hT : v.hPrev)/vdt; v.hPrev = hT;
    if (v.spd > 0.4 && spd < 0.05) v.bobV -= 0.28;                      // settle when it comes to rest
    if (v.spd < 0.05 && spd > 0.3) v.bobV += 0.18;                      // squat on pull-away
    v.spd = spd;
    // suspension springs: pitch (brake dive / launch squat), roll (lean out of curves), bob
    const big = (b.cap - 4)/8, steps = Math.max(1, Math.ceil(vdt/(1/120))), h = vdt/steps;
    const pitchT = clamp(-v.aLong*0.022, -0.07, 0.12), rollT = clamp(spd*yawRate*lerp(0.045, 0.075, big), -0.16, 0.16);
    const kr = lerp(170, 55, big), cr = 2*0.32*Math.sqrt(kr);
    for (let i=0;i<steps;i++){
      v.pitchV += (150*(pitchT - v.pitch) - 9*v.pitchV)*h; v.pitch += v.pitchV*h;
      v.rollV += (kr*(rollT - v.roll) - cr*v.rollV)*h; v.roll += v.rollV*h;
      v.bobV += (-110*v.bob - 7*v.bobV)*h; v.bob += v.bobV*h;
    }
    v.wheelAng += spd*vdt/WHEEL_R;
  }
  const braking = (b.state === 'road' || b.state === 'toRoad') && (v.aLong < -0.8 || (v.spd < 0.05 && !b.board && b.state === 'road'));
  v.brakeAmt += ((braking ? 1 : 0) - v.brakeAmt)*(vdt > 0 ? 1 - Math.exp(-vdt/0.06) : 0);
  if (v.aLong < -5.5 && t - v.squeakT > 1.2 && (b.state === 'road' || b.state === 'toRoad')){
    v.squeakT = t; if (t - lastSqueak > 0.3){ lastSqueak = t; sfx.squeak(); }
    if (t - v.dustT > 0.8 && dark < 0.2){ v.dustT = t;                // hard stop: a little dust kicked up at the front wheels
      _v.set(0, 0.08, b.len/2 - 0.3).applyMatrix4(v.root.matrixWorld); puff(_v.clone(), 7, [Math.sin(v.h), Math.cos(v.h)], 0.55, 0.7); }
  }
  let px = 0, py = v.bob*0.08, pz = 0, extraPitch = 0;
  if (t - v.shakeT < 0.5){ const k = (t - v.shakeT)/0.5; px = Math.sin(k*Math.PI*7)*0.09*(1 - k)*(1 - k); }
  if (t - v.lurchT < 0.8){ const k = t - v.lurchT; pz = 0.26*Math.exp(-6*k)*Math.sin(k*14); extraPitch = 0.08*Math.exp(-6*k)*Math.sin(k*14); }
  if (b.state === 'bay' || (b.state === 'lane' && v.spd < 0.05)) py += Math.sin(t*38 + b.id*1.7)*0.0035;      // idling
  if (b.cap === 4 && v.spd > 0.5) py += Math.abs(Math.sin(t*14 + b.id))*0.01;                                  // nimble minibus
  const pop = t - v.revealT < 0.5 ? easeOutBack(clamp((t - v.revealT)/0.5, 0, 1), 3) : 1;
  v.body.position.set(px, py, pz); v.body.scale.set(1, pop, 1);
  v.body.rotation.set(v.pitch + extraPitch, 0, v.roll);
  v.shadow.visible = true; v.shadow.material.opacity = 0.42*(1 - dark);
  v.brakeMat.emissiveIntensity = 0.15 + v.brakeAmt*2.6;
  v.bGlow.forEach(s => { s.material.opacity = v.brakeAmt*0.95*(1 - dark); });
  const fl = t - v.flashT, flashing = fl > 0 && fl < 0.62 && (fl % 0.31) < 0.16;
  v.headMat.emissiveIntensity = flashing ? 3.2 : 0.35*(1 - dark);
  v.hGlow.forEach(s => { s.material.opacity = flashing ? 1 : 0; });
  if (v.q) v.q.position.y = 1.25 + Math.sin(t*3 + b.id)*0.05;
  if (v.link){ v.link.visible = b.state === 'lane'; v.link.position.y = 1.1 + Math.sin(t*3.4 + b.id)*0.04; }
}
/* A full bus first drives straight sideways (perpendicular to the road) off the edge on the side
   away from its ramp, above the neighbouring crowds; only once it is clear of the road does it
   crouch, hop and open a parachute in its colour, then swing like a pendulum while drifting down
   and away.  Its passengers raise their arms and wave. */
const EXIT = {side:0.5, crouch:0.62, hop:0.86, chute:0.74};
function startExit(v, e){
  const b = v.b, r = v.boardRamp >= 0 ? L.RAMPS[v.boardRamp] : null;
  const hx = Math.sin(v.h), hz = Math.cos(v.h);                       // heading of the bus as drawn
  let ex, ez;
  if (r){ ex = hz*r.side; ez = -hx*r.side; }                          // away from the ramp it boarded at
  else { ex = e.side; ez = 0; }
  v.jump = {t0:e.t, x:v.p.x, y:v.p.y, z:v.p.z, h:v.h, ex, ez, dust:false, side:Math.sign(ex*hz - ez*hx) || 1};
  v.chute = makeChute(b.color); v.chute.visible = false; v.whooshed = false;
}
function updateJump(v, t, vdt){
  const J = v.jump, b = v.b;
  if (!J){ v.root.visible = false; return; }
  const u = t - J.t0;
  if (u > C.PARACHUTE_DURATION + 1.0){ v.root.visible = false; removeChute(v); return; }
  v.root.visible = true; v.slope.rotation.x *= 0.85; v.mat.color.setScalar(1); v.dark = 0;
  const OUT = C.ROAD_HALF + C.BUS_W/2 + 0.12;                          // centre this far out = clear of the road
  let x = J.x, y = J.y, z = J.z, sq = 1, swing = 0, lean = 0, yaw = 0;

  /* on-screen sizes in CSS px at the current viewport: standing stickmen (feet to top of head) and buses by capacity */
  measure(){
    camera.updateMatrixWorld(); const k = Math.min(innerWidth/DW, innerHeight/DH), m4 = new THREE.Matrix4(), p = new THREE.Vector3();
    const span = (pts, mat) => { let y0 = 1e9, y1 = -1e9; for (const q of pts){ p.set(...q).applyMatrix4(mat); const [, sy] = screenOf(p.x, p.y, p.z); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy); } return (y1 - y0)*k; };
    // silhouette of a standing figure: the head sphere and the two feet sampled in world space
    const dirs = []; for (let a = 0; a < 12; a++) for (let e = -2; e <= 2; e++){ const t = a/12*Math.PI*2, f = e/2*Math.PI/2; dirs.push([Math.cos(f)*Math.cos(t), Math.sin(f), Math.cos(f)*Math.sin(t)]); }
    const c = new THREE.Vector3(), men = [];
    game.men.forEach((m, i) => { if (m.state !== 'ramp') return; menIM.getMatrixAt(i, m4); let y0 = 1e9, y1 = -1e9;
      c.set(0, MH - HEAD_R, 0).applyMatrix4(m4); for (const d of dirs){ const [, sy] = screenOf(c.x + d[0]*HEAD_R, c.y + d[1]*HEAD_R, c.z + d[2]*HEAD_R); y0 = Math.min(y0, sy); }
      for (const sx of [-1, 1]){ c.set(sx*HIP[0], 0.06, 0).applyMatrix4(m4); for (const d of dirs){ const [, sy] = screenOf(c.x + d[0]*0.063, c.y + d[1]*0.063, c.z + d[2]*0.063); y1 = Math.max(y1, sy); } }
      men.push((y1 - y0)*k); });
    const bus = {}; views.forEach(v => { if (!v.root.visible) return; const L2 = v.b.len/2; v.root.updateMatrixWorld(true);
      const len = span([[0,0.4,L2],[0,0.4,-L2]], v.body.matrixWorld); (bus[v.b.cap] = bus[v.b.cap] || []).push(+len.toFixed(1)); });
    const bay8 = L.Y.BAY_X.map(x => { const z = C.parkZ(C.busLen(8)), a = screenOf(x, 0.4, z - C.busLen(8)/2), b = screenOf(x, 0.4, z + C.busLen(8)/2); return (b[1] - a[1])*k; });
    return {men:{n:men.length, min:Math.min(...men), avg:men.reduce((a, b) => a + b, 0)/Math.max(1, men.length)}, bus, bay8:Math.min(...bay8)};
  }
};
