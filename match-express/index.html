<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Match Express</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b3a22;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:"Arial Rounded MT Bold","Nunito","Baloo 2","Trebuchet MS",system-ui,sans-serif}
  #app{position:absolute;left:0;top:0;width:900px;height:1950px;transform-origin:0 0;overflow:hidden;background:#9fb878}
  #gl{position:absolute;left:0;top:0;width:900px;height:1950px;display:block}
  .ui{position:absolute;z-index:5}
  /* ---- top bar ---- */
  #levelPill{left:34px;top:40px;height:74px;padding:0 40px;border-radius:40px;display:flex;align-items:center;
    color:#fff;font-size:44px;font-weight:900;letter-spacing:.5px;
    background:linear-gradient(#56b6ff,#1f7ae6 70%,#1667cc);border:6px solid #ffc531;
    box-shadow:0 6px 0 #c98a12,0 10px 18px rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35);
    text-shadow:0 3px 0 #0d4ea3,0 0 2px #0d4ea3}
  .rbtn{width:86px;height:86px;border-radius:50%;top:34px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%,#6cc2ff,#1f7ae6 62%,#1563c6);border:6px solid #ffc531;
    box-shadow:0 6px 0 #c98a12,0 10px 18px rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35);cursor:pointer}
  .rbtn svg{width:50px;height:50px;filter:drop-shadow(0 3px 0 rgba(10,60,140,.8))}
  #btnRestart{right:132px} #btnSettings{right:32px;cursor:default}
  .rbtn:active{transform:translateY(3px)}
  /* ---- counter sign ---- */
  #counter{width:104px;height:116px;border-radius:24px;background:linear-gradient(#34477a,#25335c);
    border:6px solid #ffc531;box-shadow:0 7px 0 #c98a12,0 12px 18px rgba(0,0,0,.3),inset 0 0 0 3px #1b2647;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
    transform:translate(-50%,-50%);pointer-events:none}
  #counter svg{width:62px;height:48px;margin-top:2px}
  #cnt{font-size:36px;font-weight:900;line-height:1;margin-top:2px;text-shadow:0 3px 0 #0f1730}
  #counter.full{animation:pulse .7s ease-in-out infinite;border-color:#ff7a3c}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
  /* ---- panels ---- */
  .panel{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(16,24,38,.45)}
  .panel.show{display:flex;animation:fade .3s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{width:640px;padding:54px 40px 60px;border-radius:44px;text-align:center;color:#fff;
    background:linear-gradient(#4aa8ff,#1f6fd8);border:8px solid #ffc531;
    box-shadow:0 10px 0 #c98a12,0 24px 50px rgba(0,0,0,.4);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  .card.fail{background:linear-gradient(#ff8a65,#e0483a)}
  @keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
  .card h1{margin:0 0 14px;font-size:66px;font-weight:900;text-shadow:0 5px 0 rgba(0,0,0,.25)}
  .card p{margin:0 0 40px;font-size:36px;opacity:.95}
  .card button{font:inherit;font-size:50px;font-weight:900;color:#fff;padding:20px 80px;border-radius:40px;
    background:linear-gradient(#7be35b,#3fae2a);border:6px solid #fff;box-shadow:0 8px 0 #23801a;cursor:pointer}
  .card button:active{transform:translateY(4px);box-shadow:0 4px 0 #23801a}
  /* ---- debug ---- */
  #dbg{left:24px;top:140px;max-width:820px;display:none;padding:14px 18px;border-radius:16px;background:rgba(10,16,30,.78);
    color:#e9f1ff;font:600 22px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;pointer-events:none}
  #botTag{right:32px;top:140px;display:none;padding:8px 18px;border-radius:20px;background:#ff4f7b;color:#fff;
    font-size:28px;font-weight:900;box-shadow:0 4px 0 #b02750}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div class="ui" id="levelPill">Level 2</div>
  <div class="ui rbtn" id="btnRestart" title="Restart"><svg viewBox="0 0 48 48"><path d="M24 9a15 15 0 1 1-13.6 8.7" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M5 9l6.5 10.5L20 11z" fill="#fff"/></svg></div>
  <div class="ui rbtn" id="btnSettings" title="Settings"><svg viewBox="0 0 48 48"><path fill="#fff" d="M27.6 4l1.3 5.2a15.7 15.7 0 0 1 4.1 2.4l5.1-1.6 3.6 6.2-3.9 3.7a15.9 15.9 0 0 1 0 4.8l3.9 3.7-3.6 6.2-5.1-1.6a15.7 15.7 0 0 1-4.1 2.4L27.6 44h-7.2l-1.3-5.2a15.7 15.7 0 0 1-4.1-2.4l-5.1 1.6-3.6-6.2 3.9-3.7a15.9 15.9 0 0 1 0-4.8L6.3 19.6l3.6-6.2 5.1 1.6a15.7 15.7 0 0 1 4.1-2.4L20.4 4zM24 17a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"/></svg></div>
  <div class="ui" id="counter"><svg viewBox="0 0 64 50"><rect x="5" y="3" width="54" height="36" rx="9" fill="#fff"/><rect x="11" y="9" width="18" height="13" rx="3" fill="#2d3d6b"/><rect x="35" y="9" width="18" height="13" rx="3" fill="#2d3d6b"/><rect x="5" y="28" width="54" height="4" fill="#cfd8ee"/><circle cx="17" cy="41" r="6.5" fill="#fff" stroke="#2d3d6b" stroke-width="3"/><circle cx="47" cy="41" r="6.5" fill="#fff" stroke="#2d3d6b" stroke-width="3"/></svg><span id="cnt">0/5</span></div>
  <div class="ui" id="dbg"></div>
  <div class="ui" id="botTag">BOT</div>
  <div class="panel" id="winPanel"><div class="card"><h1>Level Complete</h1><p>Every passenger is on board!</p><button id="btnReplay">Replay</button></div></div>
  <div class="panel" id="failPanel"><div class="card fail"><h1>Out of Space</h1><p>A returning bus had nowhere to park.</p><button id="btnRetry">Retry</button></div></div>
</div>

<!-- ===================================================================================
     GAME CORE — rules, layout, frozen level, bots and the level generator.
     Plain script with no three.js dependency so the identical code runs headless.
     =================================================================================== -->
<script id="core">
(function (root) {
'use strict';

/* ============================== TUNING ============================== */
const BUS_SPEED          = 3.4;   // main-road cruise speed (world units / s)
const BOARD_RATE         = 8;     // stickmen leaving a front row per second (chains speed up)
const COLUMN_SHIFT_TIME  = 0.22;  // seconds for a column to step forward one place
const ROAD_CAPACITY      = 5;     // buses on + heading to + returning from the main road
const STATIC_SLOTS       = 5;     // parking bays in the static row
const PARACHUTE_DURATION = 2.6;   // seconds a full bus glides before leaving the screen
const RETURN_TUNNEL_TIME = 2.0;   // seconds between the top tunnel and the return tunnel
const WIN_PANEL_DELAY    = 1.0;   // seconds after the last parachute opens

/* ============================ LEVEL DATA ============================
   Produced once by generateLevel(seed) + searchSeed() (bottom of this script)
   and frozen here. Ramps: 4 columns each, listed FRONT (road end) to BACK.
   Lanes: front bus first. Edit by hand freely; the startup check re-validates. */
const LEVEL_DATA = /*LEVEL_BEGIN*/{
  "seed": 11,
  "ramps": [
    {"columns": [   // ramp 1 (lower right), front -> back
      ["red", "red", "orange", "orange", "pink", "pink", "green", "green", "yellow", "purple"],
      ["purple", "purple", "cyan", "cyan", "cyan", "blue", "blue", "purple", "blue", "blue"],
      ["red", "red", "pink", "pink", "pink", "orange", "orange", "red", "red", "red"],
      ["orange", "orange", "orange", "orange", "green", "green", "green", "orange", "orange", "yellow"]
    ]},
    {"columns": [   // ramp 2 (lower left), front -> back
      ["pink", "pink", "pink", "pink", "red", "red", "purple", "red", "red"],
      ["red", "red", "green", "green", "yellow", "yellow", "purple", "purple", "purple"],
      ["orange", "blue", "blue", "blue", "cyan", "cyan", "yellow", "yellow", "green"],
      ["green", "orange", "orange", "pink", "pink", "pink", "green", "red", "red"]
    ]},
    {"columns": [   // ramp 3 (middle right), front -> back
      ["green", "green", "yellow", "yellow", "purple", "purple", "yellow", "green", "green", "blue"],
      ["orange", "orange", "orange", "orange", "purple", "purple", "yellow", "green", "green", "orange"],
      ["yellow", "yellow", "cyan", "red", "red", "purple", "orange", "orange", "orange", "cyan"],
      ["purple", "purple", "pink", "pink", "pink", "cyan", "cyan", "cyan", "purple", "yellow"]
    ]},
    {"columns": [   // ramp 4 (upper left), front -> back
      ["yellow", "pink", "pink", "pink", "pink", "yellow", "yellow", "yellow", "cyan"],
      ["pink", "pink", "pink", "pink", "yellow", "yellow", "red", "red", "cyan"],
      ["cyan", "cyan", "cyan", "blue", "green", "yellow", "yellow", "yellow", "yellow"],
      ["green", "red", "red", "red", "red", "purple", "purple", "orange", "orange"]
    ]},
    {"columns": [   // ramp 5 (top right), front -> back
      ["purple", "purple", "blue", "cyan", "cyan", "cyan", "cyan", "blue", "yellow", "green"],
      ["green", "green", "green", "blue", "red", "orange", "purple", "purple", "blue", "blue"],
      ["blue", "green", "cyan", "cyan", "purple", "purple", "blue", "cyan", "cyan", "blue"],
      ["pink", "blue", "blue", "blue", "green", "blue", "cyan", "blue", "blue", "blue"]
    ]}
  ],
  "lanes": [
    [   // lane 1, front first
      {"color": "red", "cap": 4},
      {"color": "pink", "cap": 12},
      {"color": "orange", "cap": 6},
      {"color": "green", "cap": 12, "hidden": true},
      {"color": "purple", "cap": 8},
      {"color": "pink", "cap": 6},
      {"color": "yellow", "cap": 6},
      {"color": "blue", "cap": 4},
      {"color": "cyan", "cap": 8}
    ],
    [   // lane 2, front first
      {"color": "blue", "cap": 4},
      {"color": "cyan", "cap": 8},
      {"color": "purple", "cap": 6},
      {"color": "yellow", "cap": 6},
      {"color": "pink", "cap": 6},
      {"color": "blue", "cap": 8},
      {"color": "orange", "cap": 8},
      {"color": "orange", "cap": 6},
      {"color": "green", "cap": 12}
    ],
    [   // lane 3, front first
      {"color": "purple", "cap": 4},
      {"color": "yellow", "cap": 12},
      {"color": "red", "cap": 8},
      {"color": "cyan", "cap": 8},
      {"color": "blue", "cap": 8},
      {"color": "red", "cap": 12},
      {"color": "orange", "cap": 4},
      {"color": "purple", "cap": 6, "hidden": true}
    ]
  ]
}/*LEVEL_END*/;

/* ====================== RULE / LAYOUT CONSTANTS ===================== */
const COLORS = ["red","orange","yellow","green","cyan","blue","purple","pink"];
const HEX = {red:"#E53935",orange:"#FB8C00",yellow:"#FDD835",green:"#43A047",
             cyan:"#00ACC1",blue:"#1E88E5",purple:"#8E24AA",pink:"#EC407A"};
const BUS_PLAN = {red:[12,8,4],orange:[6,6,8,4],yellow:[6,6,12],green:[12,12],
                  cyan:[8,8,8],blue:[8,8,4,4],purple:[8,6,6,4],pink:[12,6,6]};
const PER_COLOR = 24, RAMP_ROWS = [10,9,10,9,10], RAMP_COLS = 4, LANE_SIZES = [9,9,8];

const YARD_SPEED = 4.2, ACCEL = 3.6, SOFT_BRAKE = 3.0, HARD_BRAKE = 11;
const ROAD_GAP = 0.32, FOLLOW_GAP = 0.26, LANE_GAP = 0.3;
const CELL = 0.3, CELL_M = 0.1;   // yard traffic: swept-footprint grid (cell size, safety margin)
const RUN_TIME = 0.5;          // a boarding stickman's run + hop into the seat
const BOT_THINK = 0.4;         // bots look at the board this often (game seconds)
const SIM_DT = 1/30;           // headless simulation step

/* world layout (x right, z toward the camera / south, y up) */
const BUS_W = 0.98, ROW_PITCH = 0.34, ROAD_HALF = 0.74;
const busLen = cap => cap/2*ROW_PITCH + 0.52;
const Z_ENTRY = 0, Z_ROAD0 = -1.3;
const BAY_X = [-2.72,-1.36,0,1.36,2.72], Z_BAY_TOP = 1.18, Z_BAY_BOT = 4.0;
const Z_COLL = 5.2, Z_LANE_TOP = 6.28, LANE_X = [-1.72,0,1.72];
const X_SIDE = 4.32, TUNNEL_X = 5.45;
const TUNNEL = {x:TUNNEL_X, z:Z_COLL, nx:-0.8, nz:0.6, depth:1.6};   // return tunnel mouth faces west-south-west
const parkZ = len => Z_BAY_TOP + 0.08 + len/2;
const laneSlotZ = len => Z_LANE_TOP + 0.12 + len/2;

/* main road control points [x, y, z]: S-curves, one spiral loop, top tunnel.
   The loop runs north, circles clockwise and crosses its own entry 1.35 higher. */
const LOOP = {x0:-0.2, zc:-9.1, R:1.4};
const ROAD_CP = (() => {
  const {x0, zc, R} = LOOP, cx = x0 + R, cz = zc - R, cp = [
    [0,0,-1.3],[0,0.03,-2.2],[0.55,0.2,-3.2],[0.78,0.4,-4.3],[0.3,0.6,-5.5],
    [-0.7,0.85,-6.5],[-0.98,1.0,-7.5],[-0.5,1.14,-8.6],[x0,1.25,zc]];
  const ang = [180,225,270,315,0,45,90];            // west → north → east → south (screen clockwise)
  ang.forEach((a,i) => { const r = a*Math.PI/180;
    cp.push([cx + R*Math.cos(r), 1.42 + i*0.18, cz - R*Math.sin(r)]); });
  cp.push([x0,2.6,zc],[-1.3,2.7,zc-0.05],[-1.95,2.78,zc-0.95],[-1.88,2.86,zc-2.15],[-1.15,2.95,-12.6],
          [0.55,3.05,-14.05],[0.78,3.14,-15.2],[0.0,3.24,-16.3],[-0.8,3.34,-17.35],[-0.72,3.44,-18.5],
          [0.2,3.54,-19.5],[0.8,3.64,-20.55],[0.62,3.72,-21.6],[0.05,3.78,-22.6],[0,3.8,-23.6],[0,3.8,-25.7]);
  return cp;
})();
const PORTAL_CP = ROAD_CP.length - 2;              // tunnel mouth control point
/* ramps: attach at a road control point, on the right (+1) or left (-1) */
const RAMP_DEF = [{cp:3, side:1},{cp:6, side:-1},{cp:21, side:1},{cp:24, side:-1},{cp:27, side:1}];
const RAMP_SP = 0.36;                               // stickman spacing along and across a ramp

/* ============================= HELPERS ============================== */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(a, rng){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const clamp = (v,a,b) => v<a?a:v>b?b:v;

/* centripetal Catmull-Rom, the same formulation as THREE.CatmullRomCurve3('centripetal') */
function catmullRom(cps, perSeg){
  const n = cps.length, pts = [], cpIdx = [];
  const at = i => i < 0 ? cps[0].map((v,k)=>2*v-cps[1][k]) : i >= n ? cps[n-1].map((v,k)=>2*v-cps[n-2][k]) : cps[i];
  const d = (a,b) => Math.pow((a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2, 0.25);
  for (let i=0;i<n-1;i++){
    const p0=at(i-1), p1=at(i), p2=at(i+1), p3=at(i+2);
    let dt0=d(p0,p1), dt1=d(p1,p2), dt2=d(p2,p3);
    if (dt1<1e-4) dt1=1; if (dt0<1e-4) dt0=dt1; if (dt2<1e-4) dt2=dt1;
    const co = [0,1,2].map(k => {
      let t1=(p1[k]-p0[k])/dt0-(p2[k]-p0[k])/(dt0+dt1)+(p2[k]-p1[k])/dt1;
      let t2=(p2[k]-p1[k])/dt1-(p3[k]-p1[k])/(dt1+dt2)+(p3[k]-p2[k])/dt2;
      t1*=dt1; t2*=dt1;
      return [p1[k], t1, -3*p1[k]+3*p2[k]-2*t1-t2, 2*p1[k]-2*p2[k]+t1+t2];
    });
    cpIdx.push(pts.length);
    for (let j=0;j<perSeg;j++){ const t=j/perSeg; pts.push(co.map(c=>c[0]+c[1]*t+c[2]*t*t+c[3]*t*t*t)); }
  }
  cpIdx.push(pts.length); pts.push(cps[n-1].slice());
  return {pts, cpIdx};
}
/* polyline with arc length; lookups return position, unit horizontal heading and slope */
function makePath(pts){
  const n = pts.length, P = new Float64Array(n*3), cum = new Float64Array(n);
  for (let i=0;i<n;i++){ P[i*3]=pts[i][0]; P[i*3+1]=pts[i][1]; P[i*3+2]=pts[i][2];
    if (i) cum[i] = cum[i-1] + Math.hypot(P[i*3]-P[i*3-3], P[i*3+1]-P[i*3-2], P[i*3+2]-P[i*3-1]); }
  return {P, cum, n, len: cum[n-1]};
}
function pathAt(path, s, o, hint){
  const {P, cum, n} = path; s = clamp(s, 0, path.len);
  let i = clamp(hint|0, 0, n-2);
  while (i < n-2 && cum[i+1] < s) i++;
  while (i > 0 && cum[i] > s) i--;
  const L = cum[i+1]-cum[i], f = L > 0 ? (s-cum[i])/L : 0, a = i*3, b = a+3;
  o.x = P[a]+(P[b]-P[a])*f; o.y = P[a+1]+(P[b+1]-P[a+1])*f; o.z = P[a+2]+(P[b+2]-P[a+2])*f;
  const hx = P[b]-P[a], hz = P[b+2]-P[a+2], h = Math.hypot(hx,hz) || 1;
  o.dx = hx/h; o.dz = hz/h; o.slope = (P[b+1]-P[a+1])/h;
  return i;
}
/* yard routes: corner points [x,z] joined with rounded (quadratic) corners */
function filletPath(raw, r){
  const P = [];
  for (const p of raw) if (!P.length || Math.hypot(p[0]-P[P.length-1][0], p[1]-P[P.length-1][1]) > 1e-6) P.push(p);
  for (let i=1;i<P.length-1;i++){       // drop collinear corners
    const a=P[i-1], b=P[i], c=P[i+1];
    if (Math.abs((b[0]-a[0])*(c[1]-b[1]) - (b[1]-a[1])*(c[0]-b[0])) < 1e-9 &&
        (b[0]-a[0])*(c[0]-b[0]) + (b[1]-a[1])*(c[1]-b[1]) > 0){ P.splice(i,1); i--; }
  }
  const out = [[P[0][0],0,P[0][1]]];
  for (let i=1;i<P.length-1;i++){
    const a=P[i-1], b=P[i], c=P[i+1], l1=Math.hypot(a[0]-b[0],a[1]-b[1]), l2=Math.hypot(c[0]-b[0],c[1]-b[1]);
    const t = Math.min(r, l1*0.5, l2*0.5);
    const t1=[b[0]+(a[0]-b[0])/l1*t, b[1]+(a[1]-b[1])/l1*t], t2=[b[0]+(c[0]-b[0])/l2*t, b[1]+(c[1]-b[1])/l2*t];
    for (let k=0;k<=10;k++){ const u=k/10, w0=(1-u)*(1-u), w1=2*u*(1-u), w2=u*u;
      out.push([w0*t1[0]+w1*b[0]+w2*t2[0], 0, w0*t1[1]+w1*b[1]+w2*t2[1]]); }
  }
  out.push([P[P.length-1][0],0,P[P.length-1][1]]);
  return makePath(out);
}

/* ============================== LAYOUT ============================== */
const ROAD = (() => {
  const {pts, cpIdx} = catmullRom(ROAD_CP, 28), path = makePath(pts);
  path.cpS = cpIdx.map(i => path.cum[i]);
  path.portalS = path.cpS[PORTAL_CP];
  path.end = path.len - 0.6;                        // centre this far in = fully inside the tunnel
  return path;
})();
const RAMPS = RAMP_DEF.map((d, k) => {
  const s = ROAD.cpS[d.cp], p = {}; pathAt(ROAD, s, p, 0);
  const nx = -p.dz*d.side, nz = p.dx*d.side;      // outward horizontal normal
  const ax = p.x + nx*(ROAD_HALF+0.06), az = p.z + nz*(ROAD_HALF+0.06), y = p.y;
  const dir = a => [d.side*Math.cos(a), -Math.sin(a)];
  const a0 = Math.atan2(-nz, nx*d.side), a1 = 0.86;  // leave the road square-on, bend toward "up"
  const c = [[ax,y,az]], segs = [[a0,1.3],[(a0+a1)/2,1.3],[a1,2.0]];
  for (const [a,l] of segs){ const q=c[c.length-1], v=dir(a); c.push([q[0]+v[0]*l, y, q[2]+v[1]*l]); }
  const spl = makePath(catmullRom(c, 24).pts);
  const rows = RAMP_ROWS[k], slots = [];
  for (let col=0; col<RAMP_COLS; col++){
    const colSlots = [];
    for (let r=0; r<rows; r++){
      const o = {}; pathAt(spl, 0.34 + r*RAMP_SP, o, 0);
      const lat = (col - 1.5)*RAMP_SP;             // left normal of the ramp heading
      colSlots.push({x:o.x + o.dz*lat, y, z:o.z - o.dx*lat, fx:-o.dx, fz:-o.dz});
    }
    slots.push(colSlots);
  }
  const colOrder = [0,1,2,3].sort((a,b) =>
    Math.hypot(slots[a][0].x-p.x, slots[a][0].z-p.z) - Math.hypot(slots[b][0].x-p.x, slots[b][0].z-p.z));

function routeToRoad(x, z, side){                 // from a lane, via the nearer side lane
  const sx = side*X_SIDE;
  return filletPath([[x,z],[x,Z_COLL],[sx,Z_COLL],[sx,Z_ENTRY],[0,Z_ENTRY],[0,Z_ROAD0]], 0.6);
}
function routeBayToRoad(x, z){ return filletPath([[x,z],[x,Z_ENTRY],[0,Z_ENTRY],[0,Z_ROAD0]], 0.6); }

  return {x: (i%2 ? 0.21 : -0.21), y: 0.52, z: len/2 - 0.31 - row*ROW_PITCH};

/* ============================ GAME STATE ============================ */
function createGame(level, opts){
  opts = opts || {};

    men:[], buses:[], ramps:[], lanes:[[],[],[]], laneLeft:[-1,-1,-1],
    bays:new Array(STATIC_SLOTS).fill(-1), bayRes:new Array(STATIC_SLOTS).fill(-1),
    road:[], trips:[], tunnel:[], running:[], counter:0, toRoad:0, landed:0,
    sends:0, moves:[], tripSeq:0, sideUse:[0,0]};
  level.ramps.forEach((r, k) => {
    const ramp = {k, cols:[], empty:false};
    r.columns.forEach((col, c) => { const ids = [];
      col.forEach(color => { const id = g.men.length;
        g.men.push({id, color, ramp:k, col:c, state:'ramp', bus:-1, seat:-1, tLand:0}); ids.push(id); });
      ramp.cols.push(ids); });
    g.ramps.push(ramp);

  level.lanes.forEach((lane, l) => {
    let z = Z_LANE_TOP + 0.12;
    lane.forEach((d, i) => {
      const len = busLen(d.cap);
      const b = {id:g.buses.length, color:d.color, cap:d.cap, hidden:!!d.hidden, revealed:!d.hidden || i===0,
        len, state:'lane', lane:l, bay:-1, x:LANE_X[l], y:0, z:z+len/2, dx:0, dz:-1, slope:0, v:0,
        rs:0, seg:0, nextRamp:0, seated:0, transit:0, trip:null, board:null, side:1, tJump:0, tExit:0};
      z += len + LANE_GAP;

}
const emit = (g, type, data) => { if (g.emit) g.events.push(Object.assign({type, t:g.t}, data)); };

  for (const r of g.ramps) for (const col of r.cols) if (col.length) n[g.men[col[0]].color]++; return n; }

  for (const col of g.ramps[k].cols) if (col.length && g.men[col[0]].color === color) return true;
  return false;

/* --------------------------- player actions -------------------------- */
/* Every yard route rasterises the footprint it sweeps (bus rectangle + margin) into grid cells,
   remembering the first and last path position at which each cell is touched. */
function sweepCells(path, len){
  const cells = new Map(), o = {}, hl = len/2 + CELL_M, hw = BUS_W/2 + CELL_M, h = CELL/2;
  let seg = 0;
  for (let s = 0, done = false; !done; s += 0.1){
    if (s >= path.len){ s = path.len; done = true; }
    seg = pathAt(path, s, o, seg);
    const ax = Math.abs(o.dx), az = Math.abs(o.dz), ex = ax*hl + az*hw, ez = az*hl + ax*hw;
    for (let ix = Math.floor((o.x-ex)/CELL); ix <= Math.floor((o.x+ex)/CELL); ix++)
      for (let iz = Math.floor((o.z-ez)/CELL); iz <= Math.floor((o.z+ez)/CELL); iz++){
        const cx = (ix+0.5)*CELL - o.x, cz = (iz+0.5)*CELL - o.z;
        if (Math.abs(cx*o.dx + cz*o.dz) > hl + h*(ax+az)) continue;      // separating axis: bus length
        if (Math.abs(cz*o.dx - cx*o.dz) > hw + h*(ax+az)) continue;      // separating axis: bus width
        const key = (ix+512)*4096 + (iz+2048), c = cells.get(key);
        if (c) c.o = s; else cells.set(key, {i:s, o:s});

}
/* conflict list of a new trip b against an earlier trip e: shared cells sorted by when e leaves them,

function pairConflict(b, e){
  const list = [];
  for (const [k, c] of b.trip.cells){ const ec = e.trip.cells.get(k); if (ec) list.push([ec.o, c.i]); }
  if (!list.length) return null;
  list.sort((p, q) => p[0] - q[0]);
  const suf = new Float64Array(list.length); let m = Infinity;
  for (let i=list.length-1;i>=0;i--){ m = Math.min(m, list[i][1]); suf[i] = m; }
  return {e, etrip:e.trip, list, suf, p:0};
}
function startTrip(g, b, kind, path){

  for (const e of g.trips){ const c = pairConflict(b, e); if (c) b.trip.conf.push(c); }
  b.v = 0; g.trips.push(b);
}
function sendToRoad(g, b, from, idx){

    const side = idx === 0 ? -1 : idx === 2 ? 1 : (g.sideUse[1] < g.sideUse[0] ? 1 : -1);
    b.side = side; g.sideUse[side > 0 ? 1 : 0]++;
    path = routeToRoad(b.x, b.z, side);
  } else path = routeBayToRoad(b.x, b.z);
  b.state = 'toRoad'; g.toRoad++; g.sends++;
  startTrip(g, b, 'toRoad', path);
  g.moves.push((from === 'lane' ? 'L' : 'B') + idx + ':' + b.color + b.cap + '>road');
  emit(g, 'send', {bus:b.id, from, idx, dest:'road'});
}
function afterLaneShift(g, l, departed){

}
function tapLane(g, l){
  if (g.result) return 'over';
  const lane = g.lanes[l]; if (!lane.length) return 'empty';
  const b = g.buses[lane[0]];
  if (canRoad(g)){ lane.shift(); sendToRoad(g, b, 'lane', l); afterLaneShift(g, l, b.id); return 'road'; }
  const k = freeBay(g);
  if (k >= 0){
    lane.shift(); g.bayRes[k] = b.id; b.bay = k; b.state = 'toBay'; g.sends++;
    startTrip(g, b, 'toBay', routeLaneToBay(b.x, b.z, k, b.len));
    g.moves.push('L' + l + ':' + b.color + b.cap + '>bay' + k);
    emit(g, 'send', {bus:b.id, from:'lane', idx:l, dest:'bay', bay:k});
    afterLaneShift(g, l, b.id); return 'bay';

function tapBay(g, k){
  if (g.result) return 'over';
  const id = g.bays[k]; if (id < 0) return 'none';
  const b = g.buses[id];

/* ------------------------------ movement ----------------------------- */
const tmp = {};
function placeOnPath(b){ const tr = b.trip; tr.seg = pathAt(tr.path, tr.s, tmp, tr.seg);
  b.x=tmp.x; b.y=0; b.z=tmp.z; b.dx=tmp.dx; b.dz=tmp.dz; b.slope=0; }
function placeOnRoad(b){ b.seg = pathAt(ROAD, b.rs, tmp, b.seg);
  b.x=tmp.x; b.y=tmp.y; b.z=tmp.z; b.dx=tmp.dx; b.dz=tmp.dz; b.slope=tmp.slope; }
/* how far bus b may advance before touching obstacle o (oriented-box test along b's heading) */
function clearAhead(b, o){
  const dx = o.x-b.x, dz = o.z-b.z, fwd = dx*b.dx + dz*b.dz;
  if (fwd <= 0) return Infinity;
  const lat = Math.abs(dx*b.dz - dz*b.dx);
  const c = Math.abs(o.dx*b.dx + o.dz*b.dz), s = Math.abs(o.dx*b.dz - o.dz*b.dx);
  if (lat > BUS_W/2 + s*o.len/2 + c*BUS_W/2 + 0.04) return Infinity;
  return fwd - b.len/2 - (c*o.len/2 + s*BUS_W/2) - FOLLOW_GAP;
}
function roadEntryFree(g, b){
  const last = g.road[g.road.length-1];

}
function stepLanes(g, dt){
  for (let l=0;l<3;l++){
    let limit = -Infinity;                       // nothing may pass the tail of the bus that just left
    const dep = g.laneLeft[l] >= 0 ? g.buses[g.laneLeft[l]] : null;
    if (dep && dep.trip){
      const rx = dep.x - dep.dx*dep.len/2, rz = dep.z - dep.dz*dep.len/2;
      if (Math.abs(rx - LANE_X[l]) < 0.8 && rz > Z_LANE_TOP - 0.7) limit = rz + LANE_GAP;
    }
    let slot = Z_LANE_TOP + 0.12;
    for (const id of g.lanes[l]){
      const b = g.buses[id], target = Math.max(slot + b.len/2, limit + b.len/2);
      slot += b.len + LANE_GAP;

      b.v = (b.z - nz)/dt; b.z = nz;

}
function stepTrips(g, dt){
  const T = g.trips;

    const b = T[i], tr = b.trip, P = tr.path;

    for (const cf of tr.conf){
      if (cf.e.trip !== cf.etrip) continue;                       // that trip is finished
      const es = cf.etrip.s;
      while (cf.p < cf.list.length && es > cf.list[cf.p][0] + 0.12) cf.p++;
      if (cf.p < cf.list.length) sMax = Math.min(sMax, Math.max(tr.s, cf.suf[cf.p] - 0.12));
    }

    let room = Infinity;
    for (let j=0;j<i;j++) room = Math.min(room, clearAhead(b, T[j]));   // later trips always yield to us
    for (let j=g.road.length-1;j>=0;j--){ const r = g.road[j]; if (r.rs > 5) break; room = Math.min(room, clearAhead(b, r)); }

    vt = Math.min(vt, Math.sqrt(2*HARD_BRAKE*Math.max(0, sMax - tr.s)));

function startRound(g, b){

    if (col.length && g.men[col[0]].color === b.color) q.push(c); }

}
function boardInterval(chain){ return Math.max(0.42, 1 - 0.07*chain) / BOARD_RATE; }
function stepBoarding(g, b){

    const c = B.queue.shift(), id = ramp.cols[c].shift(), m = g.men[id];
    m.state = 'run'; m.bus = b.id; m.seat = b.seated + b.transit; m.tLand = g.t + RUN_TIME;
    b.transit++; g.running.push(id);

    B.chain++; B.next += boardInterval(B.chain);

  emit(g, 'jump', {bus:b.id, side:b.side});

      if (b.board){ b.v = 0; continue; }
    }

    const sLimit = lead ? lead.rs - lead.len/2 - b.len/2 - ROAD_GAP : Infinity;
    const k = b.nextRamp, bk = k < RAMPS.length ? RAMPS[k].s : Infinity;

function step(g, dt){

  stepTunnel(g);

/* ================================ BOTS =============================== */
/* Both bots tap only when the bus would go to the main road (road check passes).
   Greedy: the available bus whose colour has the most stickmen in the ramps' front rows.
   Random: a uniformly random available bus. */
function legalSends(g){
  if (!canRoad(g)) return [];
  const a = [];
  for (let k=0;k<STATIC_SLOTS;k++) if (g.bays[k] >= 0) a.push({kind:'bay', idx:k, bus:g.bays[k]});
  for (let l=0;l<3;l++) if (g.lanes[l].length) a.push({kind:'lane', idx:l, bus:g.lanes[l][0]});
  return a;
}
function greedyPick(g){
  const acts = legalSends(g); if (!acts.length) return null;
  const fc = frontColors(g); let best = null, bestScore = -1;
  for (const a of acts){                         // ties: free a bay when something matches, dig into the queue when nothing does
    const sc = fc[g.buses[a.bus].color];
    if (sc > bestScore || (sc === bestScore && sc === 0 && a.kind === 'lane' && best.kind === 'bay')){ best = a; bestScore = sc; }
  }
  if (bestScore === 0 && g.counter + g.toRoad > 0) return null;   // nothing matches yet: let traffic clear first
  return best;
}
function randomPick(g, rng){ const acts = legalSends(g); return acts.length ? acts[Math.floor(rng()*acts.length)] : null; }
function applyAction(g, a){ return a.kind === 'lane' ? tapLane(g, a.idx) : tapBay(g, a.idx); }
function simulate(level, policy, rng, dt, maxT){
  dt = dt || SIM_DT; maxT = maxT || 1500;
  const g = createGame(level, {headless:true});
  let think = 0;
  while (!g.result && g.t < maxT){
    think -= dt;
    if (think <= 0){ think += BOT_THINK; const a = policy(g, rng); if (a) applyAction(g, a); }
    step(g, dt);
  }
  return {result: g.result || 'timeout', t: g.t, sends: g.sends, moves: g.moves, landed: g.landed};
}

/* ============================== VALIDATION ========================== */
function validateLevel(level){
  const men = {}, seats = {}, problems = [];
  COLORS.forEach(c => { men[c]=0; seats[c]=0; });
  level.ramps.forEach((r, k) => {
    if (r.columns.length !== RAMP_COLS) problems.push(`ramp ${k+1}: ${r.columns.length} columns`);
    r.columns.forEach((col, c) => {
      if (col.length !== RAMP_ROWS[k]) problems.push(`ramp ${k+1} col ${c+1}: ${col.length} rows (want ${RAMP_ROWS[k]})`);
      let run = 0; col.forEach((x, i) => { men[x]++; run = i && col[i-1] === x ? run+1 : 1;
        if (run > 4) problems.push(`ramp ${k+1} col ${c+1}: run longer than 4`); });
    });
    const kinds = new Set(r.columns.flat()).size;
    if (kinds < 6) problems.push(`ramp ${k+1}: only ${kinds} colours`);
  });
  const front = new Set(); level.ramps.forEach(r => r.columns.forEach(col => col.length && front.add(col[0])));
  if (front.size < 5) problems.push(`front rows show only ${front.size} colours`);
  let buses = 0; const sizes = new Set();
  level.lanes.forEach((lane, l) => lane.forEach((b, i) => { seats[b.color] += b.cap; buses++; sizes.add(b.cap);
    if (b.hidden && i < 2) problems.push(`lane ${l+1}: hidden bus in position ${i+1}`); }));
  const hidden = level.lanes.flat().filter(b => b.hidden).length;
  if (hidden !== 2) problems.push(`${hidden} hidden buses (want 2)`);
  if (buses !== 26) problems.push(`${buses} buses (want 26)`);
  if (sizes.size !== 4) problems.push(`bus sizes used: ${[...sizes]}`);
  const perColor = COLORS.map(c => ({color:c, seats:seats[c], men:men[c], ok:seats[c] === men[c] && men[c] === PER_COLOR}));
  perColor.forEach(p => { if (!p.ok) problems.push(`${p.color}: ${p.seats} seats vs ${p.men} stickmen`); });
  return {perColor, problems, ok: !problems.length};
}

function busGeo(cap, color){

  const L = C.busLen(cap), W = C.BUS_W, pal = palette(color), parts = [];
  const add = (geo, m, c) => parts.push({geo, m, color:c});
  const wheel = new THREE.CylinderGeometry(0.17, 0.17, 0.13, 12).rotateZ(Math.PI/2);

  add(rbox(W, 0.32, L, 0.12, 2), M(0, 0.37, 0), pal.body);

  const wy = 0.6, wh = 0.27;
  add(rbox(0.1, wh, L, 0.045, 1), M(-(W/2 - 0.05), wy, 0), inward('x', -1));
  add(rbox(0.1, wh, L, 0.045, 1), M( (W/2 - 0.05), wy, 0), inward('x', 1));

  add(rbox(W, wh, 0.1, 0.045, 1), M(0, wy, -(L/2 - 0.05)), inward('z', -1));
  add(new THREE.BoxGeometry(W - 0.16, 0.02, L - 0.16), M(0, 0.535, 0), pal.inner);
  for (let r=0; r<cap/2; r++){ const z = L/2 - 0.31 - r*C.ROW_PITCH;
    for (const sx of [-1, 1]){ add(SEAT, M(sx*0.21, 0.575, z + 0.01), pal.seat); add(BACK, M(sx*0.21, 0.65, z - 0.11), pal.seat); } }

  add(rbox(W*0.92, 0.1, 0.07, 0.03, 1), M(0, 0.25, -L/2 - 0.005), pal.trim);

}

const canopyGeo = (() => {

    const cx = (P.getX(i)+P.getX(i+1)+P.getX(i+2))/3, cz = (P.getZ(i)+P.getZ(i+1)+P.getZ(i+2))/3;
    const k = Math.floor((Math.atan2(cz, cx) + Math.PI)/(Math.PI/4)) % 2 ? 1 : 0.55;
    for (let j=0;j<3;j++){ cl[(i+j)*3] = 1; cl[(i+j)*3+1] = k; cl[(i+j)*3+2] = k; }

})();
function makeChute(color){

let AC = null, master = null;
function audio(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, delay=0, filt=0){
  if (!AC || AC.state !== 'running') return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = o; if (filt){ const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filt; o.connect(f); node = f; }
  node.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol, freq, q=1, delay=0, out){
  if (!AC || AC.state !== 'running') return;
  const t = AC.currentTime + delay, n = Math.floor(AC.sampleRate*dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2 - 1)*(1 - i/n);
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(out || master); src.start(t);
}

  horn(){ tone('square', 392, 0, 0.32, 0.12, 0, 1500); tone('square', 494, 0, 0.32, 0.1, 0, 1500); tone('square', 392, 0, 0.18, 0.1, 0.36, 1500); tone('square', 494, 0, 0.18, 0.08, 0.36, 1500); },

let game, views, MV, winAt = Infinity, failAt = Infinity, crash = null, DEBUG = false, botOn = false, botT = 0;
function resetGame(){
  if (views) views.forEach(v => { removeChute(v); v.dispose(); });
  game = C.createGame(LEVEL);
  views = game.buses.map(b => new BusView(b));
  MV = game.men.map((m, i) => ({disp:m === undefined ? 0 : game.ramps[m.ramp].cols[m.col].indexOf(i), from:0, to:0, t0:-1,
    ph:hash(i, 7)*6.28, lookT:hash(i, 3)*6, look:0, lookTo:0, runFrom:null, landT:-9, fly:null}));
  MV.forEach(v => { v.from = v.to = v.disp; });
  game.men.forEach((m, i) => game.men[i].color && menIM.setColorAt(i, col(C.HEX[m.color])));
  menIM.instanceColor.needsUpdate = true;
  armIM.instanceColor || armIM.setColorAt(0, col('#fff'));
  game.men.forEach((m, i) => { const c = col(C.HEX[m.color]); armIM.setColorAt(i*2, c); armIM.setColorAt(i*2 + 1, c); });
  armIM.instanceColor.needsUpdate = true;
  winAt = failAt = Infinity; crash = null; botT = 0; shake = 0;
  badges.forEach(b => { b.visible = false; b.scale.set(0, 0, 1); });
  fx.forEach(f => f(Infinity)); fx.length = 0;          // finish (and remove) any running effects
  $('winPanel').classList.remove('show'); $('failPanel').classList.remove('show');
  updateScene(0);
}

/* ------------------------------ events ------------------------------ */
function handleEvents(){
  for (const e of game.events){
    const v = e.bus !== undefined ? views[e.bus] : null;
    switch (e.type){
      case 'send': sfx.motor(); break;
      case 'refuse': v.shakeT = e.t; sfx.warn(); break;
      case 'lurch': v.lurchT = e.t; sfx.warn(); break;
      case 'reveal': v.reveal(); sparkle(new THREE.Vector3(v.b.x, 0.2, v.b.z), C.HEX[v.b.color]); sfx.sparkle(); break;
      case 'merge': {           // the bus queued right behind flashes its headlights twice
        const next = game.trips.find(b => b.trip.kind === 'toRoad' && Math.hypot(b.x, b.z - C.Z_ROAD0) < 4.2);
        if (next) views[next.id].flashT = e.t + 0.15; break; }
      case 'board': { const m = MV[e.man], sp = slotPos(game.men[e.man], m.disp); m.runFrom = new THREE.Vector3(sp.x, sp.y, sp.z); m.runT = e.t;
        const r = game.ramps[e.ramp];
        r.cols[e.col].forEach((id, i) => { const mv = MV[id]; mv.from = mv.disp; mv.to = i; mv.t0 = e.t + 0.06 + i*0.035; });
        break; }
      case 'land': { MV[e.man].landT = e.t; v.dipV -= 0.55; sfx.pop(e.chain); break; }
      case 'jump': v.jump = {t0:e.t, side:e.side, x:v.b.x, y:v.b.y, z:v.b.z, h:Math.atan2(v.b.dx, v.b.dz), slope:v.b.slope};
        v.chute = makeChute(v.b.color); sfx.horn(); break;
      case 'win': winAt = e.t + 0.55 + C.WIN_PANEL_DELAY; setTimeout(() => sfx.win(), 900); break;
      case 'tunnelIn': sfx.echo(); break;
      case 'rampEmpty': { const b = badges[e.ramp]; b.visible = true; b.userData.t0 = e.t; break; }
      case 'crash': startCrash(e); break;
    }
  }
  game.events.length = 0;
}

/* --------------------------- crash + dominoes --------------------------- */
function startCrash(e){
  const occupants = [];
  for (let k = C.STATIC_SLOTS - 1; k >= 0; k--){ const id = game.bays[k] >= 0 ? game.bays[k] : game.bayRes[k]; if (id >= 0) occupants.push(views[id]); }
  // anything still driving through the crash zone gets knocked aside too
  const knocked = game.trips.filter(b => b.id !== e.bus && b.x > C.BAY_X[4] + 0.2 && b.z > -0.8 && b.z < C.Z_COLL + 0.8).map(b => views[b.id]);
  crash = {t0:e.t, v:views[e.bus], chain:occupants, knocked, hit:false};
  failAt = e.t + 3.0;
}
function updateCrash(t){
  const c = crash, v = c.v, b = v.b, u = t - c.t0;
  // out of the tunnel, swerve up the side lane and slide sideways into the parked bus nearest the tunnel
  const T = C.TUNNEL, first = c.chain[0], tx = (first ? first.b.x : C.BAY_X[4]) + C.BUS_W + 0.05, tz = first ? first.b.z : 2.4;
  const h0 = Math.atan2(T.nx, T.nz), hN = -Math.PI;
  v.root.visible = true; v.slope.rotation.x = 0;
  if (u < 0.42){ const k = u/0.42, e = easeOut(k); v.root.position.set(lerp(T.x, C.X_SIDE + 0.25, e), 0, lerp(T.z, tz + 0.15, e)); v.root.rotation.y = lerp(h0, hN, e); v.body.rotation.z = 0.12*Math.sin(k*Math.PI); }
  else if (u < 0.66){ const k = (u - 0.42)/0.24; v.root.position.set(lerp(C.X_SIDE + 0.25, tx, k*k), 0, lerp(tz + 0.15, tz, k)); v.root.rotation.y = hN + 0.06*Math.sin(k*Math.PI); v.body.rotation.z = -0.2*k; }
  else { const k = Math.min(1, (u - 0.66)/0.35); v.root.position.set(tx + 0.22*Math.sin(k*Math.PI)*(1 - k), 0, tz); v.root.rotation.y = hN; v.body.rotation.z = -0.2*(1 - k); }
  if (u >= 0.66 && !c.hit){ c.hit = true; sfx.thud(); puff(new THREE.Vector3(tx - 0.5, 0.4, tz)); ejectMen(v, 0.4); }
  c.chain.forEach((w, i) => {
    const t0 = 0.66 + i*0.24, k = clamp((u - t0)/0.34, 0, 1);
    if (k > 0 && !w.tipped){ w.tipped = true; ejectMen(w, 1); if (i) sfx.thud(); }
    // roll over the west (local +x) bottom edge onto the neighbour; the last one falls flat

  c.knocked.forEach(w => { const k = clamp((u - 0.62)/0.3, 0, 1);

  shake = u > 0.66 && u < 1.2 ? 0.06*(1 - (u - 0.66)/0.54) : 0;
}
let shake = 0;
function ejectMen(v, power){
  game.men.forEach((m, i) => { if (m.bus === v.b.id && (m.state === 'seated' || m.state === 'run') && !MV[i].fly){
    const p = manWorld(i);
    MV[i].fly = {p, v:new THREE.Vector3((rng() - 0.7)*2.6*power, 2 + rng()*2.2*power, (rng() - 0.5)*2.4*power),
                 r:new THREE.Vector3(), w:new THREE.Vector3((rng()-0.5)*14, (rng()-0.5)*8, (rng()-0.5)*14), rest:false};
  } });
}

function removeChute(v){ if (!v.chute) return; scene.remove(v.chute, v.chute.userData.lines);
  v.chute.userData.can.geometry.dispose(); v.chute.userData.lines.geometry.dispose(); v.chute = null; }
/* ------------------------------ positions ------------------------------ */
const tmpO = {};
function slotPos(m, rowF){
  const r = C.RAMPS[m.ramp], cs = r.slots[m.col], i0 = clamp(Math.floor(rowF), 0, cs.length - 1), i1 = Math.min(cs.length - 1, i0 + 1), f = clamp(rowF - i0, 0, 1);
  return {x:lerp(cs[i0].x, cs[i1].x, f), y:r.y, z:lerp(cs[i0].z, cs[i1].z, f), fx:cs[i0].fx, fz:cs[i0].fz};
}
const seatMat = new THREE.Matrix4();
function seatMatrix(i, out){
  const m = game.men[i], v = views[m.bus], s = C.seatLocal(m.seat, v.b.len);
  out.makeTranslation(s.x, 0.5, s.z).premultiply(v.body.matrixWorld); return out;
}
function manWorld(i){
  const m = game.men[i], mv = MV[i];
  if (mv.fly) return mv.fly.p.clone();
  if (m.state === 'ramp'){ const p = slotPos(m, mv.disp); return new THREE.Vector3(p.x, p.y, p.z); }
  if (m.bus >= 0){ seatMatrix(i, seatMat); return new THREE.Vector3().setFromMatrixPosition(seatMat); }
  return new THREE.Vector3();
}

/* ------------------------------ per frame ------------------------------ */
function updateBus(v, t, vdt){
  const b = v.b;
  if (crash && (crash.v === v || crash.chain.includes(v) || crash.knocked.includes(v))) return;
  if (b.state === 'tunnel'){ v.root.visible = false; return; }
  if (b.state === 'jump'){ updateJump(v, t); return; }
  if (b.state === 'crash') return;
  let vis = true;
  if (b.state === 'road' && b.rs > C.ROAD.portalS + b.len*0.5 + 0.35) vis = false;
  if (b.state === 'return' && b.trip && b.trip.s < C.TUNNEL.depth - b.len/2 - 0.05) vis = false;
  v.root.visible = vis;
  v.root.position.set(b.x, b.y, b.z);
  const h = Math.atan2(b.dx, b.dz);
  v.root.rotation.y = h;
  v.slope.rotation.x = -Math.atan(b.slope);
  // lean outward in curves: big buses respond slower and heavier, minibuses are nimble
  let yawRate = 0;
  if (v.hPrev !== null && vdt > 0){ let d = h - v.hPrev; d = Math.atan2(Math.sin(d), Math.cos(d)); yawRate = d/vdt; }
  v.hPrev = h;
  const big = (b.cap - 4)/8, tau = lerp(0.07, 0.34, big), gain = lerp(0.045, 0.075, big);
  const rollT = clamp(b.v*yawRate*gain, -0.16, 0.16);
  v.roll += (rollT - v.roll)*(1 - Math.exp(-vdt/tau));
  // braking: nose dips, brake lights glow
  const decel = vdt > 0 ? (v.vPrev - b.v)/vdt : 0; v.vPrev = b.v;
  const braking = (b.state === 'road' || b.state === 'toRoad') && (decel > 0.6 || (b.v < 0.05 && !b.board && b.state === 'road'));
  v.brakeAmt += ((braking ? 1 : 0) - v.brakeAmt)*(1 - Math.exp(-vdt/0.06));
  const pitchT = clamp(decel*0.012, 0, 0.09)*(decel > 4 ? 1.4 : 1);
  v.pitch += (pitchT - v.pitch)*(1 - Math.exp(-vdt/(decel > 1 ? 0.05 : 0.18)));
  if (decel > 6 && t - v.squeakT > 1.2 && b.state === 'road'){ v.squeakT = t; if (t - lastSqueak > 0.25){ lastSqueak = t; sfx.squeak(); } }
  // boarding dips (spring)
  v.dipV += (-v.dip*90 - v.dipV*9)*vdt; v.dip += v.dipV*vdt;
  let px = 0, py = v.dip*0.08, pz = 0, extraPitch = 0;
  if (t - v.shakeT < 0.45){ const k = (t - v.shakeT)/0.45; px = Math.sin(k*Math.PI*7)*0.09*(1 - k); }
  if (t - v.lurchT < 0.7){ const k = t - v.lurchT; pz = 0.26*Math.exp(-7*k)*Math.sin(k*15); extraPitch = 0.07*Math.exp(-7*k)*Math.sin(k*15); }
  if (b.state === 'bay' || b.state === 'lane') py += Math.sin(t*38 + b.id*1.7)*0.0035;     // idling
  if (b.cap === 4 && b.v > 0.5) py += Math.abs(Math.sin(t*14 + b.id))*0.012;                 // nimble minibus bounce
  v.body.position.set(px, py, pz);
  v.body.rotation.set(v.pitch + extraPitch, 0, v.roll);
  // lights
  v.brakeMat.emissiveIntensity = 0.1 + v.brakeAmt*2.6;
  v.bGlow.forEach(s => { s.material.opacity = v.brakeAmt*0.95; });
  const fl = t - v.flashT, flashing = fl > 0 && fl < 0.62 && (fl % 0.31) < 0.16;
  v.headMat.emissiveIntensity = flashing ? 3.2 : 0.25;
  v.hGlow.forEach(s => { s.material.opacity = flashing ? 1 : 0; });
  if (v.q) v.q.position.y = 1.25 + Math.sin(t*3 + b.id)*0.05;
}
let lastSqueak = -9;
function updateJump(v, t){
  const J = v.jump, u = t - J.t0, b = v.b;
  if (u > C.PARACHUTE_DURATION + 0.8){ v.root.visible = false; removeChute(v); return; }
  v.root.visible = true; v.slope.rotation.x = 0; v.body.position.set(0, 0, 0);
  let x = J.x, y = J.y, z = J.z;
  if (u < 0.22){ y += 0.32*Math.sin(Math.PI*u/0.22); }                                   // short hop
  else if (u < 0.78){ const k = (u - 0.22)/0.56; x += J.side*1.9*k; y += 1.1*Math.sin(Math.PI*k*0.62) - 0.2*k; z += 0.35*k; }
  else { const k = u - 0.78; x += J.side*(1.9 + 3.6*k + 0.9*k*k); y += 1.1*Math.sin(Math.PI*0.62) - 0.2 - 0.32*k; z += 0.35 + 0.7*k; }
  v.root.position.set(x, y, z);
  v.root.rotation.y = J.h + J.side*Math.min(1, u*1.4)*0.35;
  v.body.rotation.set(0, 0, -J.side*0.25*Math.sin(Math.min(1, u*2)*Math.PI) + Math.sin(u*3.2)*0.12*(u > 0.8 ? 1 : 0));
  // canopy sits up-screen of the bus (above and slightly behind) so the waving riders stay visible
  const open = clamp((u - 0.5)/0.3, 0, 1), s = open < 1 ? easeOut(open)*1.12 : 1 + 0.12*Math.exp(-(u - 0.8)*6)*Math.cos((u - 0.8)*14);
  if (v.chute){
    const ch = v.chute, cs = Math.max(0.01, s);
    ch.position.set(x + J.side*0.15, y + 0.75 + 0.95*cs, z - 1.05*cs); ch.scale.setScalar(cs);
    ch.rotation.set(-0.35, 0, Math.sin(u*3.2)*0.1 - J.side*0.12); ch.visible = u > 0.5;
    v.root.updateMatrixWorld(true); ch.updateMatrixWorld(true);
    const L = ch.userData.lines, pa = L.geometry.attributes.position, W2 = 0.4, Lz = b.len*0.38;
    const corners = [[W2, Lz], [-W2, Lz], [W2, -Lz], [-W2, -Lz]];
    for (let k=0;k<8;k++){
      const a = (k + 0.5)/8*Math.PI*2; _v.set(Math.cos(a)*0.84, 0.02, Math.sin(a)*0.84).applyMatrix4(ch.matrixWorld);
      pa.setXYZ(k*2, _v.x, _v.y, _v.z);
      const cn = corners[k % 4]; _v.set(cn[0], 0.72, cn[1]).applyMatrix4(v.body.matrixWorld); pa.setXYZ(k*2 + 1, _v.x, _v.y, _v.z);
    }

}
function hopColor(k){         // a matching bus on its way to this boarding point
  for (const b of game.road){ if (b.nextRamp !== k || b.board) continue; const d = C.RAMPS[k].s - b.rs; if (d > 0 && d < 5) return b.color; }
  const bb = game.road.find(b => b.board && b.board.k === k); return bb ? bb.color : null;
}
function updateMen(t, vdt){
  const hop = C.RAMPS.map((_, k) => hopColor(k));
  scene.updateMatrixWorld();
  for (let i=0;i<game.men.length;i++){
    const m = game.men[i], mv = MV[i];
    if (mv.fly){
      const f = mv.fly;
      if (!f.rest){ f.v.y -= 9*vdt; f.p.addScaledVector(f.v, vdt); f.r.addScaledVector(f.w, vdt);
        if (f.p.y < 0.02 && f.v.y < 0){ f.p.y = 0.02; f.v.multiplyScalar(0.35); f.v.y = Math.abs(f.v.y)*0.6; f.w.multiplyScalar(0.4); if (f.v.length() < 0.3){ f.rest = true; f.r.x = Math.PI/2*(rng() < 0.5 ? 1 : -1); } } }
      setMan(i, f.p.x, f.p.y, f.p.z, f.r.y, f.r.x, f.r.z, -0.5, 0.6, 1.2, 1.2); continue;
    }
    if (m.state === 'ramp'){
      if (mv.t0 >= 0){ const k = clamp((t - mv.t0)/C.COLUMN_SHIFT_TIME, 0, 1); mv.disp = lerp(mv.from, mv.to, easeOut(k)); if (k >= 1) mv.t0 = -1; }
      const p = slotPos(m, mv.disp), r = C.RAMPS[m.ramp];
      const stepHop = mv.t0 >= 0 ? Math.sin(Math.PI*clamp((t - mv.t0)/C.COLUMN_SHIFT_TIME, 0, 1))*0.07 : 0;
      let yaw = Math.atan2(p.fx, p.fz), y = p.y + stepHop, swing = 0;
      if (mv.disp < 0.5){ yaw = Math.atan2(r.x - p.x, r.z - p.z); if (hop[m.ramp] === m.color){ y += Math.abs(Math.sin(t*10 + mv.ph))*0.15; swing = 0.9; } }
      mv.lookT -= vdt; if (mv.lookT < 0){ mv.lookT = 2 + hash(i, t)*5; mv.lookTo = hash(t, i) < 0.35 ? (hash(i*3, t) - 0.5)*1.4 : 0; }
      mv.look += (mv.lookTo - mv.look)*Math.min(1, vdt*4);
      const sway = Math.sin(t*1.7 + mv.ph)*0.05;
      setMan(i, p.x, y, p.z, yaw + mv.look, 0, sway, -swing, -swing, 0.15 + swing*1.6, 0.15 + swing*1.6);
      continue;
    }
    const v = views[m.bus], b = v.b;
    if (b.state === 'gone' || (b.state === 'jump' && t - b.tJump > C.PARACHUTE_DURATION + 0.8) || !v.root.visible){ hideMan(i); continue; }
    if (m.state === 'run'){
      const u = clamp((t - mv.runT)/C.RUN_TIME, 0, 1); seatMatrix(i, seatMat); const T = new THREE.Vector3().setFromMatrixPosition(seatMat);
      const F = mv.runFrom, dx = F.x - T.x, dz = F.z - T.z, dl = Math.hypot(dx, dz) || 1;
      const E = new THREE.Vector3(T.x + dx/dl*0.62, F.y, T.z + dz/dl*0.62);
      let x, y, z, yaw;
      if (u < 0.62){ const k = u/0.62; x = lerp(F.x, E.x, k); z = lerp(F.z, E.z, k); y = F.y + Math.abs(Math.sin(k*Math.PI*3))*0.06; yaw = Math.atan2(-dx, -dz);
        const sw = Math.sin(k*Math.PI*6)*1.0; setMan(i, x, y, z, yaw, 0.18, 0, sw, -sw, 0.15, 0.15); }
      else { const k = (u - 0.62)/0.38; x = lerp(E.x, T.x, k); z = lerp(E.z, T.z, k); y = lerp(E.y, T.y, k) + Math.sin(Math.PI*k)*0.45; yaw = Math.atan2(-dx, -dz);
        setMan(i, x, y, z, yaw, -0.1, 0, -2.4, -2.4, 0.5, 0.5); }

    }

    seatMatrix(i, seatMat);
    const land = t - mv.landT, bounce = land < 0.3 ? Math.sin(land/0.3*Math.PI)*0.18 : 0;
    _e.set(v.pitch*1.8, 0, v.roll*1.6, 'XYZ'); _q.setFromEuler(_e); _v.set(0, bounce*0.25, 0); _s.set(MAN_S, MAN_S*(1 - bounce*0.5), MAN_S);
    _a.compose(_v, _q, _s); seatMat.multiply(_a);
    if (b.state === 'jump'){ const w = Math.sin(t*14 + mv.ph)*0.35; setManMatrix(i, seatMat, 0, 0, 2.5 + w, 2.5 - w); }

}
function updateScene(vdt){
  const t = game.t;
  for (const v of views) updateBus(v, t, vdt);
  if (crash) updateCrash(t);
  for (const v of views) if (v.chute && v.b.state !== 'jump') removeChute(v);
  updateMen(t, vdt);
  for (let i = fx.length - 1; i >= 0; i--) if (!fx[i](t)) fx.splice(i, 1);
  badges.forEach(b => { if (b.visible){ const u = t - b.userData.t0, s = u < 0.4 ? easeOut(u/0.4)*1.15 : 1 + 0.15*Math.exp(-(u - 0.4)*5);
    b.scale.set(0.95*s, 1.19*s, 1); b.position.y = rampTops[badges.indexOf(b)].y + 1.15 + Math.sin(t*2.4)*0.06; } });
  // static row / counter status
  const free = []; for (let k=0;k<C.STATIC_SLOTS;k++) if (game.bays[k] < 0 && game.bayRes[k] < 0) free.push(k);
  bayGlow.forEach((g, k) => { g.material.opacity = free.length === 1 && free[0] === k && !game.result ? 0.1 + 0.12*(0.5 + 0.5*Math.sin(t*5)) : 0; });
  $('cnt').textContent = `${game.counter}/${C.ROAD_CAPACITY}`;
  $('counter').classList.toggle('full', game.counter >= C.ROAD_CAPACITY);
  if (t >= winAt && !$('winPanel').classList.contains('show')) $('winPanel').classList.add('show');
  if (t >= failAt && !$('failPanel').classList.contains('show')) $('failPanel').classList.add('show');
  if (DEBUG) updateDebug();
}

/* -------------------------------- debug -------------------------------- */
function updateDebug(){
  let n = 0;
  game.ramps.forEach((r, k) => r.cols.forEach((col, c) => { if (!col.length) return; const s = C.RAMPS[k].slots[c][0];
    ringIM.setMatrixAt(n++, M(s.x, s.y + 0.02, s.z)); }));
  ringIM.count = n; ringIM.instanceMatrix.needsUpdate = true;
  const onRoad = game.road.length, heading = game.toRoad, back = game.buses.filter(b => b.state === 'tunnel' || b.state === 'return').length;
  const sum = onRoad + heading + back, fc = C.frontColors(game);
  const nextDest = sum < C.ROAD_CAPACITY ? 'MAIN ROAD' : C.freeBay(game) >= 0 ? 'BAY ' + (C.freeBay(game) + 1) : 'REFUSED (shake)';
  $('dbg').textContent =
    `road ${onRoad} + heading ${heading} + tunnel/return ${back}\n= ${sum} / ${C.ROAD_CAPACITY}   next lane tap -> ${nextDest}\n` +
    `counter ${game.counter}/${C.ROAD_CAPACITY}   free bays ${[0,1,2,3,4].filter(k => game.bays[k] < 0 && game.bayRes[k] < 0).map(k => k + 1).join(',') || '-'}\n` +
    `front rows: ` + C.COLORS.filter(c => fc[c]).map(c => c + ' ' + fc[c]).join(', ') + `\n` +
    `boarded ${game.landed}/192   t ${game.t.toFixed(1)}s` + (botOn ? '   BOT' : '');
}

/* -------------------------------- input -------------------------------- */
function screenOf(x, y, z){ camera.updateMatrixWorld(); _v.set(x, y, z).project(camera); return [(_v.x + 1)/2*DW, (1 - _v.y)/2*DH]; }
function busScreenBox(b){
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const sx of [-0.5, 0.5]) for (const sz of [-0.5, 0.5]) for (const yy of [0, 0.8]){
    const px = b.x + sx*C.BUS_W*(-b.dz) + sz*b.len*b.dx, pz = b.z + sx*C.BUS_W*b.dx + sz*b.len*b.dz;
    const [u, w] = screenOf(px, yy, pz); x0 = Math.min(x0, u); x1 = Math.max(x1, u); y0 = Math.min(y0, w); y1 = Math.max(y1, w); }
  return [x0, y0, x1, y1];
}
function pick(px, py){
  let best = null, bd = 1e9;
  const test = (b, act) => { const [x0, y0, x1, y1] = busScreenBox(b), pad = 12;
    if (px < x0 - pad || px > x1 + pad || py < y0 - pad || py > y1 + pad) return;
    const d = Math.hypot(px - (x0 + x1)/2, py - (y0 + y1)/2); if (d < bd){ bd = d; best = act; } };
  game.lanes.forEach((lane, l) => lane.forEach(id => test(game.buses[id], {kind:'lane', idx:l})));
  game.bays.forEach((id, k) => { if (id >= 0) test(game.buses[id], {kind:'bay', idx:k}); });
  return best;
}
function doAction(a){ return C.applyAction(game, a); }
app.addEventListener('pointerdown', e => {
  audio();
  if (e.target.closest('.rbtn') || e.target.closest('.panel')) return;
  const r = app.getBoundingClientRect(), px = (e.clientX - r.left)/r.width*DW, py = (e.clientY - r.top)/r.height*DH;
  const a = pick(px, py); if (a) doAction(a);
});
$('btnRestart').addEventListener('click', () => { audio(); resetGame(); });
$('btnReplay').addEventListener('click', () => { audio(); resetGame(); });
$('btnRetry').addEventListener('click', () => { audio(); resetGame(); });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'd'){ DEBUG = !DEBUG; dbgGroup.visible = DEBUG; $('dbg').style.display = DEBUG ? 'block' : 'none'; }
  if (k === 'b'){ botOn = !botOn; botT = 0; $('botTag').style.display = botOn ? 'block' : 'none'; }
  if (k === 'r') resetGame();
});
function placeCounter(){
  const [, y] = screenOf(C.X_SIDE + 1.5, 0.9, 1.7);                 // grass strip right of the side lane
  Object.assign($('counter').style, {left: (DW - 60) + 'px', top: y + 'px'});
}

/* --------------------------------- loop --------------------------------- */
const FIXED = 1/60;
function tick(){
  if (botOn && !game.result){ botT -= FIXED; if (botT <= 0){ botT += C.BOT_THINK; const a = C.greedyPick(game); if (a) doAction(a); } }
  C.step(game, FIXED); handleEvents();
}
let last = performance.now(), acc = 0, frozen = false;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  if (!frozen){ acc += dt; let n = 0; while (acc >= FIXED && n < 6){ tick(); acc -= FIXED; n++; } if (n === 6) acc = 0; }
  updateScene(frozen ? 0 : dt);
  camera.position.set(CAM.pos[0] + (shake ? (rng() - 0.5)*shake : 0), CAM.pos[1] + (shake ? (rng() - 0.5)*shake : 0), CAM.pos[2]);
  renderer.render(scene, TOPVIEW ? topCam : camera);
}
resetGame(); fit();
requestAnimationFrame(frame);

/* test hooks */
window.__me = {
  C, get game(){ return game; }, camera, scene, renderer,
  advance(sec){ const n = Math.round(sec/FIXED); for (let i=0;i<n;i++){ tick(); if (i % 4 === 0) updateScene(FIXED*4); } updateScene(FIXED); },
  tapLane(l){ return C.tapLane(game, l); }, tapBay(k){ return C.tapBay(game, k); }, pick, screenOf, busScreenBox,
  setBot(v){ botOn = v; }, setDebug(v){ DEBUG = v; dbgGroup.visible = v; $('dbg').style.display = v ? 'block' : 'none'; },
  freeze(v){ frozen = v; }, restart: resetGame, get views(){ return views; }, get crash(){ return crash; },
  render(){ updateScene(0); renderer.render(scene, camera); }, CAM
};
