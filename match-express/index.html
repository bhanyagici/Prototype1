<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Match Express</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b3a22;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:"Arial Rounded MT Bold","Nunito","Baloo 2","Trebuchet MS",system-ui,sans-serif}
  #app{position:absolute;left:0;top:0;width:900px;height:1950px;transform-origin:0 0;overflow:hidden;background:#9fb878}
  #gl{position:absolute;left:0;top:0;width:900px;height:1950px;display:block}
  .ui{position:absolute;z-index:5}
  /* springy press + eased appearance for every control */
  .spring{transition:transform .38s cubic-bezier(.34,1.9,.5,1),filter .2s}
  .spring:active,.spring.pressed{transform:scale(.86);transition:transform .08s ease-out}
  /* ---- top bar ---- */
  #levelPill{left:34px;top:40px;height:74px;padding:0 40px;border-radius:40px;display:flex;align-items:center;max-width:430px;
    color:#fff;font-size:44px;font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:linear-gradient(#56b6ff,#1f7ae6 70%,#1667cc);border:6px solid #ffc531;
    box-shadow:0 6px 0 #c98a12,0 10px 18px rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35);
    text-shadow:0 3px 0 #0d4ea3,0 0 2px #0d4ea3;animation:drop .5s cubic-bezier(.34,1.6,.5,1) both}
  .rbtn{width:86px;height:86px;border-radius:50%;top:34px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%,#6cc2ff,#1f7ae6 62%,#1563c6);border:6px solid #ffc531;color:#fff;
    box-shadow:0 6px 0 #c98a12,0 10px 18px rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35);cursor:pointer;
    animation:drop .5s cubic-bezier(.34,1.6,.5,1) both}
  .rbtn svg{width:50px;height:50px;filter:drop-shadow(0 3px 0 rgba(10,60,140,.8))}
  #btnRestart{right:232px;animation-delay:.05s} #btnSpeed{right:132px;animation-delay:.1s} #btnSettings{right:32px;animation-delay:.15s}
  #btnSpeed{font-size:38px;font-weight:900;text-shadow:0 3px 0 #0d4ea3}
  #btnSpeed.on{background:radial-gradient(circle at 50% 35%,#ffe27a,#ffb21f 62%,#f08c00);text-shadow:0 3px 0 #a35a00;border-color:#fff4c2}
  @keyframes drop{from{transform:translateY(-140px)}to{transform:none}}
  /* ---- settings popover ---- */
  #settings{right:28px;top:140px;width:330px;padding:22px;border-radius:28px;background:#24345e;border:5px solid #ffc531;
    box-shadow:0 8px 0 #c98a12,0 16px 30px rgba(0,0,0,.35);color:#fff;transform-origin:85% -10%;
    transform:scale(.3);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.34,1.7,.5,1),opacity .2s}
  #settings.open{transform:none;opacity:1;pointer-events:auto}
  #settings button{display:block;width:100%;margin:8px 0;padding:16px;border-radius:20px;border:4px solid #fff;font:inherit;font-size:30px;
    font-weight:900;color:#fff;background:linear-gradient(#5ec1ff,#1f7ae6);box-shadow:0 5px 0 #0f4c9e;cursor:pointer}
  #settings button.off{background:linear-gradient(#9aa3b3,#69728a);box-shadow:0 5px 0 #454c5e}
  #settings small{display:block;margin-top:10px;font-size:20px;opacity:.75;text-align:center}

  #counter{width:104px;height:116px;border-radius:24px;background:linear-gradient(#34477a,#25335c);
    border:6px solid #ffc531;box-shadow:0 7px 0 #c98a12,0 12px 18px rgba(0,0,0,.3),inset 0 0 0 3px #1b2647;

  .panel{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(16,24,38,.45)}

  .card p{margin:0 0 40px;font-size:36px;opacity:.95}
  .card button{font:inherit;font-size:50px;font-weight:900;color:#fff;padding:20px 80px;border-radius:40px;

    font-size:28px;font-weight:900;box-shadow:0 4px 0 #b02750}

    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3; comp.connect(master);
    busSfx = AC.createGain(); busSfx.gain.value = 1; busSfx.connect(comp);

    busAmb = AC.createGain(); busAmb.gain.value = 0.32; busAmb.connect(master);

function noise(dur, vol, freq, q=1, delay=0, out=busSfx, type='bandpass', sweepTo=0){
  if (!live()) return;
  if (!noiseBuf){ noiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1; }
  const t = AC.currentTime + delay, src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, t); if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur); f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.04, dur*0.3)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(out); src.start(t, Math.random()*1.5); src.stop(t + dur + 0.05);
}
const sfx = {
  pop(chain){ const f = vary(500*Math.pow(1.06, Math.min(chain, 14)), 0.03);       // rises along a chain, resets with the next bus
    tone('sine', f, f*0.6, 0.1, 0.2); tone('triangle', f*2.01, f*1.2, 0.05, 0.05); noise(0.03, 0.05, 3000, 2); },
  horn(){ const f = vary(370, 0.03);
    [[0, 0.3], [0.36, 0.2]].forEach(([d, l]) => { tone('sawtooth', f, 0, l, 0.06, d, 1100); tone('sawtooth', f*1.26, 0, l, 0.05, d, 1100); tone('sine', f*0.5, 0, l, 0.06, d); }); },
  squeak(){ const f = vary(2100, 0.06); tone('sine', f, f*0.8, 0.16, 0.022); tone('sine', f*1.07, f*0.86, 0.13, 0.012, 0.01); },
  motor(){ const f = vary(58, 0.06); tone('sawtooth', f, f*1.9, 0.42, 0.07, 0, 480); tone('triangle', f*1.5, f*2.4, 0.32, 0.04, 0.03, 700); },
  thud(){ const f = vary(120, 0.08); tone('sine', f, f*0.5, 0.22, 0.24); noise(0.12, 0.14, 260, 0.9, 0, busSfx, 'lowpass'); },
  crash(){ tone('sine', vary(90), 38, 0.45, 0.32); noise(0.4, 0.5, 900, 0.6, 0, busSfx, 'lowpass', 160); noise(0.25, 0.2, 2500, 1, 0.05); },
  whoosh(){ noise(0.75, 0.14, vary(380), 1.1, 0, busSfx, 'bandpass', 1700); },
  echo(){ if (!live()) return; const d = AC.createDelay(1), fb = AC.createGain(), lp = AC.createBiquadFilter();
    d.delayTime.value = vary(0.17); fb.gain.value = 0.42; lp.type = 'lowpass'; lp.frequency.value = 900;
    d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(busSfx);
    noise(0.45, 0.32, vary(260), 0.7, 0, d, 'lowpass'); tone('sine', vary(105), 70, 0.4, 0.09, 0, 0, d); },
  sparkle(){ [1320, 1760, 2093].forEach((f, i) => tone('sine', vary(f, 0.02), 0, 0.14, 0.035, i*0.05)); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => { tone('triangle', f, 0, 0.3, 0.14, i*0.11); tone('sine', f*2, 0, 0.2, 0.03, i*0.11); }); }
};
/* engine hum: one soft voice per moving bus, pitch and level follow its speed */
const hum = new Map();
function stopHum(){ hum.forEach(h => { try { h.o.stop(); } catch (e) {} }); hum.clear(); }
function updateHum(){
  if (!live()){ if (hum.size) stopHum(); return; }
  const now = AC.currentTime;
  for (const v of views){
    const moving = v.root.visible && v.spd > 0.15 && v.b.state !== 'jump' && v.b.state !== 'tunnel';
    let h = hum.get(v);
    if (moving && !h && hum.size < 9){
      const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
      o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 260; g.gain.value = 0;
      o.connect(f); f.connect(g); g.connect(busHum); o.start(); h = {o, g, f, idle:0, det:vary(1, 0.08)}; hum.set(v, h);
    }
    if (!h) continue;
    const s = clamp(v.spd/C.BUS_SPEED, 0, 1.3);
    h.o.frequency.setTargetAtTime((42 + s*34)*h.det, now, 0.08);
    h.f.frequency.setTargetAtTime(200 + s*260, now, 0.1);
    h.g.gain.setTargetAtTime(moving ? 0.012 + 0.018*s : 0, now, 0.15);
    h.idle = moving ? 0 : h.idle + 1;
    if (h.idle > 90){ try { h.o.stop(now + 0.3); } catch (e) {} hum.delete(v); }
  }
}
/* ambient forest: soft wind (filtered noise with a slow swell) and the odd bird */
let ambientOn = false;
function startAmbient(){
  if (ambientOn || !AC) return; ambientOn = true;
  const len = AC.sampleRate*4, buf = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch=0; ch<2; ch++){ const d = buf.getChannelData(ch); let b = 0; for (let i=0;i<len;i++){ b = 0.985*b + 0.015*(Math.random()*2 - 1); d[i] = b*3.2; } }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
  const g = AC.createGain(); g.gain.value = 0.25;
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 0.12; lfo.connect(lg); lg.connect(g.gain);
  src.connect(lp); lp.connect(g); g.connect(busAmb); src.start(); lfo.start();
  const bird = () => {
    if (live()){ const n = 2 + Math.floor(Math.random()*3), base = 2600 + Math.random()*1500, pan = AC.createStereoPanner();
      pan.pan.value = Math.random()*1.6 - 0.8; pan.connect(busAmb);
      for (let i=0;i<n;i++) tone('sine', base*(1 + Math.random()*0.15), base*(0.75 + Math.random()*0.2), 0.08 + Math.random()*0.05, 0.03, i*0.13, 0, pan, 0.01); }
    setTimeout(bird, 1800 + Math.random()*4500);
  };
  setTimeout(bird, 1500);
}
function setMuted(m){
  muted = m; S.savePrefs({muted:m});
  if (master) master.gain.setTargetAtTime(m ? 0 : VOL, AC.currentTime, 0.05);
  if (m) stopHum();
  $('btnMute').textContent = 'Sound: ' + (m ? 'Off' : 'On'); $('btnMute').classList.toggle('off', m);
}

/* ============================== GAME BINDING ============================= */
let LEVEL = null, levelSource = 'builtin', L = null;
let game = null, views = [], MV = [], winAt = Infinity, failAt = Infinity, crash = null, DEBUG = false, botOn = false, botT = 0;
let timeScale = 1, shake = 0, lastSqueak = -9, winSoundAt = Infinity, levelSerial = 0;
function resetGame(){
  views.forEach(v => { removeChute(v); v.dispose(); });
  stopHum();
  game = C.createGame(LEVEL);
  views = game.buses.map(b => new BusView(b));
  ensureMen(game.men.length); ensureWheels(views.reduce((a, v) => a + v.wheels.length, 0));
  menIM.count = menShadow.count = game.men.length; armIM.count = game.men.length*2;
  MV = game.men.map((m, i) => { const d = game.ramps[m.ramp].cols[m.col].indexOf(i);
    return {disp:d, from:d, to:d, t0:-1, ph:hash(i, 7)*6.28, swayA:0.03 + hash(i, 11)*0.045, swayF:1.2 + hash(i, 13)*1.1,
            bobF:1.6 + hash(i, 17)*1.4, lookT:hash(i, 3)*6, look:0, lookTo:0, runFrom:null, runT:-9, landT:-9, fly:null}; });
  game.men.forEach((m, i) => paintMan(i));
  winAt = failAt = Infinity; winSoundAt = Infinity; crash = null; botT = 0; shake = 0;
  WD.badges.forEach(b => { b.visible = false; b.scale.set(0, 0, 1); });
  fx.forEach(f => f(Infinity)); fx.length = 0;
  $('winPanel').classList.remove('show'); $('failPanel').classList.remove('show');
  updateScene(0);
}
/* level priority: a level sent by the editor > the last saved level (localStorage) > built-in LEVEL_DATA */
function initialLevel(){
  if (!params.has('builtin')){ const saved = S.loadCurrent();
    if (saved){ try { C.buildLayout(saved); return [saved, 'saved']; } catch (e) { console.warn('[level] saved level ignored:', e.message); } } }
  return [C.LEVEL_DATA, 'builtin'];
}
function loadLevel(level, source, opts){
  opts = opts || {};
  try { C.buildLayout(level); } catch (e) { console.warn('[level] rejected:', e.message); return false; }
  LEVEL = C.normalizeLevel(level); L = C.buildLayout(LEVEL); levelSource = source; levelSerial++;
  buildWorld(L); resetGame(); placeCounter();
  setBot(!!opts.bot);
  $('levelPill').textContent = LEVEL.name || 'Level';
  $('levelSrc').textContent = {editor:'Level from the editor', saved:'Last saved editor level', builtin:'Built-in level'}[source] || source;
  logLevel(LEVEL, source);
  if (parent !== window) parent.postMessage({type:'game-status', source, name:LEVEL.name, men:game.men.length, buses:game.buses.length, serial:levelSerial}, '*');
  return true;
}
function logLevel(N, source){
  const ck = C.checkLevel(N);
  console.log(`[level] "${N.name}" (${source}${N.seed != null ? ', seed ' + N.seed : ''}) — ${ck.totalMen} stickmen, ${ck.buses} buses`);
  console.log('[level] seats vs stickmen per colour: ' + ck.perColor.map(p => `${p.color} ${p.seats}/${p.men}`).join('  ') +
              `  ->  ${ck.balanced ? 'ALL MATCH' : 'MISMATCH'}`);
  if (ck.warnings.length) console.warn('[level] warnings: ' + ck.warnings.map(w => w.msg).join('; '));
  if (params.has('nosim')) return;
  const serial = levelSerial;
  S.testInBackground(N, 200).then(r => {
    if (serial !== levelSerial) return;
    console.log(`[sim] greedy bot: ${r.greedy.result.toUpperCase()} — ${r.greedy.sends} sends, ${r.greedy.landed}/${ck.totalMen} boarded, ${r.greedy.t.toFixed(1)} s of game time`);
    console.log('[sim] greedy moves: ' + r.greedy.moves.join(' '));
    console.log(`[sim] random bot: ${r.wins}/${r.runs} wins (${(r.rate*100).toFixed(1)}%) — difficulty ${r.label}`);
  }).catch(e => console.warn('[sim] failed', e));
}
/* editor messages: postMessage into the preview iframe, BroadcastChannel for other tabs */
let lastMsg = null, helloId = null;
function onMessage(d){
  if (!d || typeof d !== 'object') return;
  if (d.to && d.to !== helloId) return;                // a reply meant for another game tab
  if (d.id){ if (d.id === lastMsg) return; lastMsg = d.id; }
  if ((d.type === 'run' || d.type === 'watch') && d.level) loadLevel(d.level, 'editor', {bot: d.type === 'watch'});
  else if (d.type === 'restart') resetGame();
}
addEventListener('message', e => onMessage(e.data));
const chan = S.channel();
if (chan) chan.onmessage = e => onMessage(e.data);

/* ------------------------------ events ------------------------------ */
function handleEvents(){
  for (const e of game.events){
    const v = e.bus !== undefined ? views[e.bus] : null;
    switch (e.type){
      case 'send': sfx.motor(); break;
      case 'refuse': v.shakeT = e.t; sfx.thud(); break;
      case 'lurch': v.lurchT = e.t; v.bobV += 0.6; sfx.thud(); break;
      case 'reveal': v.reveal(); v.revealT = e.t; sparkle(new THREE.Vector3(v.p.x, 0.2, v.p.z), C.HEX[v.b.color]); sfx.sparkle(); break;
      case 'revealMan': { paintMan(e.man); const m = game.men[e.man], p = slotPos(m, MV[e.man].disp); sparkle(new THREE.Vector3(p.x, p.y + 0.1, p.z), C.HEX[m.color], 8, 0.28); break; }
      case 'merge': {
        const next = game.trips.find(b => b.trip.kind === 'toRoad' && Math.hypot(b.x, b.z - C.Z_ROAD0) < 4.2);
        if (next) views[next.id].flashT = e.t + 0.15; break; }
      case 'board': { const m = MV[e.man], sp = slotPos(game.men[e.man], m.disp); m.runFrom = new THREE.Vector3(sp.x, sp.y, sp.z); m.runT = e.t;
        const r = game.ramps[e.ramp];
        r.cols[e.col].forEach((id, i) => { const mv = MV[id]; mv.from = mv.disp; mv.to = i; mv.t0 = e.t + 0.05 + i*0.045; });
        break; }
      case 'land': { MV[e.man].landT = e.t; v.bobV -= 0.42; sfx.pop(e.chain); break; }
      case 'jump': v.jump = {t0:e.t, side:e.side, x:v.p.x, y:v.p.y, z:v.p.z, h:v.h};
        v.chute = makeChute(v.b.color); v.chute.visible = false; v.whooshed = false; sfx.horn(); break;
      case 'win': winAt = e.t + 0.55 + C.WIN_PANEL_DELAY; winSoundAt = e.t + 1.0; break;
      case 'tunnelIn': sfx.echo(); WD.lamps.top.pulseT = e.t; break;
      case 'tunnelOut': WD.lamps.ret.pulseT = e.t; break;
      case 'rampEmpty': { const b = WD.badges[e.ramp]; b.visible = true; b.userData.t0 = e.t; b.userData.sparkled = false; break; }
      case 'crash': startCrash(e); break;
    }
  }
  game.events.length = 0;
}

/* --------------------------- crash + dominoes --------------------------- */
function startCrash(e){
  const T = L.TUNNEL, occupants = [];
  const order = T.side > 0 ? [4,3,2,1,0] : [0,1,2,3,4];          // nearest to the tunnel first
  for (const k of order){ const id = game.bays[k] >= 0 ? game.bays[k] : game.bayRes[k]; if (id >= 0) occupants.push(views[id]); }
  const knocked = game.trips.filter(b => b.id !== e.bus && b.x*T.side > C.BAY_X[4] + 0.2 && b.z > -0.8 && b.z < C.Z_COLL + 0.8).map(b => views[b.id]);
  crash = {t0:e.t, v:views[e.bus], chain:occupants, knocked, hit:false, side:T.side};
  failAt = e.t + 3.2;
}
function updateCrash(t){
  const c = crash, v = c.v, u = t - c.t0, sd = c.side;
  const T = L.TUNNEL, first = c.chain[0], tx = (first ? first.b.x : sd*C.BAY_X[4]) + sd*(C.BUS_W + 0.05), tz = first ? first.b.z : 2.4;
  const h0 = Math.atan2(T.nx, T.nz), hN = -Math.PI, xs = sd*(C.X_SIDE + 0.25);
  v.root.visible = true; v.slope.rotation.x = 0; v.mat.color.setScalar(1);
  if (u < 0.42){ const k = u/0.42, e = easeOut(k); v.root.position.set(lerp(T.x, xs, e), 0, lerp(T.z, tz + 0.15, e)); v.root.rotation.y = h0 + angDiff(hN, h0)*e; v.body.rotation.z = sd*0.12*Math.sin(k*Math.PI); }
  else if (u < 0.66){ const k = (u - 0.42)/0.24; v.root.position.set(lerp(xs, tx, k*k), 0, lerp(tz + 0.15, tz, k)); v.root.rotation.y = hN + 0.06*Math.sin(k*Math.PI); v.body.rotation.z = -sd*0.2*k; }
  else { const k = Math.min(1, (u - 0.66)/0.35); v.root.position.set(tx + sd*0.22*Math.sin(k*Math.PI)*(1 - k), 0, tz); v.root.rotation.y = hN; v.body.rotation.z = -sd*0.2*(1 - k); }
  if (u >= 0.66 && !c.hit){ c.hit = true; sfx.crash(); puff(new THREE.Vector3(tx - sd*0.5, 0.4, tz)); ejectMen(v, 0.5, sd); }
  c.chain.forEach((w, i) => {
    const t0 = 1.0 + i*0.24, k = clamp((u - t0)/0.34, 0, 1);                    // dominoes start after the slow-motion beat
    if (k > 0 && !w.tipped){ w.tipped = true; ejectMen(w, 1, sd); sfx.thud(); }
    const ang = (i === c.chain.length - 1 ? 1.52 : 1.16)*k*k, W2 = C.BUS_W/2;   // roll over the far bottom edge onto the neighbour
    w.body.rotation.set(0, 0, -sd*ang); w.body.position.set(sd*(W2 - W2*Math.cos(ang)), W2*Math.sin(ang), 0);
  });
  c.knocked.forEach(w => { const k = clamp((u - 0.62)/0.3, 0, 1);
    w.root.position.set(w.b.x + sd*0.9*easeOut(k), 0, w.b.z + 0.2*k); w.body.rotation.set(0, 0, sd*0.45*k*(1 - 0.4*k)); });
  shake = u > 0.66 && u < 1.25 ? 0.07*(1 - (u - 0.66)/0.59) : 0;
}
function ejectMen(v, power, sd){
  game.men.forEach((m, i) => { if (m.bus === v.b.id && (m.state === 'seated' || m.state === 'run') && !MV[i].fly){
    const p = manWorld(i);
    MV[i].fly = {p, v:new THREE.Vector3(-sd*(0.4 + frand()*2.2)*power, 2 + frand()*2.2*power, (frand() - 0.5)*2.4*power),
                 r:new THREE.Vector3(), w:new THREE.Vector3((frand()-0.5)*14, (frand()-0.5)*8, (frand()-0.5)*14), rest:false};
  } });
}

/* ------------------------------ positions ------------------------------ */
function slotPos(m, rowF){
  const r = L.RAMPS[m.ramp], cs = r.slots[m.col], i0 = clamp(Math.floor(rowF), 0, cs.length - 1), i1 = Math.min(cs.length - 1, i0 + 1), f = clamp(rowF - i0, 0, 1);
  return {x:lerp(cs[i0].x, cs[i1].x, f), y:r.y, z:lerp(cs[i0].z, cs[i1].z, f), fx:cs[i0].fx, fz:cs[i0].fz};
}
const seatMat = new THREE.Matrix4();
function seatMatrix(i, out){
  const m = game.men[i], v = views[m.bus], s = C.seatLocal(m.seat, v.b.len);
  out.makeTranslation(s.x, 0.5, s.z).premultiply(v.body.matrixWorld); return out;
}
function manWorld(i){
  const m = game.men[i], mv = MV[i];
  if (mv.fly) return mv.fly.p.clone();
  if (m.state === 'ramp'){ const p = slotPos(m, mv.disp); return new THREE.Vector3(p.x, p.y, p.z); }
  if (m.bus >= 0){ seatMatrix(i, seatMat); return new THREE.Vector3().setFromMatrixPosition(seatMat); }
  return new THREE.Vector3();
}

/* ------------------------------ buses ------------------------------ */
function busTarget(b){                              // core position + velocity the render springs chase
  if (b.state === 'lane') return [b.x, 0, b.z, 0, -b.v];
  if (b.state === 'bay') return [b.x, 0, b.z, 0, 0];
  return [b.x, b.y, b.z, b.dx*b.v, b.dz*b.v];
}
function updateBus(v, t, vdt){
  const b = v.b;
  if (crash && (crash.v === v || crash.chain.includes(v) || crash.knocked.includes(v))) return;
  if (b.state === 'tunnel'){ v.root.visible = false; v.init = false; return; }
  if (b.state === 'jump'){ updateJump(v, t); return; }
  if (b.state === 'crash') return;
  let vis = true;
  if (b.state === 'road' && b.rs > L.ROAD.portalS + b.len*0.5 + 0.35) vis = false;
  if (b.state === 'return' && b.trip && b.trip.s < C.TUNNEL.depth - b.len/2 - 0.05) vis = false;
  if (!vis){ v.root.visible = false; v.init = false; return; }
  // ease into / out of the tunnel darkness
  let dark = 0;
  if (b.state === 'road') dark = smooth(L.ROAD.portalS - b.len/2 - 0.3, L.ROAD.portalS + b.len*0.5 + 0.3, b.rs);
  if (b.state === 'return' && b.trip) dark = 1 - smooth(C.TUNNEL.depth - b.len/2 - 0.1, C.TUNNEL.depth + b.len/2 + 0.6, b.trip.s);
  v.dark = dark; v.mat.color.setScalar(1 - 0.88*dark);
  const [tx, ty, tz, tvx, tvz] = busTarget(b), hT = Math.atan2(b.dx, b.dz);
  // position: critically damped spring with velocity feed-forward -> eased starts and stops, nothing snaps
  if (!v.init || Math.hypot(tx - v.p.x, tz - v.p.z) > 1.6){
    v.p.set(tx, ty, tz); v.pv.set(tvx, 0, tvz); v.h = hT; v.init = true; v.spd = Math.hypot(tvx, tvz); v.hPrev = hT;
  } else if (vdt > 0){
    const w = 24, steps = Math.max(1, Math.ceil(vdt/(1/120))), h = vdt/steps;
    for (let i=0;i<steps;i++){
      v.pv.x += (w*w*(tx - v.p.x) + 2*w*(tvx - v.pv.x))*h; v.pv.z += (w*w*(tz - v.p.z) + 2*w*(tvz - v.pv.z))*h;
      v.p.x += v.pv.x*h; v.p.z += v.pv.z*h;
    }
    v.p.y += (ty - v.p.y)*(1 - Math.exp(-vdt*18));
    v.h += angDiff(hT, v.h)*(1 - Math.exp(-vdt*16));
  }
  v.root.visible = true;
  v.root.position.copy(v.p); v.root.rotation.y = v.h;
  v.slope.rotation.x += (-Math.atan(b.slope) - v.slope.rotation.x)*(vdt > 0 ? 1 - Math.exp(-vdt*10) : 1);
  if (vdt > 0){
    const fwd = v.pv.x*Math.sin(v.h) + v.pv.z*Math.cos(v.h), spd = Math.max(0, fwd);
    const aInst = (spd - v.spd)/vdt; v.aLong += (aInst - v.aLong)*(1 - Math.exp(-vdt*14));
    const yawRate = angDiff(hT, v.hPrev === undefined ? hT : v.hPrev)/vdt; v.hPrev = hT;
    if (v.spd > 0.4 && spd < 0.05) v.bobV -= 0.28;                      // settle when it comes to rest
    if (v.spd < 0.05 && spd > 0.3) v.bobV += 0.18;                      // squat on pull-away
    v.spd = spd;
    // suspension springs: pitch (brake dive / launch squat), roll (lean out of curves), bob
    const big = (b.cap - 4)/8, steps = Math.max(1, Math.ceil(vdt/(1/120))), h = vdt/steps;
    const pitchT = clamp(-v.aLong*0.022, -0.07, 0.12), rollT = clamp(spd*yawRate*lerp(0.045, 0.075, big), -0.16, 0.16);
    const kr = lerp(170, 55, big), cr = 2*0.32*Math.sqrt(kr);
    for (let i=0;i<steps;i++){
      v.pitchV += (150*(pitchT - v.pitch) - 9*v.pitchV)*h; v.pitch += v.pitchV*h;
      v.rollV += (kr*(rollT - v.roll) - cr*v.rollV)*h; v.roll += v.rollV*h;
      v.bobV += (-110*v.bob - 7*v.bobV)*h; v.bob += v.bobV*h;
    }
    v.wheelAng += spd*vdt/0.17;
  }
  const braking = (b.state === 'road' || b.state === 'toRoad') && (v.aLong < -0.8 || (v.spd < 0.05 && !b.board && b.state === 'road'));
  v.brakeAmt += ((braking ? 1 : 0) - v.brakeAmt)*(vdt > 0 ? 1 - Math.exp(-vdt/0.06) : 0);
  if (v.aLong < -5.5 && t - v.squeakT > 1.2 && b.state === 'road'){ v.squeakT = t; if (t - lastSqueak > 0.3){ lastSqueak = t; sfx.squeak(); } }
  let px = 0, py = v.bob*0.08, pz = 0, extraPitch = 0;
  if (t - v.shakeT < 0.5){ const k = (t - v.shakeT)/0.5; px = Math.sin(k*Math.PI*7)*0.09*(1 - k)*(1 - k); }
  if (t - v.lurchT < 0.8){ const k = t - v.lurchT; pz = 0.26*Math.exp(-6*k)*Math.sin(k*14); extraPitch = 0.08*Math.exp(-6*k)*Math.sin(k*14); }
  if (b.state === 'bay' || (b.state === 'lane' && v.spd < 0.05)) py += Math.sin(t*38 + b.id*1.7)*0.0035;      // idling
  if (b.cap === 4 && v.spd > 0.5) py += Math.abs(Math.sin(t*14 + b.id))*0.01;                                  // nimble minibus
  const pop = t - v.revealT < 0.5 ? easeOutBack(clamp((t - v.revealT)/0.5, 0, 1), 3) : 1;
  v.body.position.set(px, py, pz); v.body.scale.set(1, pop, 1);
  v.body.rotation.set(v.pitch + extraPitch, 0, v.roll);
  v.brakeMat.emissiveIntensity = 0.1 + v.brakeAmt*2.6;
  v.bGlow.forEach(s => { s.material.opacity = v.brakeAmt*0.95*(1 - dark); });
  const fl = t - v.flashT, flashing = fl > 0 && fl < 0.62 && (fl % 0.31) < 0.16;
  v.headMat.emissiveIntensity = flashing ? 3.2 : 0.25*(1 - dark);
  v.hGlow.forEach(s => { s.material.opacity = flashing ? 1 : 0; });
  if (v.q) v.q.position.y = 1.25 + Math.sin(t*3 + b.id)*0.05;
  if (v.link){ v.link.visible = b.state === 'lane'; v.link.position.y = 1.1 + Math.sin(t*3.4 + b.id)*0.04; }
}
function updateJump(v, t){
  const J = v.jump, u = t - J.t0, b = v.b;
  if (u > C.PARACHUTE_DURATION + 0.8){ v.root.visible = false; removeChute(v); return; }
  v.root.visible = true; v.slope.rotation.x = 0; v.mat.color.setScalar(1);
  let x = J.x, y = J.y, z = J.z, sq = 1, swing = 0;
  if (u < 0.12){ sq = 1 - 0.22*Math.sin(Math.PI*u/0.12); }                                      // squash before the pop
  else if (u < 0.34){ const k = (u - 0.12)/0.22; y += 0.42*Math.sin(Math.PI*k); sq = 1 + 0.16*Math.sin(Math.PI*k); }   // pop up, stretched
  else if (u < 0.8){ const k = (u - 0.34)/0.46; x += J.side*1.9*easeInOut(k); y += 1.0*Math.sin(Math.PI*k*0.6) - 0.1*k; z += 0.3*k; }
  else { const k = u - 0.8;                                                                     // pendulum sway while drifting down and away
    swing = 0.32*Math.sin(k*3.1)*Math.exp(-k*0.35);
    x += J.side*(1.9 + 2.9*k + 0.7*k*k) + Math.sin(swing)*1.1; y += 1.0*Math.sin(Math.PI*0.6) - 0.1 - 0.34*k - (1 - Math.cos(swing))*1.1; z += 0.3 + 0.6*k; }
  if (u > 0.5 && !v.whooshed){ v.whooshed = true; sfx.whoosh(); }
  v.root.position.set(x, y, z);
  v.root.rotation.y = J.h + J.side*Math.min(1, u*1.4)*0.35;
  v.body.position.set(0, 0, 0); v.body.scale.set(1/Math.sqrt(sq), sq, 1/Math.sqrt(sq));
  v.body.rotation.set(0, 0, swing - J.side*0.2*Math.sin(clamp((u - 0.34)/0.46, 0, 1)*Math.PI));
  const open = clamp((u - 0.5)/0.4, 0, 1), s = open > 0 ? easeOutBack(open, 2.6) : 0.01;
  if (v.chute){
    const ch = v.chute, cs = Math.max(0.01, s);
    ch.position.set(x + J.side*0.15 - Math.sin(swing)*0.3, y + 0.75 + 0.95*cs, z - 1.05*cs);
    ch.scale.set(cs, Math.max(0.01, clamp((u - 0.5)/0.25, 0.25, 1))*cs, cs);                 // unfolds: widens, then fills out
    ch.rotation.set(-0.35, 0, -swing*0.5 - J.side*0.12); ch.visible = u > 0.5;
    v.root.updateMatrixWorld(true); ch.updateMatrixWorld(true);
    const Ls = ch.userData.lines, pa = Ls.geometry.attributes.position, W2 = 0.4, Lz = b.len*0.38;
    const corners = [[W2, Lz], [-W2, Lz], [W2, -Lz], [-W2, -Lz]];
    for (let k=0;k<8;k++){
      const a = (k + 0.5)/8*Math.PI*2; _v.set(Math.cos(a)*0.84, 0.02, Math.sin(a)*0.84).applyMatrix4(ch.matrixWorld);
      pa.setXYZ(k*2, _v.x, _v.y, _v.z);
      const cn = corners[k % 4]; _v.set(cn[0], 0.72, cn[1]).applyMatrix4(v.body.matrixWorld); pa.setXYZ(k*2 + 1, _v.x, _v.y, _v.z);
    }
    pa.needsUpdate = true; Ls.visible = ch.visible;
  }
  v.spd = 0; v.brakeMat.emissiveIntensity = 0.1; v.bGlow.forEach(s => s.material.opacity = 0);
}
function updateWheels(){
  let n = 0;
  for (const v of views){
    if (!v.root.visible) continue;
    for (const w of v.wheels){
      _e.set(v.wheelAng, 0, 0, 'XYZ'); _q.setFromEuler(_e); _v.set(w[0], w[1], w[2]);
      _a.compose(_v, _q, _one).premultiply(v.body.matrixWorld); wheelIM.setMatrixAt(n++, _a);
    }
  }
  wheelIM.count = n; wheelIM.instanceMatrix.needsUpdate = true;
}

/* ------------------------------ stickmen ------------------------------ */
function hopColor(k){
  for (const b of game.road){ if (b.nextRamp !== k || b.board) continue; const d = L.RAMPS[k].s - b.rs; if (d > 0 && d < 5) return b.color; }
  const bb = game.road.find(b => b.board && b.board.k === k); return bb ? bb.color : null;
}
function updateMen(t, vdt){
  const hop = L.RAMPS.map((_, k) => hopColor(k));
  scene.updateMatrixWorld();
  for (let i=0;i<game.men.length;i++){
    const m = game.men[i], mv = MV[i];
    if (mv.fly){                                        // tumbling out of a crash: ballistic with bounces
      const f = mv.fly;
      if (!f.rest){ f.v.y -= 9*vdt; f.p.addScaledVector(f.v, vdt); f.r.addScaledVector(f.w, vdt);
        if (f.p.y < 0.02 && f.v.y < 0){ f.p.y = 0.02; f.v.x *= 0.55; f.v.z *= 0.55; f.v.y = -f.v.y*0.42; f.w.multiplyScalar(0.5);
          if (f.v.length() < 0.35){ f.rest = true; f.r.x = Math.PI/2*(frand() < 0.5 ? 1 : -1); } } }
      setMan(i, f.p.x, f.p.y, f.p.z, f.r.y, f.r.x, f.r.z, -0.5 + Math.sin(t*9 + mv.ph)*0.6, 0.6, 1.2, 1.2); continue;
    }
    if (m.state === 'ramp'){
      let stepHop = 0, sy = 1;
      if (mv.t0 >= 0){                                  // staggered column shift with a little overshoot
        const k = clamp((t - mv.t0)/(C.COLUMN_SHIFT_TIME*1.15), 0, 1);
        mv.disp = lerp(mv.from, mv.to, easeOutBack(k, 1.4));
        stepHop = Math.sin(Math.PI*k)*0.08; sy = 1 + 0.08*Math.sin(Math.PI*k);
        if (k >= 1){ mv.t0 = -1; mv.disp = mv.to; }
      }
      const p = slotPos(m, mv.disp), r = L.RAMPS[m.ramp];
      let yaw = Math.atan2(p.fx, p.fz), y = p.y + stepHop + Math.abs(Math.sin(t*mv.bobF + mv.ph))*0.008, swing = 0;
      if (mv.disp < 0.5){ yaw = Math.atan2(r.x - p.x, r.z - p.z);
        if (hop[m.ramp] === m.color && m.revealed){ const hp = Math.abs(Math.sin(t*10 + mv.ph)); y += hp*0.15; sy = 1 + 0.12*(hp - 0.5); swing = 0.9; } }
      mv.lookT -= vdt; if (mv.lookT < 0){ mv.lookT = 2 + frand()*5; mv.lookTo = frand() < 0.35 ? (frand() - 0.5)*1.4 : 0; }
      mv.look += (mv.lookTo - mv.look)*Math.min(1, vdt*4);
      const sway = Math.sin(t*mv.swayF + mv.ph)*mv.swayA;
      setMan(i, p.x, y, p.z, yaw + mv.look, 0, sway, -swing, -swing, 0.15 + swing*1.6, 0.15 + swing*1.6, sy*(1 + 0.015*Math.sin(t*mv.bobF*1.3 + mv.ph)));
      continue;
    }
    const v = views[m.bus], b = v.b;
    if ((b.state === 'jump' && t - b.tJump > C.PARACHUTE_DURATION + 0.8) || !v.root.visible || v.dark > 0.6){ hideMan(i); continue; }
    if (m.state === 'run'){                             // run, crouch (squash), hop arc (stretch) into the seat
      const u = clamp((t - mv.runT)/C.RUN_TIME, 0, 1); seatMatrix(i, seatMat); const T = new THREE.Vector3().setFromMatrixPosition(seatMat);
      const F = mv.runFrom, dx = F.x - T.x, dz = F.z - T.z, dl = Math.hypot(dx, dz) || 1, yaw = Math.atan2(-dx, -dz);
      const E = new THREE.Vector3(T.x + dx/dl*0.62, F.y, T.z + dz/dl*0.62);
      if (u < 0.52){ const k = easeInOut(u/0.52), sw = Math.sin(u/0.52*Math.PI*6);
        setMan(i, lerp(F.x, E.x, k), F.y + Math.abs(Math.sin(u/0.52*Math.PI*3))*0.06, lerp(F.z, E.z, k), yaw, 0.18, 0, sw, -sw, 0.15, 0.15); }
      else if (u < 0.64){ const k = (u - 0.52)/0.12;
        setMan(i, E.x, E.y, E.z, yaw, 0.25, 0, 0.6, 0.6, 0.3, 0.3, 1 - 0.28*Math.sin(Math.PI*k)); }
      else { const k = (u - 0.64)/0.36;
        setMan(i, lerp(E.x, T.x, k), lerp(E.y, T.y, k) + Math.sin(Math.PI*k)*0.48, lerp(E.z, T.z, k), yaw, -0.1, 0, -2.4, -2.4, 0.5, 0.5, 1 + 0.2*Math.sin(Math.PI*k)); }
      continue;
    }
    // seated: sway with the bus (lean, brake lurch), own little sway, bounce on landing, wave under a parachute
    seatMatrix(i, seatMat);
    const land = t - mv.landT, bounce = land < 0.35 ? Math.sin(land/0.35*Math.PI)*Math.exp(-land*4)*0.3 : 0;
    _e.set(v.pitch*1.8 + Math.sin(t*1.9 + mv.ph)*0.02, 0, v.roll*1.6 + Math.sin(t*mv.swayF + mv.ph)*0.04, 'XYZ'); _q.setFromEuler(_e);
    _v.set(0, bounce*0.2, 0); _s.set(MAN_S*(1 + bounce*0.25), MAN_S*(1 - bounce*0.5), MAN_S*(1 + bounce*0.25));
    _a.compose(_v, _q, _s); seatMat.multiply(_a);
    if (b.state === 'jump'){ const w = Math.sin(t*14 + mv.ph)*0.35; setManMatrix(i, seatMat, 0, 0, 2.5 + w, 2.5 - w); }
    else setManMatrix(i, seatMat, -0.35, -0.35, 0.12, 0.12);
  }
  menIM.instanceMatrix.needsUpdate = true; armIM.instanceMatrix.needsUpdate = true;
}

/* ------------------------------ frame ------------------------------ */
function updateScene(vdt){
  const t = game.t;
  for (const v of views) updateBus(v, t, vdt);
  if (crash) updateCrash(t);
  for (const v of views) if (v.chute && v.b.state !== 'jump') removeChute(v);
  updateMen(t, vdt); updateWheels();
  for (let i = fx.length - 1; i >= 0; i--) if (!fx[i](t)) fx.splice(i, 1);
  WD.badges.forEach((b, k) => { if (!b.visible) return; const u = t - b.userData.t0;
    const s = u < 0.55 ? Math.max(0, easeOutBack(clamp(u/0.55, 0, 1), 3)) : 1 + 0.06*Math.sin(t*3);
    if (!b.userData.sparkled && u > 0.25){ b.userData.sparkled = true; sparkle(b.position.clone().add(new THREE.Vector3(0, -0.5, 0)), '#bff7a0', 14, 0.36); sfx.sparkle(); }
    b.scale.set(0.95*s, 1.19*s, 1); b.position.y = WD.rampTops[k].y + 1.15 + Math.sin(t*2.4)*0.06; });
  for (const lp of [WD.lamps.top, WD.lamps.ret]){ const u = t - lp.pulseT, p = u >= 0 && u < 1.2 ? Math.sin(Math.min(1, u/0.15)*Math.PI/2)*Math.exp(-u*2.6) : 0;
    lp.glow.scale.setScalar(0.9 + 1.4*p); lp.glow.material.opacity = 0.75 + 0.25*p + 0.08*Math.sin(t*3); lp.lampMat.color.setRGB(1, 0.88 + 0.12*p, 0.54 + 0.4*p); }
  const free = []; for (let k=0;k<C.STATIC_SLOTS;k++) if (game.bays[k] < 0 && game.bayRes[k] < 0) free.push(k);
  WD.bayGlow.forEach((g, k) => { g.material.opacity = free.length === 1 && free[0] === k && !game.result ? 0.1 + 0.12*(0.5 + 0.5*Math.sin(t*5)) : 0; });
  const txt = `${game.counter}/${C.ROAD_CAPACITY}`, cnt = $('cnt');
  if (cnt.textContent !== txt){ cnt.textContent = txt; cnt.classList.remove('bump'); void cnt.offsetWidth; cnt.classList.add('bump'); }
  $('counter').classList.toggle('full', game.counter >= C.ROAD_CAPACITY);
  if (t >= winAt && !$('winPanel').classList.contains('show')) $('winPanel').classList.add('show');
  if (t >= failAt && !$('failPanel').classList.contains('show')) $('failPanel').classList.add('show');
  if (t >= winSoundAt){ winSoundAt = Infinity; sfx.win(); }
  if (DEBUG) updateDebug();
}
function updateDebug(){
  let n = 0;
  game.ramps.forEach((r, k) => r.cols.forEach((col, c) => { if (!col.length) return; const s = L.RAMPS[k].slots[c][0];
    WD.ringIM.setMatrixAt(n++, M(s.x, s.y + 0.02, s.z)); }));
  WD.ringIM.count = n; WD.ringIM.instanceMatrix.needsUpdate = true;
  const onRoad = game.road.length, heading = game.toRoad, back = game.buses.filter(b => b.state === 'tunnel' || b.state === 'return').length;
  const sum = onRoad + heading + back, fc = C.frontColors(game);
  const nextDest = sum < C.ROAD_CAPACITY ? 'MAIN ROAD' : C.freeBay(game) >= 0 ? 'BAY ' + (C.freeBay(game) + 1) : 'REFUSED (shake)';
  $('dbg').textContent =
    `road ${onRoad} + heading ${heading} + tunnel/return ${back}\n= ${sum} / ${C.ROAD_CAPACITY}   next lane tap -> ${nextDest}\n` +
    `counter ${game.counter}/${C.ROAD_CAPACITY}   free bays ${[0,1,2,3,4].filter(k => game.bays[k] < 0 && game.bayRes[k] < 0).map(k => k + 1).join(',') || '-'}\n` +
    `front rows: ` + C.COLORS.filter(c => fc[c]).map(c => c + ' ' + fc[c]).join(', ') + `\n` +
    `boarded ${game.landed}/${game.men.length}   t ${game.t.toFixed(1)}s   speed ${timeScale}x` + (botOn ? '   BOT' : '');
}

/* -------------------------------- input -------------------------------- */
function screenOf(x, y, z){ camera.updateMatrixWorld(); _v.set(x, y, z).project(camera); return [(_v.x + 1)/2*DW, (1 - _v.y)/2*DH]; }
function busScreenBox(b){
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const sx of [-0.5, 0.5]) for (const sz of [-0.5, 0.5]) for (const yy of [0, 0.8]){
    const px = b.x + sx*C.BUS_W*(-b.dz) + sz*b.len*b.dx, pz = b.z + sx*C.BUS_W*b.dx + sz*b.len*b.dz;
    const [u, w] = screenOf(px, yy, pz); x0 = Math.min(x0, u); x1 = Math.max(x1, u); y0 = Math.min(y0, w); y1 = Math.max(y1, w); }
  return [x0, y0, x1, y1];
}
function pick(px, py){
  let best = null, bd = 1e9;
  const test = (b, act) => { const [x0, y0, x1, y1] = busScreenBox(b), pad = 12;
    if (px < x0 - pad || px > x1 + pad || py < y0 - pad || py > y1 + pad) return;
    const d = Math.hypot(px - (x0 + x1)/2, py - (y0 + y1)/2); if (d < bd){ bd = d; best = act; } };
  game.lanes.forEach((lane, l) => lane.forEach(id => test(game.buses[id], {kind:'lane', idx:l})));
  game.bays.forEach((id, k) => { if (id >= 0) test(game.buses[id], {kind:'bay', idx:k}); });
  return best;
}
function doAction(a){ return C.applyAction(game, a); }
app.addEventListener('pointerdown', e => {
  audio();
  if (e.target.closest('.rbtn') || e.target.closest('.panel') || e.target.closest('#settings')) return;
  $('settings').classList.remove('open');
  const r = app.getBoundingClientRect(), px = (e.clientX - r.left)/r.width*DW, py = (e.clientY - r.top)/r.height*DH;
  const a = pick(px, py); if (a) doAction(a);
});
function setBot(on){ botOn = on; botT = 0; $('botTag').style.display = botOn ? 'block' : 'none'; }
function setSpeed(s){ timeScale = s; $('btnSpeed').textContent = s + 'x'; $('btnSpeed').classList.toggle('on', s > 1); }
$('btnRestart').addEventListener('click', () => { audio(); resetGame(); });
$('btnReplay').addEventListener('click', () => { audio(); resetGame(); });
$('btnRetry').addEventListener('click', () => { audio(); resetGame(); });
$('btnSpeed').addEventListener('click', () => { audio(); setSpeed(timeScale > 1 ? 1 : 2); });
$('btnSettings').addEventListener('click', () => { audio(); $('settings').classList.toggle('open'); });
$('btnMute').addEventListener('click', () => { audio(); setMuted(!muted); });
$('btnBuiltin').addEventListener('click', () => { loadLevel(C.LEVEL_DATA, 'builtin'); $('settings').classList.remove('open'); });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'd'){ DEBUG = !DEBUG; WD.dbgGroup.visible = DEBUG; $('dbg').style.display = DEBUG ? 'block' : 'none'; }
  if (k === 'b') setBot(!botOn);
  if (k === 'r') resetGame();
});
function placeCounter(){
  const [, y] = screenOf(C.X_SIDE + 1.5, 0.9, 1.7);
  Object.assign($('counter').style, {left: (L && L.TUNNEL.side < 0 ? 60 : DW - 60) + 'px', top: y + 'px'});
}

/* --------------------------------- loop ---------------------------------
   One global time scale (1x / 2x) drives the fixed-step core and every animation.
   During a crash the scale drops briefly for a slow-motion beat.  Sounds are never scaled. */
const FIXED = 1/60;
function tick(){
  if (botOn && !game.result){ botT -= FIXED; if (botT <= 0){ botT += C.BOT_THINK; const a = C.greedyPick(game); if (a) doAction(a); } }
  C.step(game, FIXED); handleEvents();
}
function effectiveScale(){
  if (!crash) return timeScale;
  const u = game.t - crash.t0; return timeScale*(u > 0.55 && u < 1.05 ? 0.28 : 1);
}
let last = performance.now(), acc = 0, frozen = false;
function pump(dt){                                    // advance by `dt` real seconds through the time scale
  const gdt = dt*effectiveScale();
  if (!frozen){ acc += gdt; let n = 0; while (acc >= FIXED && n < 14){ tick(); acc -= FIXED; n++; } if (n === 14) acc = 0; }
  updateScene(frozen ? 0 : gdt);
  updateHum();
}
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  pump(dt);
  camera.position.set(CAM.pos[0] + (shake ? (frand() - 0.5)*shake : 0), CAM.pos[1] + (shake ? (frand() - 0.5)*shake : 0), CAM.pos[2]);
  renderer.render(scene, TOPVIEW ? topCam : camera);
}
setMuted(muted);
const [lv0, src0] = initialLevel();
loadLevel(lv0, src0);
fit();
requestAnimationFrame(frame);
// an open editor answers a hello with its current level (only to this game instance)
helloId = 'g' + Math.random().toString(36).slice(2);
if (parent !== window) parent.postMessage({type:'hello', hello:helloId}, '*');
else if (chan) chan.postMessage({type:'hello', hello:helloId});

/* test hooks */
window.__me = {
  C, get game(){ return game; }, get LEVEL(){ return LEVEL; }, get levelSource(){ return levelSource; }, get layout(){ return L; },
  get timeScale(){ return timeScale; }, get muted(){ return muted; }, get views(){ return views; }, get crash(){ return crash; },
  get serial(){ return levelSerial; }, camera, scene, renderer, CAM, pump, setSpeed, setMuted, loadLevel,
  advance(sec){ const n = Math.round(sec/FIXED); for (let i=0;i<n;i++){ tick(); if (i % 4 === 0) updateScene(FIXED*4); } updateScene(FIXED); },
  tapLane(l){ return C.tapLane(game, l); }, tapBay(k){ return C.tapBay(game, k); }, pick, screenOf, busScreenBox,
  setBot, setDebug(v){ DEBUG = v; WD.dbgGroup.visible = v; $('dbg').style.display = v ? 'block' : 'none'; },
  freeze(v){ frozen = v; }, restart: () => resetGame(), render(){ updateScene(0); renderer.render(scene, camera); }
};
